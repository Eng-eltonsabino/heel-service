function simBuild(){const s=S.sim,n=Math.max(1,Math.min(50,Math.floor(s.n)||1)),old=s.clientes;
  const parte=Math.floor(s.capital/n*100)/100;
  s.clientes=Array.from({length:n},(_,i)=>({nome:old[i]?.nome||"Cliente "+(i+1),valor:i===n-1?r2(s.capital-parte*(n-1)):parte,taxa:old[i]?.taxa??s.taxa}))}
function simRows(){
  const s=S.sim;
  $("#sRows").innerHTML=s.clientes.map((c,i)=>`<tr><td><input data-si="${i}" data-sf="nome" value="${esc(c.nome)}" list="sMutList" aria-label="Nome do cliente ${i+1}" style="min-width:180px"></td>
    <td><input data-si="${i}" data-sf="valor" type="number" min="0" step="any" value="${c.valor}" aria-label="Valor" style="min-width:110px"></td><td><input data-si="${i}" data-sf="taxa" type="number" min="0" step="any" value="${c.taxa}" aria-label="Taxa" style="min-width:80px"></td>
    <td class="num" data-sc="ji${i}"></td><td class="num" data-sc="pm${i}"></td><td class="num" data-sc="tt${i}"></td><td><button type="button" class="x" data-simdel="${i}" aria-label="Remover cliente">×</button></td></tr>`).join("");
  $("#sN").value=s.clientes.length;calcSim();rotularTabelas();
}
function simTotais(){const s=S.sim,m=Math.max(1,Math.min(60,Math.floor(s.meses)||1));let sA=0,sI=0,sP=0;
  const linhas=s.clientes.map(c=>{const it=r2(c.valor*c.taxa/100),pay=r2(c.valor/m+it);sA=r2(sA+c.valor);sI=r2(sI+it);sP=r2(sP+pay);return{it,pay,tot:r2(c.valor+it*m)}});
  const prof=r2(sI*m);return{m,sA,sI,sP,gross:r2(sA+prof),prof,roi:sA>0?prof/sA*100:0,linhas}}
function calcSim(){
  if(!$("#sKpis"))return;const s=S.sim,t=simTotais();
  t.linhas.forEach((l,i)=>{const q=k=>document.querySelector(`[data-sc="${k}${i}"]`);q("ji").textContent=mt(l.it);q("pm").textContent=mt(l.pay);q("tt").textContent=mt(l.tot)});
  $("#sFoot").innerHTML=`<tr><td><b>Total</b></td><td class="num"><b>${mt(t.sA)}</b></td><td></td><td class="num"><b>${mt(t.sI)}</b></td><td class="num"><b>${mt(t.sP)}</b></td><td class="num"><b>${mt(t.gross)}</b></td><td></td></tr>`;
  $("#sKpis").innerHTML=kpis5(t,s.clientes.length+" "+(s.clientes.length===1?"cliente":"clientes")).replace("valor emprestado + juros","valor emprestado + juros de "+t.m+" "+(t.m===1?"mês":"meses"));
  document.querySelectorAll("[data-simm]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.simm===t.m));
  const diff=r2(s.capital-t.sA),a=$("#sAlloc");
  if(diff<-0.005){a.className="hint bad";a.textContent="Atenção: os valores passam a quantia investida em "+mt(-diff)+"."}
  else{a.className="hint";a.textContent=diff>0.005?"Ainda por emprestar: "+mt(diff):"Toda a quantia investida está distribuída."}
}
function ligarSim(){
  const s=S.sim;if(!s.clientes.length)simBuild();
  const num=id=>Number($(id).value)||0;
  $("#sCap").addEventListener("input",()=>{s.capital=num("#sCap");simBuild();simRows()});
  $("#sN").addEventListener("input",()=>{s.n=num("#sN");simBuild();simRows()});
  $("#sTaxa").addEventListener("input",()=>{s.taxa=num("#sTaxa");simBuild();simRows()});
  $("#sMeses").addEventListener("input",()=>{s.meses=num("#sMeses");calcSim()});
  $("#sRows").addEventListener("input",e=>{const t=e.target,i=+t.dataset.si,f=t.dataset.sf;if(!f)return;if(f==="nome")s.clientes[i].nome=t.value;else s.clientes[i][f]=Number(t.value)||0;calcSim()});

}
function simMeses(m){const s=S.sim;s.meses=Math.max(1,Math.min(60,m));$("#sMeses").value=s.meses;calcSim()}
function simAdd(){const s=S.sim,used=soma(s.clientes,c=>c.valor);s.clientes.push({nome:"Cliente "+(s.clientes.length+1),valor:r2(Math.max(0,s.capital-used)),taxa:s.taxa});s.n=s.clientes.length;simRows()}
function simDividir(){const s=S.sim,n=s.clientes.length,parte=Math.floor(s.capital/n*100)/100;s.clientes.forEach((c,i)=>c.valor=i===n-1?r2(s.capital-parte*(n-1)):parte);simRows()}
function simDel(i){const s=S.sim;if(s.clientes.length<2)return;s.clientes.splice(i,1);s.n=s.clientes.length;simRows()}

    ${genericos.length?`<p class="note" style="color:var(--warn)">${genericos.length} cliente${genericos.length>1?"s têm":" tem"} ainda um nome genérico (“Cliente 1”…). Pode criar assim e corrigir depois em Mutuários, mas é melhor escrever os nomes reais antes.</p>`:""}
    <label class="f check"><input type="checkbox" id="sGuardaCap" checked> Guardar ${mt(s.capital)} como quantia investida</label>

  $("#dform").onsubmit=async e=>{e.preventDefault();const bt=dlg.querySelector("[type=submit]");bt.disabled=true;bt.textContent="A criar…";

      await criarEmprestimo(m,c.valor,c.taxa,t.m,hoje(),addMeses(hoje(),1),"");k++}
    fechar();toast(k+" empréstimo"+(k===1?"":"s")+" criado"+(k===1?"":"s"));S.sim=null;S.mfiltro="ativos";showTab("clientes")};
}
async function criarEmprestimo(m,valor,taxa,meses,inicio,primeira,garantia){

/* ---- valores por extenso (meticais) ---- */
const EX_U=["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","catorze","quinze","dezasseis","dezassete","dezoito","dezanove"];
const EX_D=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const EX_C=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
function ex999(n){if(n===100)return"cem";const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(EX_C[c]);if(r)p.push(r<20?EX_U[r]:EX_D[Math.floor(r/10)]+(r%10?" e "+EX_U[r%10]:""));return p.join(" e ")}
function exInt(n){
  if(!n)return"zero";const g=[];let x=n;while(x>0){g.push(x%1000);x=Math.floor(x/1000)}
  const nomes=[v=>ex999(v),v=>v===1?"mil":ex999(v)+" mil",v=>ex999(v)+(v===1?" milhão":" milhões"),v=>v===1?"mil milhões":ex999(v)+" mil milhões"];
  const partes=[];for(let i=g.length-1;i>=0;i--)if(g[i])partes.push({v:g[i],t:(nomes[i]||nomes[0])(g[i])});
  return partes.map((p,i)=>i===0?p.t:((i===partes.length-1&&(p.v<100||p.v%100===0))?" e ":" ")+p.t).join("");
}
function extensoMT(v){
  const cts=Math.round((Number(v)||0)*100),i=Math.floor(cts/100),c=cts%100;
  let s=exInt(i)+(i>=1e6&&i%1e6===0?" de":"")+(i===1?" metical":" meticais");
  if(c)s+=" e "+exInt(c)+(c===1?" centavo":" centavos");return s;
}
const dataLonga=d=>{if(!d)return"____ de ______________ de ______";const[y,m,dd]=d.split("-").map(Number);return new Date(y,m-1,dd).toLocaleDateString("pt-PT",{day:"numeric",month:"long",year:"numeric"})};
const ORD=["","Primeira","Segunda","Terceira","Quarta","Quinta","Sexta","Sétima","Oitava","Nona","Décima","Décima Primeira","Décima Segunda","Décima Terceira","Décima Quarta","Décima Quinta","Décima Sexta","Décima Sétima","Décima Oitava","Décima Nona","Vigésima"];

async function ctrAcao(a,k,id,b){
  const arr=CTR[k].arr(),c=arr.find(x=>x.id===id);
  if(a==="ctr-novo")return abrirContrato(k);
  if(a==="ctr-abrir")return abrirContrato(k,id);
  if(a==="ctr-pdf"){if(c)guardarPDF(()=>pdfContrato(c));return}
  if(a==="ctr-filtro"){S.cfiltro=b.dataset.f;refCtr(k);return}
  if(a==="ctr-estado"&&c){await store.put(CTR[k].col,{...c,estado:b.dataset.e,assinadoEm:b.dataset.e==="assinado"?hoje():""});fechar();toast(b.dataset.e==="assinado"?"Contrato marcado como assinado":"Contrato marcado como por assinar");return}
  if(a==="ctr-apagar"&&c){if(confirmar(b,"Confirmar eliminação")){await store.del(CTR[k].col,id);fechar();toast("Contrato eliminado")}return}
}

/* ---------- numbers ---------- */
function relCalc(P){
  const inP=d=>{const k=String(d||"").slice(0,7);return k>=P.de&&k<=P.ate};
  const porMes={};P.meses.forEach(k=>porMes[k]={serv:0,iptv:0,mc:0,prev:0,nIptv:0});
  const addM=(d,c,v)=>{const k=String(d||"").slice(0,7);if(porMes[k])porMes[k][c]=r2(porMes[k][c]+(Number(v)||0))};
  /* serviços */
  const sv={},rec=S.vdocs.filter(x=>x.tipo==="recibo"&&x.estado!=="anulado"&&inP(x.data));
  rec.forEach(x=>addM(x.data,"serv",x.total));
  sv.recebido=soma(rec,x=>x.total);sv.nRec=rec.length;sv.medio=rec.length?r2(sv.recebido/rec.length):0;
  const cot=S.vdocs.filter(x=>x.tipo==="cotacao"&&inP(x.data)),vivas=cot.filter(x=>x.estado!=="anulado");
  sv.nCot=vivas.length;sv.valCot=soma(vivas,x=>x.total);
  const est={aceite:0,pendente:0,caducada:0,anulado:0};cot.forEach(d=>{const e=estadoCot(d);est[e]=(est[e]||0)+1});sv.estCot=est;
  const resp=est.aceite+est.caducada+est.anulado;sv.taxa=resp?Math.round(est.aceite/resp*100):null;
  const cat={},top={};
  rec.forEach(d=>(d.itens||[]).forEach(i=>{const ds=String(i.desc||"");if(/^(IVA|Desconto)/i.test(ds))return;const v=linhaTot(itemCot(i));if(!(v>0))return;
    const s=S.servicos.find(x=>x.id&&(x.id===i.sid||x.id===i.servicoId))||S.servicos.find(x=>x.nome===ds)||S.servicos.find(x=>x.nome&&ds.startsWith(x.nome));
    const c=(s&&s.categoria)||"Outros",nm=s?s.nome:ds;cat[c]=r2((cat[c]||0)+v);top[nm]=r2((top[nm]||0)+v)}));
  sv.cat=cat;sv.top=top;sv.nCli=new Set(rec.map(d=>d.clienteId||d.cliente?.nome)).size;
  /* IPTV */
  const tv={},tr=S.docs.filter(x=>x.tipo==="recibo"&&x.estado!=="anulado"&&inP(x.data));
  tr.forEach(x=>{addM(x.data,"iptv",x.total);addM(x.data,"nIptv",1)});
  tv.recebido=soma(tr,x=>x.total);tv.nRec=tr.length;tv.medio=tr.length?r2(tv.recebido/tr.length):0;
  tv.novos=S.clientes.filter(c=>inP(String(c.criadoEm||c.inicio||"").slice(0,10))).length;
  const pl={};tr.forEach(d=>(d.itens||[]).forEach(i=>{const ds=String(i.desc||""),v=r2((Number(i.qtd)||0)*(Number(i.preco)||0));if(!(v>0))return;
    const p=(S.cfg.planos||[]).find(p=>p.nome&&ds.includes(p.nome));const k=p?p.nome:"Outros";pl[k]=r2((pl[k]||0)+v)}));
  tv.planos=pl;
  /* microcrédito */
  const mc={capRec:0,jurRec:0,recebido:0,nPag:0};
  S.emprestimos.forEach(e=>{if(e.estado==="anulado")return;const share=Number(e.total)>0?Math.min(1,Number(e.valor)/Number(e.total)):1;
    (e.pagamentos||[]).forEach(p=>{if(!inP(p.data))return;const v=Number(p.valor)||0;mc.recebido=r2(mc.recebido+v);mc.nPag++;mc.capRec=r2(mc.capRec+v*share);addM(p.data,"mc",v)});
    (e.prestacoes||[]).forEach(p=>{if(inP(p.venc))addM(p.venc,"prev",p.valor)})});
  mc.jurRec=r2(mc.recebido-mc.capRec);
  const conc=S.emprestimos.filter(e=>e.estado!=="anulado"&&inP(e.inicio||String(e.criadoEm||"").slice(0,10)));
  mc.nEmp=conc.length;mc.emprestado=soma(conc,e=>e.valor);mc.jurosContratados=soma(conc,e=>e.juros);
  mc.previsto=soma(P.meses,k=>porMes[k].prev);
  const total=r2(sv.recebido+tv.recebido+mc.recebido);
  return{P,sv,tv,mc,porMes,total,por:{serv:sv.recebido,iptv:tv.recebido,mc:mc.recebido}};
}

/* two-line legend rows: name and share, then the value underneath */
function rLegenda(pdf,x,y,w,its,tot,{valor=mt}={}){
  its.forEach((it,i)=>{const yy=y+i*8.4;pdf.setFillColor(...it.cor);pdf.rect(x,yy-2.6,3,3,"F");
    const p=tot>0?Math.round(it.v/tot*100):0;pdf.setFont("helvetica","normal");pdf.setFontSize(7.6);

function rDonut(pdf,cx,cy,R,ri,its,centro){
  const tot=its.reduce((s,x)=>s+Math.max(0,x.v),0);
  if(!(tot>0)){pdf.setDrawColor(...RGRID);pdf.setLineWidth(R-ri);pdf.circle(cx,cy,(R+ri)/2,"S");rT(pdf,"Sem dados",cx,cy+1.2,{s:7.5,c:RMUT,al:"center"});return}
  let a=-Math.PI/2;const cortes=[];
  its.forEach(it=>{if(!(it.v>0))return;const sw=it.v/tot*2*Math.PI,st=Math.max(2,Math.ceil(sw/(Math.PI/90))),pts=[];
    for(let i=0;i<=st;i++){const t=a+sw*i/st;pts.push([cx+R*Math.cos(t),cy+R*Math.sin(t)])}
    for(let i=st;i>=0;i--){const t=a+sw*i/st;pts.push([cx+ri*Math.cos(t),cy+ri*Math.sin(t)])}
    pdf.setFillColor(...it.cor);rPoly(pdf,pts);cortes.push(a);a+=sw});
  if(cortes.length>1){pdf.setDrawColor(255,255,255);pdf.setLineWidth(0.7);cortes.forEach(t=>pdf.line(cx+(ri-0.3)*Math.cos(t),cy+(ri-0.3)*Math.sin(t),cx+(R+0.3)*Math.cos(t),cy+(R+0.3)*Math.sin(t)))}
  if(centro){rT(pdf,centro[0],cx,cy+0.4,{s:centro[0].length>8?7.6:9,b:true,al:"center"});rT(pdf,centro[1],cx,cy+4.2,{s:6.4,c:RMUT,al:"center"})}

/* a donut with its legend beside it, in a box of width w */
function rDonutBloco(pdf,x,y,w,titulo,sub,its,centro,o){

  const tot=its.reduce((s,i)=>s+Math.max(0,i.v),0),R=17,vis=its.filter(i=>i.v>0).slice(0,6);rDonut(pdf,x+R+1,yy+R+2,R,R*0.6,its,centro);

/* fold to at most n slices: the rest becomes "Outros" */
function rFatias(obj,n,nomeOutros="Outros"){
  const ent=Object.entries(obj).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);let out=ent.slice(0,n),resto=ent.slice(n);
  const o=out.findIndex(([k])=>k===nomeOutros);let extra=resto.reduce((s,[,v])=>s+v,0);
  if(o>=0){extra+=out[o][1];out.splice(o,1)}
  const its=out.map(([k,v],i)=>({nome:k,v,cor:RCAT[i]}));if(extra>0)its.push({nome:nomeOutros,v:r2(extra),cor:ROUTROS});return its;
}
function rPasso(m){if(!(m>0))return 1;const raw=m/4,p=10**Math.floor(Math.log10(raw)),f=[1,2,2.5,5,10].find(s=>s*p>=raw);return f*p}
/* vertical bars: series stacked or side by side; s.cores (one per category) lets a series carry each category's colour */
function rBarras(pdf,{x,y,w,h,cats,series,modo="stack",rotulos=true,fmt=relCmp,destaque=-1}){
  const n=cats.length,pl=x+13,pw=w-13,somaCat=i=>series.reduce((s,se)=>s+Math.max(0,se.vals[i]||0),0);
  const mx=modo==="stack"?Math.max(0,...cats.map((_,i)=>somaCat(i))):Math.max(0,...series.flatMap(s=>s.vals));
  const st=rPasso(mx),top=Math.max(st,Math.ceil(mx/st)*st),Y=v=>y+h-(v/top)*h;
  pdf.setLineWidth(0.15);
  for(let t=0;t<=top+1e-9;t+=st){const yy=Y(t);pdf.setDrawColor(...(t===0?[150,156,168]:RGRID));pdf.line(pl,yy,x+w,yy);rT(pdf,relCmp(t),pl-2,yy+1,{s:6.2,c:RMUT,al:"right"})}
  const sw=pw/Math.max(1,n),bw=Math.min(sw*(modo==="group"?0.74:0.6),modo==="group"?16:12),salto=n>14?Math.ceil(n/12):1;
  cats.forEach((c,i)=>{const cx=pl+sw*i+sw/2;
    if(modo==="stack"){let acc=0;series.forEach(se=>{const v=Math.max(0,se.vals[i]||0);if(!v)return;const y1=Y(acc+v),y0=Y(acc);pdf.setFillColor(...se.cor);pdf.rect(cx-bw/2,y1,bw,Math.max(0.2,y0-y1-0.35),"F");acc+=v});
      if(rotulos&&acc>0&&(n<=12||i===destaque))rT(pdf,fmt(acc),cx,Y(acc)-1.4,{s:6.2,b:i===destaque,c:i===destaque?INK:RMUT,al:"center"})}

}

let correndo=false;

  for(const p of plano.slice(0,40)){const res={tipo:p.tipo,ref:p.ref,nome:p.nome,marco:p.marco,auto:true,assunto:p.email?.assunto||"SMS",canais:[]};
    if(p.email)try{await mcp.callTool("Gmail","send_message",{to:[p.email.para],subject:p.email.assunto,body:p.email.texto},{cache:false});res.canais.push("e-mail");res.email=p.email.para}catch(e){res.erroEmail=erroGmail(e);if(["consent_required","not_granted","server_not_connected"].includes(e?.code))break}
    if(p.sms)try{await mcp.callTool("Gmail","send_message",{to:[p.sms.para],subject:S.scfg.assunto||"SMS",body:p.sms.texto},{cache:false});res.canais.push("SMS");res.sms=p.sms.numero}catch(e){res.erroSms=erroGmail(e)}
    res.ok=res.canais.length>0;if(res.ok)r.enviados++;else r.falhas++;await registarLocal(res.ok?p.id:p.id+"_falha_"+hoje(),res)}
  try{await store.cfg("aestado","config/automacao_estado",r)}catch(_){}
  correndo=false;if(!silencioso)toast(r.enviados?r.enviados+" aviso"+(r.enviados>1?"s":"")+" enviado"+(r.enviados>1?"s":""):"Não havia avisos por enviar");return r;
}

let sb=null;
const SUPA=()=>window.HS_SUPA;
/* Same calls as the claude.ai database, backed by the "registos" table with live updates. */
function criarSupaDB(cliente){
  const cache={},ouv=new Set();let pend=false,canal=null;
  const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
  const avisar=()=>{if(pend)return;pend=true;setTimeout(()=>{pend=false;ouv.forEach(f=>{try{f()}catch(e){console.error(e)}})},0)};
  const snapDoc=(c,id)=>{const v=cache[c]?.[id];return{id,exists:!!v,data:()=>v?clone(v):undefined}};
  const snapCol=c=>{const o=cache[c]||{};return{docs:Object.keys(o).map(id=>({id,exists:true,data:()=>clone(o[id])}))}};
  const falhou=(e,acao)=>{console.error(e);const m=String(e?.message||"");toast(/JWT|token|session/i.test(m)?"A sessão expirou. Entre de novo.":"Não foi possível "+acao+". Verifique a Internet e tente de novo.")};
  const ref=(c,id)=>({id,
    get:async()=>snapDoc(c,id),
    set:async v=>{(cache[c]=cache[c]||{})[id]=clone(v);avisar();const{error}=await cliente.from("registos").upsert({col:c,id,data:v});if(error){falhou(error,"guardar");throw error}},
    delete:async()=>{if(cache[c])delete cache[c][id];avisar();const{error}=await cliente.from("registos").delete().eq("col",c).eq("id",id);if(error){falhou(error,"eliminar");throw error}},
    onSnapshot:cb=>{const f=()=>cb(snapDoc(c,id));ouv.add(f);setTimeout(f,0);return()=>ouv.delete(f)}});
  return{supa:true,
    async carregar(){for(const k in cache)delete cache[k];let de=0;const passo=1000;
      for(;;){const{data,error}=await cliente.from("registos").select("col,id,data").order("col").order("id").range(de,de+passo-1);if(error)throw error;
        data.forEach(r=>{(cache[r.col]=cache[r.col]||{})[r.id]=r.data});if(data.length<passo)break;de+=passo}
      if(canal)cliente.removeChannel(canal);
      canal=cliente.channel("registos-live").on("postgres_changes",{event:"*",schema:"public",table:"registos"},p=>{
        if(p.eventType==="DELETE"){const o=p.old||{};if(cache[o.col])delete cache[o.col][o.id]}else{const n=p.new;(cache[n.col]=cache[n.col]||{})[n.id]=n.data}avisar()}).subscribe();
      avisar()},
    parar(){if(canal){cliente.removeChannel(canal);canal=null}for(const k in cache)delete cache[k]},
    doc:p=>{const[c,id]=p.split("/");return ref(c,id)},
    collection:c=>({doc:id=>ref(c,id),onSnapshot:cb=>{const f=()=>cb(snapCol(c));ouv.add(f);setTimeout(f,0);return()=>ouv.delete(f)}})};
}
/* calls the user-management function; sends the session token when there is one */
async function fnUtilizadores(corpo){
  const s=(await sb.auth.getSession()).data.session;
  const h={"Content-Type":"application/json",apikey:SUPA().key};if(s)h.Authorization="Bearer "+s.access_token;
  let r;try{r=await fetch(SUPA().url+"/functions/v1/utilizadores",{method:"POST",headers:h,body:JSON.stringify(corpo)})}catch(e){throw new Error("Sem ligação ao servidor. Verifique a Internet.")}
  let j={};try{j=await r.json()}catch(_){}
  if(!r.ok)throw new Error(j.erro||"O servidor respondeu com erro ("+r.status+").");return j;
}
/* sends e-mail/SMS through the server (Gmail) */
async function fnMensagens(corpo){
  const s=(await sb.auth.getSession()).data.session;
  const h={"Content-Type":"application/json",apikey:SUPA().key};if(s)h.Authorization="Bearer "+s.access_token;

  let j={};try{j=await r.json()}catch(_){}
  if(!r.ok)throw new Error(j.erro||"O servidor respondeu com erro ("+r.status+").");return j;
}

const urlRecuperacao=()=>location.origin+location.pathname;
let emRecuperacao=/type=recovery/.test(location.hash);
const erroLink=(()=>{const m=/error_description=([^&]+)/.exec(location.hash);return m?decodeURIComponent(m[1].replace(/\+/g," ")):""})();
function limparEndereco(){try{history.replaceState(null,"",location.pathname+location.search)}catch(_){}}
async function supaGate(){
  telaAuth("A verificar acesso…","");
  if(erroLink){limparEndereco();emRecuperacao=false;return telaLoginEmail("O link de recuperação expirou ou já foi usado. Peça um novo em “Esqueci a senha”.")}
  if(emRecuperacao){sb.auth.onAuthStateChange((ev,s)=>{if(s&&emRecuperacao){emRecuperacao=false;telaNovaSenha(s.user.email)}});
    const{data}=await sb.auth.getSession();if(data.session){emRecuperacao=false;return telaNovaSenha(data.session.user.email)}
    setTimeout(()=>{if(emRecuperacao){emRecuperacao=false;limparEndereco();telaLoginEmail("Não foi possível validar o link. Peça um novo em “Esqueci a senha”.")}},6000);return}
  try{const{data}=await sb.auth.getSession();
    if(data.session)return supaEntrar(data.session.user.email);
    const e=await fnUtilizadores({acao:"estado"});
    if(!e.temAdmin)return telaPrimeiroAdmin();
    telaLoginEmail();
  }catch(err){console.error(err);telaAuth("Sem ligação","Não foi possível contactar o servidor. Verifique a Internet e recarregue a página.",`<button class="btn pri" onclick="location.reload()">Tentar de novo</button>`)}
}

/* ================= tema claro/escuro, notificações e efeitos ================= */
const TEMA_K="hs_tema";
function lerTema(){try{return localStorage.getItem(TEMA_K)}catch(_){return null}}
function gravarTema(t){try{localStorage.setItem(TEMA_K,t)}catch(_){}}
const mqEscuro=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
function temaEfetivo(){const t=document.documentElement.dataset.theme;if(t==="dark"||t==="light")return t;return mqEscuro&&mqEscuro.matches?"dark":"light"}
function iconeTema(){const b=$("#btnTema");if(!b)return;const t=temaEfetivo();b.dataset.t=t;b.setAttribute("aria-label",t==="dark"?"Mudar para o tema claro":"Mudar para o tema escuro");b.title=t==="dark"?"Tema claro":"Tema escuro"}
function aplicarTema(t){if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;iconeTema()}
function iniciarTema(){aplicarTema(lerTema());if(mqEscuro&&mqEscuro.addEventListener)mqEscuro.addEventListener("change",iconeTema)}
function trocarTema(){
  const novo=temaEfetivo()==="dark"?"light":"dark";gravarTema(novo);
  const b=$("#btnTema"),r=b?b.getBoundingClientRect():{left:innerWidth,top:0,width:0,height:0},x=r.left+r.width/2,y=r.top+r.height/2;
  b&&b.classList.remove("spin");void(b&&b.offsetWidth);b&&b.classList.add("spin");
  if(document.startViewTransition&&!calmo()){
    const vt=document.startViewTransition(()=>aplicarTema(novo));
    vt.ready.then(()=>{const R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
      document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},{duration:700,easing:"cubic-bezier(.2,.8,.2,1)",pseudoElement:"::view-transition-new(root)"})}).catch(()=>{});
  }else{const h=document.documentElement;h.classList.add("tema-anim");aplicarTema(novo);setTimeout(()=>h.classList.remove("tema-anim"),700)}
  toast(novo==="dark"?"Tema escuro ativado":"Tema claro ativado");
}

function alertas(){

    if(s.k==="atraso")out.push({biz:"micro",tab:"clientes",nv:3,t:nome,d:mt(s.atrasoValor)+" em atraso"+(s.diasAtraso?" há "+s.diasAtraso+" d":""),act:"ver-emp",id:e.id,btn:"Ver",ord:-s.diasAtraso});

function subscrever(){
  const err=e=>{console.error(e);if(e&&e.code==="revoked")toast("O acesso aos dados foi retirado nesta vista.")};
  const fixCfg=(base,d)=>{const c={...base,...d};if(base.planos&&(!Array.isArray(c.planos)||!c.planos.length))c.planos=PLANOS_PADRAO;return c};
  let pend=9;const pronto=()=>{if(--pend===0){S.ready=true;refresh();notifAuto();autoDiario();return}refresh()};
  const once=f=>{let first=true;return s=>{f(s);if(first){first=false;pronto()}else refresh()}};
  unsubs.push(db.doc("config/negocio").onSnapshot(s=>{S.cfg=fixCfg(CFG_IPTV,s.exists?s.data():{});refresh()},err));
  unsubs.push(db.doc("config/servicos").onSnapshot(s=>{S.vcfg={...CFG_SERV,...(s.exists?s.data():{})};refresh()},err));
  unsubs.push(db.collection("sv_servicos").onSnapshot(once(s=>{S.servicos=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
  unsubs.push(db.collection("sv_clientes").onSnapshot(once(s=>{S.vclientes=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
  unsubs.push(db.collection("sv_documentos").onSnapshot(once(s=>{S.vdocs=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
  unsubs.push(db.doc("config/sms").onSnapshot(s=>{S.scfg={...CFG_SMS,...(s.exists?s.data():{})};refresh()},err));
  unsubs.push(db.doc("config/microcredito").onSnapshot(s=>{S.mcfg=fixCfg(CFG_MICRO,s.exists?s.data():{});refresh()},err));
  unsubs.push(db.collection("clientes").onSnapshot(once(s=>{S.clientes=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
  unsubs.push(db.collection("documentos").onSnapshot(once(s=>{S.docs=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
  unsubs.push(db.collection("mc_mutuarios").onSnapshot(once(s=>{S.mutuarios=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
  unsubs.push(db.collection("mc_emprestimos").onSnapshot(once(s=>{S.emprestimos=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
  unsubs.push(db.doc("config/automacao").onSnapshot(s=>{S.acfg={...AVISOS.AUTO_PADRAO,...(s.exists?s.data():{})};refresh()},err));
  unsubs.push(db.doc("config/automacao_estado").onSnapshot(s=>{S.aestado=s.exists?s.data():null;reAuto()},err));
  unsubs.push(db.collection("envios").onSnapshot(s=>{S.envios=s.docs.map(d=>({...d.data(),id:d.id}));reAuto()},err));
  unsubs.push(db.collection("sv_contratos").onSnapshot(once(s=>{S.vcontratos=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
  unsubs.push(db.collection("mc_contratos").onSnapshot(once(s=>{S.mcontratos=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
}
