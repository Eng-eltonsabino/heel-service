/* Layout: Apple-style — black global nav, frosted sub-nav with section links and a blue pill CTA, hairline cards on parchment, full-bleed alternating tiles on the launcher */
:root{

}

  --accent:#7D93FF; --accent-ink:#0D1120; --accent-soft:#1F2952;
  --brand-navy:#0A0F1C; --brand-red:#D2433A;
  --ok:#4CC48A; --ok-soft:#14322A; --warn:#F2AA4C; --warn-soft:#3A2B14; --bad:#FF7B70; --bad-soft:#3D1D1D;
  --c-cap:#6E93FF; --c-jur:#F2AA4C; --c-rec:#4CC48A; --c-bruto:#5D6987;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1120; --surface:#151B2D; --sunk:#1B2236; --ink:#E5E9F3; --muted:#97A0B6; --line:#27304A;
  --accent:#7D93FF; --accent-ink:#0D1120; --accent-soft:#1F2952;
  --brand-navy:#0A0F1C; --brand-red:#D2433A;
  --ok:#4CC48A; --ok-soft:#14322A; --warn:#F2AA4C; --warn-soft:#3A2B14; --bad:#FF7B70; --bad-soft:#3D1D1D;

}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bar{display:flex;align-items:center;gap:12px 16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}

#mLine,.donut svg{display:block;width:100%;height:auto}
.donut{position:relative;max-width:230px;margin:6px auto 0}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .mid small{color:var(--muted);font-size:12px}.donut .mid b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.cb{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.cb .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb .tr{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden;display:flex}
.cb .tr div{height:100%}
.cb .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ins{display:grid;gap:8px;padding:12px 16px 16px}
.ins div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--sunk);border-radius:8px;font-size:13px}
.ins span{color:var(--muted)}.ins b{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{background:var(--sunk);border-top:1px solid var(--line)}
td input{min-width:0}
.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (max-width:760px){.overview{grid-template-columns:repeat(2,minmax(0,1fr))}}
.overview div{background:var(--surface);padding:14px 16px;display:grid;gap:2px;min-width:0}
.overview em{font-style:normal;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.overview b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overview small{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.kpi,.biz{transition:border-color .15s, filter .15s}}

/* ===== responsive: phones and tablets ===== */
main{grid-template-columns:minmax(0,1fr)}
main>*{min-width:0}
.dlg{grid-template-columns:minmax(0,1fr)}
.dlg>.body{grid-template-columns:minmax(0,1fr)}
.dlg>.body>*,fieldset>*{min-width:0}
.btn .lbl{display:inline}
@media (max-width:900px){
  .who-hdr{display:none}
}
@media (max-width:640px){
  .bar{flex-wrap:nowrap;gap:10px;padding-block:10px}
  .brand{gap:10px}
  .brand small{display:none}
  #hdrActs{gap:6px!important;flex-wrap:nowrap;flex:none}
  #hdrActs .btn{padding:7px 10px}
  #hdrActs .btn .lbl{display:none}
  nav.tabs{margin-inline:-16px;padding-inline:12px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 22px),transparent)}
  nav.tabs button{padding:10px 11px;font-size:13.5px}
  main{padding-block:16px 48px;gap:16px}
  h1{font-size:25px}
  .panel>header{padding:14px}
  .toolbar{padding:12px 14px}
  .row.spread>.row{width:100%}
  .kpis{gap:10px}
  .kpi{padding:12px 14px}
  .kpi b{font-size:28px}.kpi b.money,.kpi b[class~=money]{font-size:20px}
  /* tables become cards */
  #view .tbl-wrap{overflow:visible}
  #view .tbl-wrap table{min-width:0}
  #view .tbl-wrap thead{display:none}
  #view .tbl-wrap tbody tr,#view .tbl-wrap tfoot tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px;padding:14px;border-bottom:1px solid var(--line)}
  #view .tbl-wrap tbody tr:last-child{border-bottom:0}
  #view .tbl-wrap td{display:block;padding:0;border:0;text-align:left;white-space:normal;max-width:none!important;min-width:0}
  #view .tbl-wrap td.num{text-align:left}
  #view .tbl-wrap td[data-label]::before{content:attr(data-label);display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:2px}
  #view .tbl-wrap td[data-label=""]::before{display:none}
  #view .tbl-wrap td:first-child,#view .tbl-wrap td:last-child,#view .tbl-wrap td[colspan]{grid-column:1/-1}
  #view .tbl-wrap td:first-child::before{display:none}
  #view .tbl-wrap td:first-child b{font-size:15px}
  #view .tbl-wrap td .acts{justify-content:flex-start}
  #view .tbl-wrap td input{width:100%}
  #view .tbl-wrap tfoot tr{background:var(--sunk)}
  #view .tbl-wrap tfoot td:empty{display:none}
  tbody tr:hover td{background:none}
  /* dialogs become full-screen sheets */
  dialog,dialog.wide{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;margin:0;border-radius:0}
  .dlg{max-height:100dvh;height:100dvh}
  .dlg>header{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;border-radius:0}
  .dlg>header::before{border-radius:0}
  .dlg>.body{padding:14px 16px}
  .dlg>footer{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .dlg>footer .btn{flex:1 1 auto}
  .dlg>footer .btn.pri{flex-basis:100%;order:9;padding:11px}
  .dlg>footer [style*="margin-right:auto"]{margin-right:0!important}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qsum{grid-template-columns:minmax(0,1fr)}
  .cot{padding:10px}.cot .band{height:56px}.cot .band img{height:40px}
  .auth{padding-block:12px;min-height:0}
  .auth-card,.auth-side{padding:22px 18px}
  input,select,textarea{font-size:16px}
}
@media (max-width:640px){.summary b{white-space:normal;overflow-wrap:anywhere;font-size:15px}}
@media (max-width:440px){.brand>div{display:none}.brand .logo{height:32px}}
@media (max-width:380px){
  .brand>div{display:block}
  .kpis{grid-template-columns:minmax(0,1fr)}
}

/* ===== Apple-style layer: one blue accent, system type, hairline cards, black global nav + frosted sub-nav, full-bleed tiles ===== */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --sunk:#f5f5f7; --pearl:#fafafc; --ink:#1d1d1f; --muted:#6e6e73; --line:#e0e0e0;
  --accent:#0066cc; --accent-focus:#0071e3; --accent-ink:#ffffff; --accent-soft:#e8f1fb; --on-dark:#2997ff;
  --tile-dark:#272729; --tile-dark-2:#2a2a2c; --tile-dark-3:#252527; --gnav:#000000; --subnav:rgba(245,245,247,.8);
  --ok:#1d7a3e; --ok-soft:#e5f4ea; --warn:#b25000; --warn-soft:#fdf0e1; --bad:#d70015; --bad-soft:#fde8ea;
  --f-display:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1d1d1f; --sunk:#2a2a2c; --pearl:#161617; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
  --accent:#2997ff; --accent-focus:#2997ff; --accent-ink:#ffffff; --accent-soft:#0b2a4a; --subnav:rgba(22,22,23,.8);
  --tile-dark:#1d1d1f; --tile-dark-2:#1d1d1f; --tile-dark-3:#1d1d1f;
  --ok:#30d158; --ok-soft:#0f2e19; --warn:#ff9f0a; --warn-soft:#33240a; --bad:#ff453a; --bad-soft:#3a1414; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1d1d1f; --sunk:#2a2a2c; --pearl:#161617; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
  --accent:#2997ff; --accent-focus:#2997ff; --accent-ink:#ffffff; --accent-soft:#0b2a4a; --subnav:rgba(22,22,23,.8);
  --tile-dark:#1d1d1f; --tile-dark-2:#1d1d1f; --tile-dark-3:#1d1d1f;
  --ok:#30d158; --ok-soft:#0f2e19; --warn:#ff9f0a; --warn-soft:#33240a; --bad:#ff453a; --bad-soft:#3a1414; color-scheme:dark;
}
html,body{background:var(--bg)}
body{font-family:var(--f-body);font-size:17px;line-height:1.47;letter-spacing:-.374px;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{background:var(--gnav)}
:focus-visible{outline:2px solid var(--accent-focus);outline-offset:2px}

/* global nav: pure black, 44px */
header.top{position:relative;top:auto;background:var(--gnav);border:0;box-shadow:none;color:#f5f5f7}
header.top .bar{height:44px;padding-block:0;flex-wrap:nowrap;gap:12px}
.brand{gap:14px;min-width:0}
.brand .logo{height:24px;width:auto;flex:none;filter:none}
.live{font-family:var(--f-body);font-size:12px;letter-spacing:-.12px;color:#a1a1a6;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live i{width:6px;height:6px;background:#30d158;box-shadow:none;flex:none}
.who-hdr{font-family:var(--f-body);font-size:12px;letter-spacing:-.12px;color:#a1a1a6}
#hdrActs{gap:4px!important;flex:none}
.btn.gl{border:0;background:none;color:#e8e8ed;font-size:12px;letter-spacing:-.12px;padding:6px 10px;border-radius:999px}
.btn.gl:hover{color:#fff;background:rgba(255,255,255,.08)}

/* sub-nav: frosted parchment, 52px, sticky */
.subnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--subnav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.sbar{min-height:52px;display:flex;align-items:center;gap:8px 20px}
#bizName{font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:.231px;line-height:1.19;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:none;max-width:40%}
nav.tabs{flex:1;justify-content:flex-end;gap:2px;margin:0;align-self:stretch;align-items:center;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:400 12px/1 var(--f-body);letter-spacing:-.12px;color:var(--ink);opacity:.8;padding:8px 9px;border:0;border-radius:999px;text-shadow:none}
nav.tabs button:hover{opacity:1;color:var(--accent)}
nav.tabs button[aria-current="page"]{opacity:1;color:var(--ink);font-weight:600;background:color-mix(in srgb,var(--ink) 7%,transparent);border:0}
#hdrNovo{flex:none;font-size:12px;padding:6px 14px;letter-spacing:-.12px}
body.locked .subnav,body.locked #hdrActs{display:none}
body.launch nav.tabs{display:flex;visibility:hidden}

/* type */
h1,h2,h3{font-family:var(--f-display);font-stretch:normal;font-style:normal;text-transform:none;letter-spacing:-.28px}
h1{font-size:40px;font-weight:600;line-height:1.1}
h2{font-size:21px;font-weight:600;letter-spacing:.231px;line-height:1.19}
h3{font-size:17px;font-weight:600}
.sub{color:var(--muted);font-size:17px}
legend{font-family:var(--f-display);font-stretch:normal;font-weight:600;font-size:17px}

/* buttons: blue pill, ghost pill, press = scale(.95) */
.btn{border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:400 14px/1.29 var(--f-body);letter-spacing:-.224px;padding:8px 18px;box-shadow:none;transition:transform .12s,background-color .15s,color .15s}
.btn:hover{background:color-mix(in srgb,var(--accent) 8%,transparent);border-color:var(--accent);filter:none;transform:none}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:400;padding:11px 22px;box-shadow:none}
.btn.pri:hover{background:var(--accent-focus);border-color:var(--accent-focus);filter:none;transform:none}
.btn.pri:active{transform:scale(.95)}
.btn.sm{padding:5px 12px;font-size:12px;letter-spacing:-.12px;border-radius:999px}
.btn.pri.sm{padding:5px 14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 8%,transparent)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface);border-radius:8px}
.btn:disabled{opacity:.4}
.auth-card .btn.pri,.dlg>footer .btn.pri{padding:11px 22px;font-size:17px;letter-spacing:-.374px}
header.top .btn.pri{box-shadow:none}

/* surfaces: white, 18px radius, hairline, no shadow */
main{padding-block:40px 80px;gap:28px}
.panel,.kpi,.overview{border-radius:var(--r);border:1px solid var(--line);box-shadow:none;background:var(--surface)}
.panel{overflow:hidden}
.panel>header{padding:18px 22px;border-bottom:1px solid var(--line);background:none}
.panel>header h2{font-size:21px}
.kpi{padding:20px 22px;gap:4px;transition:transform .12s}
button.kpi:hover{border-color:var(--line);transform:none;background:var(--pearl)}
button.kpi:active{transform:scale(.97)}
.kpi span,.summary em,.overview em,.biz .stats em{font-size:12px;font-weight:400;text-transform:none;letter-spacing:-.12px;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-stretch:normal;font-weight:600;font-size:34px;letter-spacing:-.374px;line-height:1.12}
.kpi b.money{font-size:26px}
.kpi em{font-size:12px;letter-spacing:-.12px}
.item{padding:14px 22px}
.item .who b{font-weight:600}
.empty{padding:36px 22px;font-size:14px}
.toolbar{padding:14px 22px;gap:12px}
.summary{border-radius:12px;gap:1px}
.summary b{font-weight:600;letter-spacing:-.224px}
.overview b{font-family:var(--f-display);font-stretch:normal;font-weight:600;letter-spacing:-.28px}

/* tables */
table{font-size:14px;letter-spacing:-.224px}
th{background:none;font-size:12px;font-weight:600;text-transform:none;letter-spacing:-.12px;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px}
tbody tr:hover td{background:var(--pearl)}
tfoot td{background:var(--pearl)}
.pill{font-size:12px;font-weight:600;letter-spacing:-.12px;padding:3px 10px}
.tag,.mono{font-family:var(--f-mono);letter-spacing:0}

/* inputs: 44px, 12px radius; search is a pill */
input,select,textarea{border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;background:var(--surface);font-size:17px;letter-spacing:-.374px}
textarea{font-family:var(--f-body);font-size:15px;letter-spacing:-.224px;min-height:0}
input[type=checkbox],input[type=radio]{min-height:0;accent-color:var(--accent)}
input[type=color]{padding:4px;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-focus) 22%,transparent)}
input.search,.search input,input[type=search]{border-radius:999px;height:44px;padding-inline:18px;background:var(--surface)}
.chip{border-radius:999px;border-color:var(--line);font:400 12px var(--f-body);letter-spacing:-.12px;padding:6px 13px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
label.f{font-size:12px;font-weight:600;letter-spacing:-.12px;color:var(--muted);gap:6px}
label.f.check{font-size:14px;font-weight:400}
fieldset{border-radius:var(--r);padding:16px 18px;gap:14px}
.note{font-size:12px;letter-spacing:-.12px}
.calc,.readout,.ins div{border-radius:12px;background:var(--sunk)}
.hint{border-radius:12px}

/* dialogs: hairline sheet, no gradients */
dialog{border-radius:var(--r);border:1px solid var(--line);box-shadow:none}
dialog::backdrop{background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dlg>header{background:none;padding:20px 24px 16px}
.dlg>header::before{display:none}
.dlg>header h2{font-size:24px;letter-spacing:-.28px}
.dlg>.body{padding:20px 24px}
.dlg>footer{padding:14px 24px;background:var(--pearl)}
.toast{border-radius:999px;box-shadow:none;background:#1d1d1f;color:#f5f5f7;font-size:14px;letter-spacing:-.224px;padding:12px 20px}
.banner{border-radius:12px;font-size:14px}
.stamp-prev img{border-radius:12px}

/* ---- launcher: full-bleed alternating tiles ---- */
body.launch main{padding-top:0;gap:0;padding-bottom:0}
body.launch main>.banner{margin-top:20px;margin-bottom:20px}
.hero,.biz-grid{margin-inline:calc(50% - 50vw);border-radius:0;box-shadow:none}
.hero{background:var(--surface);color:var(--ink);padding:72px max(16px,calc(50vw - 540px)) 64px;display:grid;gap:40px;text-align:center;overflow:visible}
.hero::before,.hero::after{display:none}
.hero .top{display:grid;justify-items:center;gap:8px}
.hero .top img{display:none}
.hero h1{color:var(--ink);font-size:56px;line-height:1.07;letter-spacing:-.28px}
.hero .sub{color:var(--muted);font-size:21px;letter-spacing:.231px;line-height:1.38;margin-top:6px}
.hero .overview{background:var(--line);border:1px solid var(--line);gap:1px;border-radius:var(--r);text-align:left}
.hero .overview div{background:var(--pearl);border:0;border-radius:0;padding:18px 20px;backdrop-filter:none}
.hero .overview em,.hero .overview small{color:var(--muted)}
.hero .overview b{color:var(--ink);font-size:28px}
.hero .overview b[style*="--c-rec"]{color:var(--ok)!important}
.hero .overview b[style*="--c-jur"]{color:var(--warn)!important}
.hero .overview small span{color:var(--bad)!important}
.biz-grid{display:grid;grid-template-columns:minmax(0,1fr)!important;gap:0}
.biz{border:0;border-radius:0;box-shadow:none;background:var(--bg);color:var(--ink);display:grid;justify-items:center;text-align:center;gap:22px;padding:72px 16px 76px;transition:none;grid-template-rows:none}
.biz:hover{transform:none;box-shadow:none;border:0}
.biz:nth-child(odd){background:var(--tile-dark);color:#f5f5f7}
.biz:nth-child(3){background:var(--tile-dark-3)}
.biz .band{background:none;padding:0;display:flex;flex-direction:column-reverse;align-items:center;gap:16px;color:inherit}
.biz .band b{font-family:var(--f-display);font-style:normal;font-stretch:normal;font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.28px;color:inherit}
.biz .band div span{display:block;margin-top:6px;font-size:21px;letter-spacing:.231px;line-height:1.19;text-transform:none;color:var(--muted);opacity:1}
.biz:nth-child(odd) .band div span{color:#a1a1a6}
.biz .ico{width:56px;height:56px;border-radius:14px;border:0;box-shadow:none;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}
.biz:nth-child(odd) .ico{background:rgba(41,151,255,.14);color:var(--on-dark)}
.biz .ico svg{width:30px;height:30px}
.biz .strip{display:none}
.biz .stats{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 44px;padding:0}
.biz .stats div{justify-items:center;gap:2px}
.biz .stats strong{font-family:var(--f-display);font-stretch:normal;font-weight:600;font-size:28px;letter-spacing:-.28px;line-height:1.14;white-space:nowrap}
.biz:nth-child(odd) .stats em{color:#a1a1a6}
.biz:nth-child(odd) .stats strong[style*="--warn"]{color:#ff9f0a!important}
.biz:nth-child(odd) .stats strong[style*="--bad"]{color:#ff453a!important}
.biz .go{border:0;padding:11px 22px;border-radius:999px;background:var(--accent);color:#fff;font-size:17px;font-weight:400;letter-spacing:-.374px;display:inline-flex;gap:6px;transition:transform .12s}
.biz:nth-child(odd) .go{background:#0071e3}
.biz .go::after{content:"›";font-size:20px;line-height:1;transform:none}
.biz:hover .go{background:var(--accent-focus)}
.biz:hover .go::after{transform:none}
.biz:active .go{transform:scale(.95)}
.foot{background:var(--sunk);color:var(--muted);font-size:12px;letter-spacing:-.12px;border-top:1px solid var(--line)}
.foot .wrap{padding-block:18px 22px;display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
body.launch .foot{border-top:0}

/* ---- login: dark tile + white form card ---- */
.auth{min-height:calc(100vh - 160px);padding-block:48px}
.auth{place-items:stretch}
.auth-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);overflow:hidden;width:100%;margin:auto;border-radius:var(--r);box-shadow:none;border:1px solid var(--line);background:var(--surface);max-width:980px}
.auth-side{position:relative;display:grid;align-content:space-between;gap:28px;min-height:420px;overflow:hidden;background:var(--tile-dark)!important;background-image:none!important;color:#f5f5f7;padding:48px 44px}
.auth-side::after{display:none}
.auth-side img{width:min(220px,80%);filter:none}
.auth-side p{color:#a1a1a6;font-size:21px;letter-spacing:.231px;line-height:1.38;max-width:26ch}
.auth-side .chip{background:none;border-color:rgba(255,255,255,.24);color:#f5f5f7}
.auth-card{padding:48px 44px;gap:20px;width:100%;border:0;border-radius:0;box-shadow:none;align-content:center}

<script>(function(){

  planos:PLANOS_PADRAO,carimboImg:"",aviso:7,iva:16,validade:15,cotPagamento:"Pagamento integral antes da ativação",cotPrazo:"Ativação em até 24 horas após o pagamento"};

const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

function addMeses(s,n){const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+Number(n));const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)}
function addDias(s,n){const d=parse(s);d.setDate(d.getDate()+Number(n));return iso(d)}
const fmtD=s=>{if(!s)return"—";const[y,m,d]=String(s).split("-");return d+"/"+m+"/"+y};
const r2=v=>Math.round((Number(v)||0)*100)/100;
function mt(v){v=Number(v)||0;const neg=v<-0.004;v=Math.abs(v);const[i,dec]=v.toFixed(2).split(".");return(neg?"-":"")+i.replace(/\B(?=(\d{3})+(?!\d))/g," ")+","+dec+" MT"}
const pct=v=>(Number(v)||0).toLocaleString("pt-PT",{maximumFractionDigits:2})+"%";
const soma=(a,f)=>r2((a||[]).reduce((s,x)=>s+(Number(f(x))||0),0));
const novoId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function gerar(n,set){const a=new Uint32Array(n);crypto.getRandomValues(a);return Array.from(a,x=>set[x%set.length]).join("")}
const genUser=nome=>(String(nome||"cliente").normalize("NFD").replace(/[^a-zA-Z]/g,"").toLowerCase().slice(0,8)||"cliente")+gerar(4,"0123456789");

async function copiar(txt){try{await navigator.clipboard.writeText(txt);toast("Copiado")}catch(e){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copiado")}catch(_){toast("Selecione o texto e copie manualmente")}ta.remove()}}

/* ================= store ================= */
const COL={clientes:"clientes",documentos:"docs",mc_mutuarios:"mutuarios",mc_emprestimos:"emprestimos"};
function upsert(arr,o){const i=arr.findIndex(x=>x.id===o.id);if(i>=0)arr[i]=o;else arr.push(o)}
function falha(e){console.error(e);toast(e&&e.code==="quota_exceeded"?"Espaço cheio: elimine registos antigos":"Não foi possível guardar. Tente de novo.")}
const store={
  async put(col,o){upsert(S[COL[col]],o);refresh();if(db){const{id,...b}=o;try{await db.collection(col).doc(id).set(b)}catch(e){falha(e)}}},
  async del(col,id){S[COL[col]]=S[COL[col]].filter(x=>x.id!==id);refresh();if(db){try{await db.collection(col).doc(id).delete()}catch(e){falha(e)}}},
  async cfg(key,path,c){S[key]=c;refresh();if(db){try{await db.doc(path).set(c)}catch(e){falha(e)}}}
};

/* ================= modo local (ficheiro descarregado) ================= */
/* Same calls as the online database, kept in this browser's storage. */
function criarLocalDB(){
  const KEY="heel_service_dados_v1";let mem=null;
  try{mem=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){mem=null}
  if(!mem||typeof mem!=="object"||!mem.cols)mem={cols:{}};
  const ouv=new Set();let pend=false;
  const gravar=()=>{try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){toast("O navegador não conseguiu guardar os dados. Faça uma cópia de segurança.")}};
  const avisar=()=>{if(pend)return;pend=true;setTimeout(()=>{pend=false;ouv.forEach(f=>{try{f()}catch(e){console.error(e)}})},0)};
  const clone=v=>JSON.parse(JSON.stringify(v));
  const snapDoc=(c,id)=>{const v=mem.cols[c]?.[id];return{id,exists:!!v,data:()=>v?clone(v):undefined}};
  const snapCol=c=>{const o=mem.cols[c]||{};return{docs:Object.keys(o).map(id=>({id,exists:true,data:()=>clone(o[id])}))}};
  const ref=(c,id)=>({id,
    get:async()=>snapDoc(c,id),
    set:async v=>{(mem.cols[c]=mem.cols[c]||{})[id]=clone(v);gravar();avisar()},
    delete:async()=>{if(mem.cols[c])delete mem.cols[c][id];gravar();avisar()},
    onSnapshot:cb=>{const f=()=>cb(snapDoc(c,id));ouv.add(f);setTimeout(f,0);return()=>ouv.delete(f)}});
  return{local:true,
    doc:p=>{const[c,id]=p.split("/");return ref(c,id)},
    collection:c=>({doc:id=>ref(c,id),onSnapshot:cb=>{const f=()=>cb(snapCol(c));ouv.add(f);setTimeout(f,0);return()=>ouv.delete(f)}})};
}
/* outside claude.ai a normal browser download works */
const dlLocal={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:/\.json$/.test(filename)?"application/json":/\.csv$/.test(filename)?"text/csv":"application/octet-stream"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return{status:"saved"}}};

/* ================= dialog ================= */
const dlg=$("#dlg");
function abrir(html,o={}){dlg.classList.toggle("wide",!!o.wide);dlg.innerHTML=`<form class="dlg" method="dialog" id="dform" novalidate>${html}</form>`;if(!dlg.open)dlg.showModal();if(!o.nofocus){const f=dlg.querySelector(".body input:not([type=hidden]):not([type=checkbox]),.body select");if(f)setTimeout(()=>f.focus(),30)}}
function fechar(){if(dlg.open)dlg.close()}
dlg.addEventListener("click",e=>{if(e.target===dlg)fechar()});
const hdr=(t,s)=>`<header><div><h2>${t}</h2>${s?`<p class="sub">${s}</p>`:""}</div><button type="button" class="x" data-act="fechar" aria-label="Fechar">×</button></header>`;
/* two-step confirm inside the page */
function confirmar(btn,txt){if(btn.dataset.ok)return true;btn.dataset.ok="1";btn.textContent=txt;return false}

/* ================= images / stamp ================= */
const imgCache={};
function loadImg(src){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src})}
async function imgData(src){if(imgCache[src])return imgCache[src];const im=await loadImg(src);const cv=document.createElement("canvas");cv.width=im.naturalWidth;cv.height=im.naturalHeight;cv.getContext("2d").drawImage(im,0,0);return imgCache[src]=cv.toDataURL("image/png")}
async function carimboCanvas(cfg,numero,data){
  const Z=600,cv=document.createElement("canvas");cv.width=cv.height=Z;const x=cv.getContext("2d");
  x.translate(Z/2,Z/2);x.rotate(-0.16);
  if(cfg.carimboImg){try{const img=await loadImg(cfg.carimboImg);const r=Math.min(540/img.width,540/img.height);x.drawImage(img,-img.width*r/2,-img.height*r/2,img.width*r,img.height*r);return cv}catch(e){}}
  const col="#2D3A9A";x.strokeStyle=col;x.fillStyle=col;
  const ring=(r,w)=>{x.lineWidth=w;x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.stroke()};
  ring(278,12);ring(250,4);ring(150,4);
  const arcText=(txt,r,size,bottom)=>{x.font=`700 ${size}px Archivo, Arial, sans-serif`;x.textAlign="center";x.textBaseline="middle";
    const chars=[...txt],ws=chars.map(ch=>x.measureText(ch).width+size*0.12),total=ws.reduce((a,b)=>a+b,0)/r;
    let a=bottom?total/2:-total/2;
    chars.forEach((ch,i)=>{const w=ws[i]/r;x.save();if(bottom){x.rotate(a-w/2);x.fillText(ch,0,r)}else{x.rotate(a+w/2);x.fillText(ch,0,-r)}x.restore();a+=bottom?-w:w})};
  const nome=(cfg.nome||"").toUpperCase();
  arcText(nome,200,nome.length>18?32:40,false);
  arcText((cfg.nuit?"NUIT "+cfg.nuit:(cfg.morada||"MOÇAMBIQUE")).toUpperCase().slice(0,30),205,28,true);
  x.font="700 30px Archivo, Arial, sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("★",-200,0);x.fillText("★",200,0);
  x.font="800 92px Archivo, Arial, sans-serif";x.fillText("PAGO",0,-14);
  x.font="600 34px 'IBM Plex Mono', monospace";x.fillText(fmtD(data||hoje()),0,58);
  x.font="500 22px 'IBM Plex Mono', monospace";x.fillText(numero||"",0,98);
  x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation="destination-out";
  for(let i=0;i<2600;i++){x.globalAlpha=Math.random()*.7;const s=Math.random()*3.2;x.fillRect(Math.random()*Z,Math.random()*Z,s,s)}
  x.globalAlpha=1;x.globalCompositeOperation="source-over";
  return cv;
}

/* ================= PDF: Heel Service layout ================= */
/* columns follow the template's A..H widths scaled to a 180 mm print width */
const X={A:15,B:18.3,C:26.6,D:92.7,E:105.9,F:124.1,G:152.2,H:167.1,END:195};
const RH=4.55;
const NAVY=[31,41,55],RED=[185,28,28],INK=[17,24,39],GREY=[107,114,128],LINE=[209,213,219];
function novoPDF(){if(!window.jspdf){toast("O gerador de PDF não carregou. Recarregue a página.");return null}return new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true})}
const fit=(pdf,t,w)=>pdf.splitTextToSize(String(t??""),Math.max(2,w))[0]||"";
async function pdfTopo(pdf,titulo){
  pdf.setFillColor(...NAVY);pdf.rect(X.A,10,X.END-X.A,21.8,"F");
  try{pdf.addImage(await imgData(ASSET.logoBranco),"PNG",X.END-5-42,12.9,42,16)}catch(e){}
  pdf.setFillColor(...RED);pdf.rect(X.A,31.8,X.END-X.A,6.6,"F");
  pdf.setFont("helvetica","bold");pdf.setFontSize(10);pdf.setTextColor(255,255,255);pdf.text(titulo,X.B,36.3);
  return 38.4;
}
function pdfEmitente(pdf,cfg,y,pares){
  const L=[[cfg.nome,true],["Endereço: "+(cfg.morada||"—")],["Tel.: "+(cfg.telefone||"—")],["Email: "+(cfg.email||"—")],["NUIT: "+(cfg.nuit||"—")]];
  pdf.setFontSize(8.5);pdf.setTextColor(...INK);
  L.forEach(([t,b],i)=>{pdf.setFont("helvetica",b?"bold":"normal");pdf.text(fit(pdf,t,X.E-X.B-3),X.B,y+i*RH+3.3)});
  pares.forEach(([l,v],i)=>{pdf.setFont("helvetica","bold");pdf.text(l,X.G-1.5,y+i*RH+3.3,{align:"right"});pdf.setFont("helvetica","normal");pdf.text(String(v),X.END-1.5,y+i*RH+3.3,{align:"right"})});
}
function pdfSecao(pdf,t,y){pdf.setFont("helvetica","bold");pdf.setFontSize(8.5);pdf.setTextColor(...RED);pdf.text(t,X.B,y+3.3);pdf.setTextColor(...INK)}
function pdfCampos(pdf,y,pares,xv){pdf.setFontSize(8.5);pdf.setTextColor(...INK);pares.forEach(([l,v],i)=>{pdf.setFont("helvetica","bold");pdf.text(l,X.B,y+i*RH+3.3);pdf.setFont("helvetica","normal");pdf.text(fit(pdf,v||"",X.END-xv-2),xv,y+i*RH+3.3)});return y+pares.length*RH}
/* cols: [{t,x,w,al}] — navy header and bordered rows, continues on a new page when needed; returns y after table */
function pdfTabela(pdf,y,cols,rows,minRows){
  const hh=RH*1.45,n=Math.max(minRows||0,rows.length),x0=cols[0].x,x1=cols[cols.length-1].x+cols[cols.length-1].w;
  const cab=yy=>{pdf.setFillColor(...NAVY);pdf.rect(x0,yy,x1-x0,hh,"F");pdf.setFont("helvetica","bold");pdf.setFontSize(8.2);pdf.setTextColor(255,255,255);
    cols.forEach(c=>pdf.text(c.t,c.x+c.w/2,yy+hh/2+1.2,{align:"center"}));pdf.setFont("helvetica","normal");pdf.setFontSize(8.5);pdf.setTextColor(...INK);return yy+hh};
  const grade=(ya,yb)=>{pdf.setDrawColor(...LINE);pdf.setLineWidth(0.2);[...cols.map(c=>c.x),x1].forEach(xx=>pdf.line(xx,ya,xx,yb))};
  let segTop=y,ry=cab(y);
  for(let i=0;i<n;i++){
    if(ry+RH>282){grade(segTop,ry);pdf.addPage();segTop=20;ry=cab(20)}
    const r=rows[i];
    /* wrapped columns (long service names) make the row taller, up to 3 lines */
    const cel=r?cols.map((c,j)=>{const v=r[j];if(v===""||v==null)return[];return c.wrap?pdf.splitTextToSize(String(v),c.w-3).slice(0,3):[fit(pdf,v,c.w-3)]}):[];
    const nl=Math.max(1,...cel.map(x=>x.length)),rh=nl>1?RH+(nl-1)*3.5:RH;
    if(ry+rh>282){grade(segTop,ry);pdf.addPage();segTop=20;ry=cab(20)}
    cel.forEach((ls,j)=>{const c=cols[j],al=c.al||"left",tx=al==="center"?c.x+c.w/2:al==="right"?c.x+c.w-1.5:c.x+1.5;
      if(c.shrink&&r[j]){const full=String(r[j]),fs=Math.max(6,Math.min(8.5,8.5*(c.w-2)/pdf.getTextWidth(full)));pdf.setFontSize(fs);pdf.text(full,tx,ry+3.3,{align:al});pdf.setFontSize(8.5);return}
      ls.forEach((t,k)=>pdf.text(t,tx,ry+3.3+k*3.5,{align:al}))});
    pdf.setDrawColor(...LINE);pdf.setLineWidth(0.2);pdf.line(x0,ry+rh,x1,ry+rh);ry+=rh}
  grade(segTop,ry);return ry;
}
function pdfTotais(pdf,y,linhas,grand){
  pdf.setDrawColor(...LINE);pdf.setLineWidth(0.2);pdf.setFontSize(8.5);
  linhas.forEach(([l,v],i)=>{const ry=y+i*RH;pdf.setTextColor(...INK);pdf.setFont("helvetica","bold");pdf.text(l,X.H-1.5,ry+3.3,{align:"right"});pdf.setFont("helvetica","normal");pdf.rect(X.H,ry,X.END-X.H,RH);pdf.text(v,X.END-1.5,ry+3.3,{align:"right"})});
  const gy=y+linhas.length*RH;pdf.setFillColor(...RED);pdf.rect(X.F,gy,X.END-X.F,RH,"F");
  pdf.setFont("helvetica","bold");pdf.setTextColor(255,255,255);pdf.text(grand[0],X.H-1.5,gy+3.3,{align:"right"});pdf.text(grand[1],X.END-1.5,gy+3.3,{align:"right"});
  pdf.setTextColor(...INK);return gy+RH;
}
function pdfLinhasTexto(pdf,y,linhas){pdf.setFont("helvetica","normal");pdf.setFontSize(8.5);pdf.setTextColor(...INK);let yy=y;linhas.filter(Boolean).forEach(l=>{pdf.splitTextToSize(String(l),X.END-X.B-2).forEach(t=>{pdf.text(t,X.B,yy+3.3);yy+=RH})});return yy}
function pdfAssinatura(pdf,y,cfg,data,{imagem=false,carimbo=null}={}){
  if(imagem){try{pdf.addImage(imgData_sync[ASSET.logoCinza],"PNG",X.B+2,y-1,30,11.4)}catch(e){}try{pdf.addImage(imgData_sync[ASSET.assinatura],"PNG",X.B+6,y+3.2,36,6.7)}catch(e){}}
  const ly=y+3*RH;pdf.setDrawColor(...INK);pdf.setLineWidth(0.3);pdf.line(X.B,ly,X.D,ly);
  pdf.setFont("helvetica","bold");pdf.setFontSize(8.5);pdf.setTextColor(...INK);pdf.text(cfg.signatario||cfg.nome||"",X.B,ly+RH+3.3-1.5);
  pdf.setFont("helvetica","normal");pdf.setFontSize(8);pdf.text(cfg.nome||"",X.B,ly+2*RH+3.3-1.5);pdf.text((cfg.cidade||"Maputo")+", "+fmtD(data),X.B,ly+3*RH+3.3-1.5);
  if(carimbo)pdf.addImage(carimbo,"PNG",X.F+6,y-8,40,40);
  return ly+4*RH;
}
const imgData_sync={};
async function precarregar(){for(const k of[ASSET.logoCinza,ASSET.assinatura,ASSET.marca,ASSET.logoBranco]){try{imgData_sync[k]=await imgData(k)}catch(e){}}}
function pdfRodape(pdf,t){if(!t)return;pdf.setFont("helvetica","normal");pdf.setFontSize(7.5);pdf.setTextColor(...GREY);pdf.text(t,105,289,{align:"center"})}
const pdfOut=(pdf,nome)=>({blob:pdf.output("blob"),nome});

/* generic receipt in the Heel layout */
async function pdfRecibo(cfg,r){
  const pdf=novoPDF();if(!pdf)return null;await precarregar();
  let y=await pdfTopo(pdf,"RECIBO");
  pdfEmitente(pdf,cfg,y+RH,[["Nº do recibo:",r.numero],["Data:",fmtD(r.data)],r.ref?["Referência:",r.ref]:["",""],r.metodo?["Método:",r.metodo]:["",""]]);
  y=y+7*RH;pdfSecao(pdf,"RECEBEMOS DE",y);y+=RH;
  y=pdfCampos(pdf,y,[["Nome:",r.cliente.nome],["Contacto:",[r.cliente.telefone,r.cliente.email].filter(Boolean).join("  ·  ")],["Morada / NUIT:",r.cliente.morada||""]],X.D);
  y+=RH;
  const cols=[{t:"#",x:X.B,w:X.C-X.B,al:"center"},{t:"Descrição",x:X.C,w:X.E-X.C,wrap:true},{t:"Qtd",x:X.E,w:X.F-X.E,al:"center"},{t:"Preço unit. (MT)",x:X.F,w:X.H-X.F,al:"right"},{t:"Total (MT)",x:X.H,w:X.END-X.H,al:"right"}];
  y=pdfTabela(pdf,y,cols,r.itens.map((it,i)=>[String(i+1),it.desc,String(it.qtd),mt(it.preco),mt(it.qtd*it.preco)]),4);
  y=pdfTotais(pdf,y+RH,[],[r.anulado?"ANULADO":"TOTAL PAGO",mt(r.total)]);
  y+=RH;if(r.info&&r.info.length){pdfSecao(pdf,"NOTAS",y);y=pdfLinhasTexto(pdf,y+RH,r.info)}
  const stamp=r.carimbo&&!r.anulado?(await carimboCanvas(cfg,r.numero,r.data)).toDataURL("image/png"):null;
  pdfAssinatura(pdf,Math.max(y+4*RH,200),cfg,r.data,{carimbo:stamp});
  pdfRodape(pdf,cfg.rodape);
  return pdfOut(pdf,r.numero+(stamp?"-carimbado":"")+".pdf");
}
async function guardarPDF(gerarFn){
  const r=await gerarFn();if(!r)return;
  if(!dl){toast("A descarga de ficheiros não está disponível nesta vista.");return}
  try{await dl.save({filename:r.nome,data:r.blob});toast("PDF guardado")}catch(e){if(e&&e.code!=="declined")toast("Não foi possível guardar o PDF.")}
}

const b64=blob=>new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(",")[1]);fr.onerror=ko;fr.readAsDataURL(blob)});
function erroGmail(e){const c=e&&e.code;
  if(c==="consent_required"||c==="not_granted"||c==="blocked_by_policy")return"O Gmail não foi autorizado para esta página. Autorize-o no menu de permissões do artefacto e tente de novo.";
  if(c==="server_not_connected"||c==="server_not_found")return"O Gmail não está ligado na sua conta. Ligue-o nos conectores do claude.ai.";
  if(c==="tool_error")return"O Gmail recusou o envio. Verifique o endereço do destinatário.";
  return"Não foi possível enviar agora. Tente de novo dentro de momentos.";}
async function enviarGmail({to,subject,body,gerar}){
  if(!mcp)throw{code:"server_not_connected"};
  const input={to:[to.trim()],subject,body};
  if(gerar){const r=await gerar();if(r)input.attachments=[{content:await b64(r.blob),filename:r.nome,mimeType:"application/pdf"}]}
  return mcp.callTool("Gmail","send_message",input,{cache:false});
}
const assinaturaTxt=c=>`\n\nCumprimentos,\n${c.signatario?c.signatario+"\n":""}${c.nome}${c.telefone?"\nTel./WhatsApp: "+c.telefone:""}${c.email?"\n"+c.email:""}`;
/* ---------- SMS ---------- */
const GSM7=new Set(("@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !\"#¤%&'()*+,-./0123456789:;<=>?¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà").split(""));
const GSM7X=new Set("^{}\\[~]|€".split(""));
/* strip accents so the SMS stays in the cheap 160-character format */
const smsLimpo=t=>String(t).replace(/[—–]/g,"-").replace(/[·•]/g,"-").replace(/º/g,"o").replace(/ª/g,"a").replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'").replace(/…/g,"...").normalize("NFD").replace(/[̀-ͯ]/g,"");
function smsPartes(t){let gsm=true,len=0;for(const ch of t){if(GSM7.has(ch))len++;else if(GSM7X.has(ch))len+=2;else{gsm=false;break}}
  if(!gsm){len=[...t].length;return{len,partes:len<=70?1:Math.ceil(len/67),gsm}}return{len,partes:len<=160?1:Math.ceil(len/153),gsm}}
const smsNum=t=>{const d=waNum(t);return d?"+"+d:""};
/* email-to-SMS: the provider turns an email sent to <number>@<their domain> into an SMS */
const CFG_SMS={ativo:false,modelo:"{numero}@email.smsglobal.com",formato:"258",assunto:""};
const smsAuto=()=>!!(mcp&&S.scfg&&S.scfg.ativo&&/\{numero\}/.test(S.scfg.modelo||"")&&/@/.test(S.scfg.modelo||""));
function smsEndereco(tel){const d=waNum(tel);if(!d)return"";const n=S.scfg.formato==="+258"?"+"+d:S.scfg.formato==="local"?d.replace(/^258/,""):d;return S.scfg.modelo.replace("{numero}",n)}
async function enviarSMS(tel,texto){const to=smsEndereco(tel);if(!to)throw{code:"sem_telefone"};
  if(!mcp)throw{code:"server_not_connected"};
  return mcp.callTool("Gmail","send_message",{to:[to],subject:S.scfg.assunto||"SMS",body:texto},{cache:false})}

function ligarSmsCfg(){const f=$("#fSms");if(!f)return;
  const ler=()=>{const fd=new FormData(f);return{ativo:!!fd.get("ativo"),modelo:String(fd.get("modelo")).trim(),formato:fd.get("formato"),assunto:String(fd.get("assunto")).trim()}};

    await store.cfg("scfg","config/sms",c);m.style.color="var(--ok)";m.textContent=c.ativo?"SMS automático ativado.":"Definições guardadas. O SMS automático está desligado."};
  $("#smsTeste").onclick=async()=>{const m=$("#smsMsg"),keep=S.scfg;S.scfg={...ler(),ativo:true};const tel=S.cfg.telefone||S.mcfg.telefone;
    if(!smsAuto()){S.scfg=keep;m.style.color="var(--bad)";m.textContent=mcp?"Preencha o endereço do serviço com {numero}.":"O Gmail não está disponível nesta vista.";return}

    m.style.color="";m.textContent="A enviar teste para "+smsNum(tel)+"…";

    catch(err){console.error(err);m.style.color="var(--bad)";m.textContent=erroGmail(err)}
    S.scfg=keep};
}

const plano=id=>S.cfg.planos.find(p=>p.id===id);

function estado(c){
  if(!c.expira)return{k:"sem",t:"Sem validade",n:9999};
  const n=dias(c.expira);
  if(n<0)return{k:"bad",t:"Expirou há "+(-n)+" d",n};
  if(n===0)return{k:"warn",t:"Expira hoje",n};
  if(n<=Number(S.cfg.aviso||7))return{k:"warn",t:"Faltam "+n+" d",n};
  return{k:"ok",t:"Ativo · "+n+" d",n};
}

}

  $("#ultdocs").innerHTML=ult.length?ult.map(x=>`<div class="item"><div class="who"><b class="mono">${esc(x.numero)}</b><small>${esc(x.cliente?.nome)} · ${fmtD(x.data)}</small></div><div class="row" style="gap:8px"><span class="num">${mt(x.total)}</span><button class="btn sm" data-act="ver-doc" data-id="${x.id}">Abrir</button></div></div>`).join(""):'<div class="empty">Sem documentos emitidos.</div>';

function filtrar(){
  const q=S.q.trim().toLowerCase();
  return S.clientes.filter(c=>{const e=estado(c).k;
    if(S.filtro==="ativos"&&!(e==="ok"||e==="warn"))return false;
    if(S.filtro==="expirar"&&e!=="warn")return false;
    if(S.filtro==="expirados"&&e!=="bad")return false;
    return!q||[c.nome,c.email,c.telefone,c.usuario].some(v=>String(v||"").toLowerCase().includes(q));
  }).sort((a,b)=>estado(a).n-estado(b).n);
}
function refClientes(){
  const l=filtrar();
  $("#cliCount").textContent=S.clientes.length+" registados · a mostrar "+l.length;
  document.querySelectorAll("#chips .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.filtro===S.filtro));

    <tr><td class="cname"><b>${esc(c.nome)}</b><small>${esc(c.telefone||"")}${c.telefone&&c.email?" · ":""}${esc(c.email||"")}</small></td>

async function emitirRecibo(c,itens,metodo,ref,nota){
  const d={id:novoId("d"),tipo:"recibo",numero:proxNumero("recibo"),data:hoje(),clienteId:c?.id||"",cliente:{nome:c.nome,email:c.email||"",telefone:c.telefone||"",morada:c.morada||""},itens,total:soma(itens,i=>i.qtd*i.preco),metodo:metodo||"",ref:ref||"",estado:"pago",nota:nota||"",criadoEm:new Date().toISOString()};

  const l=S.clientes.filter(c=>{const k=estado(c).k;return(k==="warn"||k==="bad")&&c.avisoEm!==hoje()&&(emailOk(c.email)||(auto&&waNum(c.telefone)))}).sort((a,b)=>estado(a).n-estado(b).n);
  const sem=S.clientes.filter(c=>{const k=estado(c).k;return(k==="warn"||k==="bad")&&!emailOk(c.email)&&!(auto&&waNum(c.telefone))}).length;
  const canais=c=>[emailOk(c.email)?"e-mail":"",auto&&waNum(c.telefone)?"SMS":""].filter(Boolean).join(" + ");
  abrir(hdr("Avisar todos",auto?"Cada cliente recebe um e-mail e um SMS individuais com o seu prazo e o valor do plano.":"Cada cliente recebe um e-mail individual com o seu prazo e o valor do plano.")+`
  <div class="body">${l.length?`<div class="list" style="border:1px solid var(--line);border-radius:6px">${l.map(c=>{const e=estado(c);return`<div class="item"><div class="who"><b>${esc(c.nome)}</b><small>${esc(canais(c))} · ${esc([c.email,c.telefone].filter(Boolean).join(" · "))}</small></div><span class="pill ${e.k}" data-st="${c.id}">${e.t}</span></div>`}).join("")}</div>`:'<div class="empty">Não há clientes por avisar hoje.</div>'}
  ${sem?`<p class="note">${sem} cliente${sem>1?"s":""} sem ${auto?"e-mail nem telefone":"e-mail"} fica${sem>1?"m":""} de fora.</p>`:""}
  ${auto?"":`<p class="note">Para enviar também SMS automaticamente, ative “SMS automático” em Definições. Até lá, use “Copiar telefones (SMS)” no painel.</p>`}
  <p class="note">Clientes já avisados hoje não aparecem nesta lista.</p><p class="note" id="tStatus"></p></div>
  <footer><button type="button" class="btn" data-act="fechar">Cancelar</button>${l.length?`<button type="button" class="btn pri" id="tSend">Avisar ${l.length} cliente${l.length>1?"s":""}</button>`:""}</footer>`,{nofocus:true});
  const bt=$("#tSend");if(!bt)return;
  bt.onclick=async()=>{bt.disabled=true;let ok=0,fail=0;const fatal=e=>e&&["consent_required","not_granted","server_not_connected","blocked_by_policy"].includes(e.code);
    for(const c of l){const pill=dlg.querySelector(`[data-st="${c.id}"]`);pill.className="pill sem";pill.textContent="A enviar…";
      const m=modelo("aviso",c),feitos=[];let parou=null;
      if(emailOk(c.email)){try{await enviarGmail({to:c.email,subject:m.assunto,body:m.corpo});feitos.push("e-mail")}catch(e){console.error(e);if(fatal(e))parou=e}}
      if(!parou&&auto&&waNum(c.telefone)){try{await enviarSMS(c.telefone,smsLimpo(smsModelo("aviso",c)));feitos.push("SMS")}catch(e){console.error(e);if(fatal(e))parou=e}}
      if(feitos.length){ok++;pill.className="pill ok";pill.textContent=feitos.join(" + ")+" ✓";await store.put("clientes",{...cliente(c.id),avisoEm:hoje(),ultimoEmail:feitos.includes("e-mail")?hoje():c.ultimoEmail||""})}
      else{fail++;pill.className="pill bad";pill.textContent="Falhou"}
      $("#tStatus").textContent=ok+" avisado"+(ok===1?"":"s")+(fail?" · "+fail+" falhou":"");
      if(parou){$("#tStatus").textContent=erroGmail(parou);break}}
    bt.textContent="Concluído";};
}

const linhaTot=it=>r2((Number(it.qtd)||0)*(Number(it.preco)||0)*(1-(Number(it.desc)||0)/100));
function calcCot(itens,dg,iva){const sub=soma(itens,linhaTot),dgMT=r2(sub*(Number(dg)||0)/100),base=r2(sub-dgMT),ivaMT=r2(base*(Number(iva)||0)/100);return{sub,dgMT,base,ivaMT,total:r2(base+ivaMT)}}
function abrirCotacao(id,clienteId,opc={}){

    clienteId:c0?.id||"",cliente:c0?{nome:c0.nome,email:c0.email||"",telefone:c0.telefone||"",morada:c0.morada||""}:{nome:"",email:"",telefone:"",morada:""},
    itens:[],descGlobal:0,iva:Number(K().cfg().iva??16),condPagamento:K().cfg().cotPagamento||"",condBanco:K().cfg().pagamento||"",condPrazo:K().cfg().cotPrazo||"",estado:"pendente"};

      <label class="f">Nome<input id="qNome" value="${esc(q.cliente.nome)}"></label>

      <label class="f">Morada / NUIT<input id="qMor" value="${esc(q.cliente.morada||"")}"></label>

    </div></fieldset>
    <div><div class="row spread" style="margin-bottom:8px"><b>Serviços</b><div class="row" style="gap:6px"><select id="qAddPlano" style="width:auto;max-width:100%"><option value="">+ Adicionar ${K().catRotulo}…</option>${catOpts()}</select><button type="button" class="btn sm" id="qAdd">+ Linha</button></div></div>

  $("#qAddPlano").onchange=e=>{const p=K().catalogo().find(x=>x.id===e.target.value);if(p){if(linhas.length===1&&!linhas[0].d)linhas=[];linhas.push({d:p.nome,q:1,u:p.un||"un",p:p.preco,x:0});draw()}e.target.value=""};

    let cid=$("#qCli").value;

      cliente:{nome,telefone:$("#qTel").value.trim(),email:$("#qEmail").value.trim(),morada:$("#qMor").value.trim()},

  $("#qGuardar").onclick=async()=>{const d=await guardar();if(d){toast("Cotação guardada");abrirDoc(d.id)}};

  const n=Math.max(15,rows.length);

  y=pdfTabela(pdf,y,cols,rows,15);

  y+=RH;

/* ================= MICROCRÉDITO (modelo Heel Services) ================= */
/* Juro simples mensal: pagamento mensal = valor ÷ meses + valor × taxa */
const mutuario=id=>S.mutuarios.find(m=>m.id===id);
const emprestimo=id=>S.emprestimos.find(e=>e.id===id);
const mesesDe=e=>Number(e.meses||e.n)||1;
const jurosMes=e=>e.jurosMes!=null?Number(e.jurosMes):r2(e.valor*(Number(e.taxa)||0)/100);
const pagaMes=e=>e.pagaMes!=null?Number(e.pagaMes):r2(e.valor/mesesDe(e)+jurosMes(e));
const MES_ABR=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const mesTxt=k=>{const[y,m]=k.split("-");return MES_ABR[+m-1]+" "+y};
const mesCurto=k=>{const[y,m]=k.split("-");return MES_ABR[+m-1]+(m==="01"?" "+y.slice(2):"")};
function simular(valor,taxa,meses,primeira){
  valor=r2(valor);const m=Math.max(1,Math.min(60,Math.floor(Number(meses)||1)));
  const jm=r2(valor*(Number(taxa)||0)/100),cap=Math.floor(valor/m*100)/100;
  const prestacoes=[];let acc=0;
  for(let i=0;i<m;i++){const c=i===m-1?r2(valor-acc):cap;acc=r2(acc+c);prestacoes.push({n:i+1,venc:addMeses(primeira,i),capital:c,juros:jm,valor:r2(c+jm)})}
  const juros=r2(jm*m);return{meses:m,jurosMes:jm,pagaMes:r2(valor/m+jm),juros,total:r2(valor+juros),prestacao:r2(cap+jm),prestacoes};
}
/* payments cover installments in order; fines add to the balance */
function situacao(e){
  const pago=soma(e.pagamentos,p=>p.valor),multas=soma(e.multas,m=>m.valor),saldo=r2(e.total+multas-pago),t=hoje();
  let cum=0,atrasoValor=0,primeiraAtraso=null,proxima=null,capitalPago=0;
  const linhas=(e.prestacoes||[]).map(p=>{const ini=cum;cum=r2(cum+p.valor);const pg=r2(Math.max(0,Math.min(p.valor,pago-ini))),falta=r2(p.valor-pg);
    const capP=p.capital!=null?p.capital:r2(p.valor*e.valor/e.total);capitalPago=r2(capitalPago+(p.valor?pg*capP/p.valor:0));
    const st=falta<=0.004?"paga":p.venc<t?"atraso":pg>0?"parcial":"pendente";
    if(st==="atraso"){atrasoValor=r2(atrasoValor+falta);if(!primeiraAtraso)primeiraAtraso=p}
    if(falta>0.004&&!proxima)proxima={...p,falta};return{...p,pago:pg,falta,st}});
  const k=e.estado==="anulado"?"anulado":saldo<=0.004?"liquidado":atrasoValor>0?"atraso":"ativo";
  const jurosRecebidos=r2(Math.min(pago,e.total)-capitalPago);
  return{pago,multas,saldo:Math.max(0,saldo),linhas,atrasoValor,diasAtraso:primeiraAtraso?-dias(primeiraAtraso.venc):0,primeiraAtraso,proxima,k,capitalPago,capitalDivida:r2(e.valor-capitalPago),jurosRecebidos};
}
function pillEmp(s){
  if(s.k==="anulado")return'<span class="pill sem">Anulado</span>';
  if(s.k==="liquidado")return'<span class="pill doc">Liquidado</span>';
  if(s.k==="atraso")return`<span class="pill bad">${s.diasAtraso} d em atraso</span>`;
  const n=s.proxima?dias(s.proxima.venc):null;
  if(n!==null&&n<=3)return`<span class="pill warn">${n===0?"Vence hoje":"Vence em "+n+" d"}</span>`;
  return'<span class="pill ok">Em dia</span>';
}
const ativo=e=>{const k=situacao(e).k;return k==="ativo"||k==="atraso"};
const carteira=()=>S.emprestimos.filter(ativo);
function proxNumMicro(tipo){
  const y=new Date().getFullYear();let max=0;
  if(tipo==="emp"){const re=new RegExp("^EMP-"+y+"-(\\d+)$");S.emprestimos.forEach(e=>{const m=re.exec(e.numero||"");if(m)max=Math.max(max,+m[1])});return"EMP-"+y+"-"+String(max+1).padStart(4,"0")}
  const re=new RegExp("^MC-"+y+"-(\\d+)$");S.emprestimos.forEach(e=>(e.pagamentos||[]).forEach(p=>{const m=re.exec(p.recibo||"");if(m)max=Math.max(max,+m[1])}));return"MC-"+y+"-"+String(max+1).padStart(4,"0");
}

/* ---------- números da carteira ---------- */
function resumo(){
  const l=carteira();let sA=0,sI=0,sP=0,gross=0,prof=0,saldo=0,atraso=0,nAtraso=0,capDiv=0,jurosRec=0;
  l.forEach(e=>{const s=situacao(e);sA=r2(sA+e.valor);sI=r2(sI+jurosMes(e));sP=r2(sP+pagaMes(e));gross=r2(gross+e.total);prof=r2(prof+e.juros);saldo=r2(saldo+s.saldo);capDiv=r2(capDiv+s.capitalDivida);jurosRec=r2(jurosRec+s.jurosRecebidos);if(s.k==="atraso"){nAtraso++;atraso=r2(atraso+s.atrasoValor)}});
  const mes=hoje().slice(0,7);let recebidoMes=0;S.emprestimos.forEach(e=>(e.pagamentos||[]).forEach(p=>{if((p.data||"").startsWith(mes))recebidoMes=r2(recebidoMes+p.valor)}));
  const capital=Number(S.mcfg.capital)||0;
  return{n:l.length,sA,sI,sP,gross,prof,roi:sA>0?prof/sA*100:0,saldo,atraso,nAtraso,recebidoMes,capDiv,jurosRec,capital,disponivel:r2(capital-capDiv),lista:l};
}
/* calendar months for the active portfolio */
function cronograma(){
  const l=carteira();if(!l.length)return[];
  const b={};const add=(k,f,v)=>{(b[k]=b[k]||{k,prev:0,cap:0,jur:0,rec:0})[f]=r2(b[k][f]+v)};
  let ini=null,fim=null;
  l.forEach(e=>{const s0=(e.inicio||hoje()).slice(0,7);if(!ini||s0<ini)ini=s0;
    (e.prestacoes||[]).forEach(p=>{const k=p.venc.slice(0,7);if(!fim||k>fim)fim=k;add(k,"prev",p.valor);const c=p.capital!=null?p.capital:r2(p.valor*e.valor/e.total);add(k,"cap",c);add(k,"jur",r2(p.valor-c))});
    (e.pagamentos||[]).forEach(p=>{const k=(p.data||hoje()).slice(0,7);if(!fim||k>fim)fim=k;add(k,"rec",p.valor)})});
  const out=[];let[y,m]=ini.split("-").map(Number);
  for(let i=0;i<120;i++){const k=y+"-"+pad(m);out.push(b[k]||{k,prev:0,cap:0,jur:0,rec:0});if(k>=fim)break;m++;if(m>12){m=1;y++}}
  const gross=soma(l,e=>e.total);let ap=0,aj=0,ar=0,ac=0;
  return out.map(r=>{ap=r2(ap+r.prev);aj=r2(aj+r.jur);ar=r2(ar+r.rec);ac=r2(ac+r.cap);return{...r,accPrev:ap,accJur:aj,accRec:ar,accCap:ac,falta:r2(gross-ap),gross}});
}

/* ---------- painel ---------- */
function alocTxt(){const r=resumo(),a=$("#mAlloc");if(!a)return;
  if(!r.capital){a.className="hint";a.textContent="Indique a quantia investida para ver quanto ainda tem para emprestar.";return}
  if(r.disponivel<-0.005){a.className="hint bad";a.textContent="Atenção: o capital em dívida passa a quantia investida em "+mt(-r.disponivel)+".";return}
  a.className="hint";a.textContent=r.disponivel>0.005?"Ainda por emprestar: "+mt(r.disponivel)+" · capital em dívida: "+mt(r.capDiv)+".":"Toda a quantia investida está emprestada."}
function kpis5(t,sub1){return`
    <div class="kpi"><span>Total emprestado</span><b class="money" style="color:var(--c-cap)">${mt(t.sA)}</b><em>${sub1}</em></div>

const cmp=v=>v>=1e6?(v/1e6).toFixed(1).replace(".",",")+" M":v>=1e3?Math.round(v/1e3)+" mil":Math.round(v)+"";
/* line chart: k=0 is the start (nothing received), k=i is the end of month i */
function desenharLinha(){
  const svg=$("#mLine"),read=$("#mRead");if(!svg)return;
  const c=cronograma();
  if(!c.length){svg.innerHTML=`<text x="320" y="135" text-anchor="middle" style="fill:var(--muted);font-size:14px">Sem empréstimos ativos. O gráfico aparece quando registar o primeiro.</text>`;read.textContent="";return}
  const W=640,H=270,L=58,R=14,T=14,B=34,pw=W-L-R,ph=H-T-B,n=c.length,gross=c[0].gross,ymax=Math.max(gross,c[n-1].accRec)*1.08||1;
  const X=k=>L+k/n*pw,Y=v=>T+(1-v/ymax)*ph,curK=c.findIndex(r=>r.k===hoje().slice(0,7));
  let g="";
  for(let i=0;i<=4;i++){const v=ymax*i/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end" style="fill:var(--muted);font-size:11px">${cmp(v)}</text>`}
  const step=Math.ceil(n/8);for(let k=1;k<=n;k+=step)g+=`<text x="${X(k)}" y="${H-12}" text-anchor="middle" style="fill:var(--muted);font-size:11px">${mesCurto(c[k-1].k)}</text>`;
  const pts=(f,lim)=>[`${X(0)},${Y(0)}`,...c.slice(0,lim??n).map((r,i)=>X(i+1)+","+Y(f(r)))].join(" ");
  const recLim=curK>=0?curK+1:(c[n-1].k<hoje().slice(0,7)?n:0);
  g+=`<defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c-cap);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--c-cap);stop-opacity:0"/></linearGradient></defs>
    <line x1="${L}" x2="${W-R}" y1="${Y(gross)}" y2="${Y(gross)}" style="stroke:var(--c-bruto)" stroke-dasharray="5 4"/>
    <polygon points="${pts(r=>r.accPrev)} ${X(n)},${Y(0)}" fill="url(#gA)"/>
    <polyline points="${pts(r=>r.accPrev)}" fill="none" style="stroke:var(--c-cap)" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="${pts(r=>r.accJur)}" fill="none" style="stroke:var(--c-jur)" stroke-width="3" stroke-linejoin="round"/>
    ${recLim?`<polyline points="${pts(r=>r.accRec,recLim)}" fill="none" style="stroke:var(--c-rec)" stroke-width="3" stroke-linejoin="round"/>`:""}
    ${curK>=0?`<line x1="${X(curK+1)}" x2="${X(curK+1)}" y1="${T}" y2="${T+ph}" style="stroke:var(--c-rec);stroke-opacity:.6" stroke-dasharray="2 3"/><text x="${X(curK+1)}" y="${T+10}" text-anchor="middle" style="fill:var(--c-rec);font-size:10px;font-weight:600">hoje</text>`:""}
    <line id="xh" y1="${T}" y2="${T+ph}" style="stroke:var(--ink);stroke-opacity:.35;display:none"/>
    <circle id="c1" r="5" stroke-width="2" style="fill:var(--c-cap);stroke:var(--surface);display:none"/><circle id="c2" r="5" stroke-width="2" style="fill:var(--c-jur);stroke:var(--surface);display:none"/>
    <rect id="hit" x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent"/>`;
  svg.innerHTML=g;
  const xh=svg.querySelector("#xh"),c1=svg.querySelector("#c1"),c2=svg.querySelector("#c2");
  const show=k=>{k=Math.max(0,Math.min(n,k));const r=k?c[k-1]:{accPrev:0,accJur:0,accRec:0,falta:gross};
    xh.setAttribute("x1",X(k));xh.setAttribute("x2",X(k));xh.style.display="";
    c1.setAttribute("cx",X(k));c1.setAttribute("cy",Y(r.accPrev));c2.setAttribute("cx",X(k));c2.setAttribute("cy",Y(r.accJur));c1.style.display=c2.style.display="";
    read.innerHTML=k===0?"Início: ainda não recebeu nada.":`<b>${mesTxt(r.k)}:</b> previsto até aqui <b>${mt(r.accPrev)}</b> · recebido <b style="color:var(--c-rec)">${mt(r.accRec)}</b> · juros <b style="color:var(--c-jur)">${mt(r.accJur)}</b> · falta receber <b>${mt(r.falta)}</b>`};
  const move=e=>{const b=svg.getBoundingClientRect();if(!b.width)return;const x=(e.clientX-b.left)/b.width*W;show(Math.round((x-L)/pw*n))};
  const hit=svg.querySelector("#hit");hit.addEventListener("pointermove",move);hit.addEventListener("pointerdown",move);
  show(curK>=0?curK+1:n);
}
function desenharDonut(r){
  const el=$("#mDonut");if(!el)return;const C=2*Math.PI*70,p=r.gross>0?r.sA/r.gross:0;
  el.innerHTML=`<div class="donut"><svg viewBox="0 0 200 200" role="img" aria-label="Emprestado ${mt(r.sA)}, juros ${mt(r.prof)}"><g transform="rotate(-90 100 100)"><circle cx="100" cy="100" r="70" fill="none" style="stroke:var(--sunk)" stroke-width="26"/>
    ${r.gross>0?`<circle cx="100" cy="100" r="70" fill="none" style="stroke:var(--c-cap)" stroke-width="26" stroke-dasharray="${p*C} ${C}"/><circle cx="100" cy="100" r="70" fill="none" style="stroke:var(--c-jur)" stroke-width="26" stroke-dasharray="${(1-p)*C} ${C}" stroke-dashoffset="${-p*C}"/>`:""}</g></svg>
    <div class="mid"><small>Total bruto</small><b>${mt(r.gross)}</b></div></div>
    <div class="legend" style="justify-content:center"><span><i style="background:var(--c-cap)"></i>Emprestado <b>${mt(r.sA)}</b></span><span><i style="background:var(--c-jur)"></i>Juros <b>${mt(r.prof)}</b></span></div>`;
}
function desenharBarras(r){
  const el=$("#mBars");if(!el)return;
  if(!r.lista.length){el.innerHTML='<p class="note">Sem empréstimos ativos.</p>';return}
  const max=Math.max(...r.lista.map(pagaMes),1);
  el.innerHTML=[...r.lista].sort((a,b)=>pagaMes(b)-pagaMes(a)).map(e=>{const pr=r2(e.valor/mesesDe(e)),it=jurosMes(e);return`<div class="cb" title="${esc(e.mutuario?.nome)}: ${mt(pagaMes(e))}"><div class="nm">${esc(e.mutuario?.nome)}</div><div class="tr"><div style="width:${pr/max*100}%;background:var(--c-cap)"></div><div style="width:${it/max*100}%;background:var(--c-jur)"></div></div><div class="v">${mt(pagaMes(e))}</div></div>`}).join("")+
  `<div class="legend"><span><i style="background:var(--c-cap)"></i>Parcela do valor</span><span><i style="background:var(--c-jur)"></i>Juros</span></div>`;
}

function simHTML(){
  if(!S.sim)S.sim={capital:Number(S.mcfg.capital)||50000,n:3,taxa:Number(S.mcfg.taxa)||20,meses:Number(S.mcfg.n)||3,clientes:[]};
  const s=S.sim;return`
  <div><h1>Simulador</h1><p class="sub">Ajuste os dados e veja os resultados em tempo real. Quando estiver satisfeito, crie os empréstimos de uma vez.</p></div>
  <section class="panel" style="padding:16px;display:grid;gap:12px">

    <div class="fgrid four">
      <label class="f">Quantia investida (MT)<input id="sCap" type="number" min="0" step="any" value="${s.capital}" inputmode="decimal"></label>

      <div class="f"><label for="sMeses">Meses</label><div class="withbtn"><button type="button" class="btn" data-act="sim-menos" aria-label="Menos um mês">−</button><input id="sMeses" type="number" min="1" max="60" value="${s.meses}" style="text-align:center"><button type="button" class="btn" data-act="sim-mais" aria-label="Mais um mês">+</button></div></div>
    </div>
    <div class="chips">${[1,3,6,12,24].map(m=>`<button type="button" class="chip" data-simm="${m}">${m} ${m===1?"mês":"meses"}</button>`).join("")}</div>
    <p class="hint" id="sAlloc"></p>
  </section>
  <section class="kpis five" id="sKpis"></section>
  <section class="panel"><header><div><h2>Clientes da simulação</h2><p class="sub">Edite o nome, o valor e a taxa de cada cliente. Pode escrever o nome de um mutuário já registado.</p></div><div class="row" style="gap:6px"><button class="btn sm" data-act="sim-add">+ Adicionar cliente</button><button class="btn sm" data-act="sim-dividir">Dividir igualmente</button></div></header>
    <div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Valor (MT)</th><th>Taxa (%/mês)</th><th class="num">Juros/mês</th><th class="num">Paga por mês</th><th class="num">Total a receber</th><th></th></tr></thead><tbody id="sRows"></tbody><tfoot id="sFoot"></tfoot></table></div>
    <div style="padding:12px 16px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)"><p class="note" style="margin:0">Juros simples: pagamento mensal = valor ÷ meses + valor × taxa.</p><button class="btn pri" data-act="sim-criar">Criar estes empréstimos</button></div>
  </section>
  <datalist id="sMutList">${[...S.mutuarios,...S.clientes].map(m=>`<option value="${esc(m.nome)}"></option>`).join("")}</datalist>`}
function simBuild(){const s=S.sim,n=Math.max(1,Math.min(50,Math.floor(s.n)||1)),old=s.clientes;
  const parte=Math.floor(s.capital/n*100)/100;
  s.clientes=Array.from({length:n},(_,i)=>({nome:old[i]?.nome||"Cliente "+(i+1),valor:i===n-1?r2(s.capital-parte*(n-1)):parte,taxa:old[i]?.taxa??s.taxa}))}
function simRows(){
  const s=S.sim;
  $("#sRows").innerHTML=s.clientes.map((c,i)=>`<tr><td><input data-si="${i}" data-sf="nome" value="${esc(c.nome)}" list="sMutList" aria-label="Nome do cliente ${i+1}" style="min-width:180px"></td>
    <td><input data-si="${i}" data-sf="valor" type="number" min="0" step="any" value="${c.valor}" aria-label="Valor" style="min-width:110px"></td><td><input data-si="${i}" data-sf="taxa" type="number" min="0" step="any" value="${c.taxa}" aria-label="Taxa" style="min-width:80px"></td>
    <td class="num" data-sc="ji${i}"></td><td class="num" data-sc="pm${i}"></td><td class="num" data-sc="tt${i}"></td><td><button type="button" class="x" data-simdel="${i}" aria-label="Remover cliente">×</button></td></tr>`).join("");
  $("#sN").value=s.clientes.length;calcSim();rotularTabelas();
}
function simTotais(){const s=S.sim,m=Math.max(1,Math.min(60,Math.floor(s.meses)||1));let sA=0,sI=0,sP=0;
  const linhas=s.clientes.map(c=>{const it=r2(c.valor*c.taxa/100),pay=r2(c.valor/m+it);sA=r2(sA+c.valor);sI=r2(sI+it);sP=r2(sP+pay);return{it,pay,tot:r2(c.valor+it*m)}});
  const prof=r2(sI*m);return{m,sA,sI,sP,gross:r2(sA+prof),prof,roi:sA>0?prof/sA*100:0,linhas}}
function calcSim(){
  if(!$("#sKpis"))return;const s=S.sim,t=simTotais();
  t.linhas.forEach((l,i)=>{const q=k=>document.querySelector(`[data-sc="${k}${i}"]`);q("ji").textContent=mt(l.it);q("pm").textContent=mt(l.pay);q("tt").textContent=mt(l.tot)});
  $("#sFoot").innerHTML=`<tr><td><b>Total</b></td><td class="num"><b>${mt(t.sA)}</b></td><td></td><td class="num"><b>${mt(t.sI)}</b></td><td class="num"><b>${mt(t.sP)}</b></td><td class="num"><b>${mt(t.gross)}</b></td><td></td></tr>`;
  $("#sKpis").innerHTML=kpis5(t,s.clientes.length+" "+(s.clientes.length===1?"cliente":"clientes")).replace("valor emprestado + juros","valor emprestado + juros de "+t.m+" "+(t.m===1?"mês":"meses"));
  document.querySelectorAll("[data-simm]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.simm===t.m));
  const diff=r2(s.capital-t.sA),a=$("#sAlloc");
  if(diff<-0.005){a.className="hint bad";a.textContent="Atenção: os valores passam a quantia investida em "+mt(-diff)+"."}
  else{a.className="hint";a.textContent=diff>0.005?"Ainda por emprestar: "+mt(diff):"Toda a quantia investida está distribuída."}
}
function ligarSim(){
  const s=S.sim;if(!s.clientes.length)simBuild();
  const num=id=>Number($(id).value)||0;
  $("#sCap").addEventListener("input",()=>{s.capital=num("#sCap");simBuild();simRows()});
  $("#sN").addEventListener("input",()=>{s.n=num("#sN");simBuild();simRows()});
  $("#sTaxa").addEventListener("input",()=>{s.taxa=num("#sTaxa");simBuild();simRows()});

}
function simMeses(m){const s=S.sim;s.meses=Math.max(1,Math.min(60,m));$("#sMeses").value=s.meses;calcSim()}
function simAdd(){const s=S.sim,used=soma(s.clientes,c=>c.valor);s.clientes.push({nome:"Cliente "+(s.clientes.length+1),valor:r2(Math.max(0,s.capital-used)),taxa:s.taxa});s.n=s.clientes.length;simRows()}
function simDividir(){const s=S.sim,n=s.clientes.length,parte=Math.floor(s.capital/n*100)/100;s.clientes.forEach((c,i)=>c.valor=i===n-1?r2(s.capital-parte*(n-1)):parte);simRows()}
function simDel(i){const s=S.sim;if(s.clientes.length<2)return;s.clientes.splice(i,1);s.n=s.clientes.length;simRows()}

      <label class="f">Data do empréstimo<input id="nIni" type="date" value="${hoje()}"></label>

    </div>

    <div class="summary" id="nSim"></div>
    <p class="hint" id="nCap" hidden></p>
    <div class="tbl-wrap"><table class="sched"><thead><tr><th>Mês</th><th>Vencimento</th><th class="num">Parcela do valor</th><th class="num">Juros</th><th class="num">Pagamento</th></tr></thead><tbody id="nPlano"></tbody></table></div>
    <p class="note" id="err" hidden style="color:var(--bad)"></p>
  </div>
  <footer><button type="button" class="btn" data-act="fechar">Cancelar</button><button type="submit" class="btn pri">Registar empréstimo</button></footer>`);
  const nm=()=>{const v=!$("#nMut").value;dlg.querySelectorAll("[data-nm]").forEach(el=>el.hidden=!v)};
  let primManual=false;
  const prim=()=>{if(!primManual)$("#nPrim").value=addMeses($("#nIni").value||hoje(),1)};
  const sim=()=>{const s=simular($("#nValor").value,$("#nTaxa").value,$("#nMeses").value,$("#nPrim").value||hoje()),v=r2($("#nValor").value);
    $("#nSim").innerHTML=`<div><em>Juros/mês</em><b style="color:var(--c-jur)">${mt(s.jurosMes)}</b></div><div><em>Paga por mês</em><b>${mt(s.pagaMes)}</b></div><div><em>Total a receber</em><b style="color:var(--c-rec)">${mt(s.total)}</b></div><div><em>Lucro</em><b>${mt(s.juros)}</b></div><div><em>Retorno</em><b>${v>0?(s.juros/v*100).toFixed(1).replace(".",","):"0"}%</b></div><div><em>Último pagamento</em><b>${fmtD(s.prestacoes[s.prestacoes.length-1].venc)}</b></div>`;
    document.querySelectorAll("#nChips .chip").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.nmm===s.meses));
    const r=resumo(),h=$("#nCap");if(r.capital){const disp=r2(r.disponivel-v);h.hidden=false;h.className=disp<-0.005?"hint bad":"hint";h.textContent=disp<-0.005?"Este empréstimo passa a quantia investida em "+mt(-disp)+".":"Depois deste empréstimo fica com "+mt(disp)+" por emprestar."}else h.hidden=true;
    const ps=s.prestacoes;$("#nPlano").innerHTML=(ps.length>8?[...ps.slice(0,6),null,ps[ps.length-1]]:ps).map(p=>p?`<tr><td>${p.n}</td><td>${fmtD(p.venc)}</td><td class="num">${mt(p.capital)}</td><td class="num">${mt(p.juros)}</td><td class="num"><b>${mt(p.valor)}</b></td></tr>`:`<tr><td colspan="5" class="tag">…</td></tr>`).join("")};
  const setM=m=>{$("#nMeses").value=Math.max(1,Math.min(60,m));sim()};
  $("#nMenos").onclick=()=>setM((Number($("#nMeses").value)||2)-1);$("#nMais").onclick=()=>setM((Number($("#nMeses").value)||0)+1);
  $("#nChips").onclick=e=>{const b=e.target.closest("[data-nmm]");if(b)setM(+b.dataset.nmm)};
  $("#nMut").onchange=nm;nm();
  $("#nIni").addEventListener("change",()=>{prim();sim()});
  $("#nPrim").addEventListener("change",()=>{primManual=true;sim()});
  ["#nValor","#nTaxa","#nMeses"].forEach(s=>$(s).addEventListener("input",sim));
  prim();sim();
  $("#dform").onsubmit=async e=>{e.preventDefault();const er=$("#err"),bad=t=>{er.textContent=t;er.hidden=false};
    const valor=r2($("#nValor").value);if(!(valor>0))return bad("Indique o valor emprestado.");
    const v=$("#nMut").value;let m=null;
    if(v.startsWith("c:")){const cl=cliente(v.slice(2));m=S.mutuarios.find(x=>x.clienteId===cl.id);if(!m){m={id:novoId("m"),nome:cl.nome,telefone:cl.telefone||"",email:cl.email||"",clienteId:cl.id,criadoEm:new Date().toISOString()};await store.put("mc_mutuarios",m)}}
    else if(v)m=mutuario(v);
    else{const nome=$("#nNome").value.trim();if(!nome)return bad("Indique o nome do cliente.");
      m={id:novoId("m"),nome,telefone:$("#nTel").value.trim(),email:$("#nEmail").value.trim(),bi:$("#nBi").value.trim(),criadoEm:new Date().toISOString()};await store.put("mc_mutuarios",m)}
    const emp=await criarEmprestimo(m,valor,$("#nTaxa").value,$("#nMeses").value,$("#nIni").value||hoje(),$("#nPrim").value||addMeses(hoje(),1),$("#nGar").value.trim());
    toast("Empréstimo "+emp.numero+" registado");abrirEmp(emp.id)};
}

/* ---------- detalhe ---------- */

  <div class="body">
    <div class="summary"><div><em>Valor emprestado</em><b style="color:var(--c-cap)">${mt(e.valor)}</b></div><div><em>Taxa · prazo</em><b>${pct(e.taxa)} ao mês · ${mesesDe(e)} ${mesesDe(e)===1?"mês":"meses"}</b></div><div><em>Paga por mês</em><b>${mt(pagaMes(e))}</b></div>
      <div><em>Juros/mês · lucro</em><b style="color:var(--c-jur)">${mt(jurosMes(e))} · ${mt(e.juros)}</b></div><div><em>Pago${s.multas?" · multas "+mt(s.multas):""}</em><b style="color:var(--c-rec)">${mt(s.pago)}</b></div><div><em>Saldo</em><b style="color:${s.saldo>0?"var(--bad)":"var(--ok)"}">${mt(s.saldo)}</b></div></div>
    ${e.garantia?`<p class="note" style="margin:0">Garantia: ${esc(e.garantia)}</p>`:""}
    <div><h3 style="font-size:16px;margin-bottom:6px">Cronograma</h3>
    <div class="tbl-wrap"><table class="sched"><thead><tr><th>Mês</th><th>Vencimento</th><th class="num">Parcela</th><th class="num">Juros</th><th class="num">Pagamento</th><th class="num">Pago</th><th>Situação</th></tr></thead><tbody>${s.linhas.map(l=>`<tr><td>${l.n}</td><td>${fmtD(l.venc)}</td><td class="num">${mt(l.capital??l.valor)}</td><td class="num">${mt(l.juros??0)}</td><td class="num">${mt(l.valor)}</td><td class="num">${mt(l.pago)}</td><td>${stPill[l.st]}</td></tr>`).join("")}</tbody></table></div></div>

    ${(e.multas||[]).length?`<div><h3 style="font-size:16px;margin-bottom:6px">Multas</h3>${e.multas.map(m=>`<div class="row spread" style="padding:4px 0;border-bottom:1px solid var(--line)"><span>${fmtD(m.data)} · ${esc(m.motivo)}</span><span class="row" style="gap:8px"><b class="num">${mt(m.valor)}</b>${live?`<button type="button" class="btn sm danger" data-act="mc-rm-multa" data-id="${e.id}" data-mid="${m.id}">Remover</button>`:""}</span></div>`).join("")}</div>`:""}

/* ---------- pagamento / multa ---------- */
function abrirPagamento(id){
  const e=emprestimo(id),s=situacao(e),sug=s.atrasoValor>0?s.atrasoValor:s.proxima?s.proxima.falta:s.saldo;
  abrir(hdr("Registar pagamento",esc(e.mutuario?.nome)+" · "+esc(e.numero))+`
  <div class="body">
    <div class="summary"><div><em>Saldo atual</em><b>${mt(s.saldo)}</b></div><div><em>Em atraso</em><b>${mt(s.atrasoValor)}</b></div><div><em>Próximo pagamento</em><b>${s.proxima?mt(s.proxima.falta)+" · "+fmtD(s.proxima.venc):"—"}</b></div></div>
    <div class="fgrid">
      <label class="f">Valor recebido (MT)<span class="withbtn"><input id="pValor" type="number" min="0" step="0.01" value="${esc(Math.min(sug,s.saldo))}"><button type="button" class="btn sm" id="pTudo">Saldo total</button></span></label>
      <label class="f">Data<input id="pData" type="date" value="${hoje()}"></label>
      <label class="f">Método<select id="pMet">${opts(METODOS.map(m=>[m,m]),"M-Pesa")}</select></label>
      <label class="f">Referência da transação<input id="pRef" class="mono"></label>
    </div>
    <div class="calc" id="pCalc"></div>
    <p class="note" id="err" hidden style="color:var(--bad)"></p>
  </div>
  <footer><button type="button" class="btn" data-act="fechar">Cancelar</button><button type="submit" class="btn pri">Registar e emitir recibo</button></footer>`);
  const calc=()=>{const v=r2($("#pValor").value);$("#pCalc").innerHTML=`Saldo depois deste pagamento: <b>${mt(Math.max(0,s.saldo-v))}</b>${v>=s.saldo-0.004?" · o empréstimo fica <b>liquidado</b>":""}`};
  $("#pValor").addEventListener("input",calc);$("#pTudo").onclick=()=>{$("#pValor").value=s.saldo;calc()};calc();
  $("#dform").onsubmit=async ev=>{ev.preventDefault();const er=$("#err"),v=r2($("#pValor").value);
    if(!(v>0)){er.textContent="Indique o valor recebido.";er.hidden=false;return}
    if(v>s.saldo+0.004){er.textContent="O valor é maior do que o saldo em dívida ("+mt(s.saldo)+").";er.hidden=false;return}
    const p={id:novoId("p"),recibo:proxNumMicro("rec"),data:$("#pData").value||hoje(),valor:v,metodo:$("#pMet").value,ref:$("#pRef").value.trim(),criadoEm:new Date().toISOString()};
    const out={...e,pagamentos:[...(e.pagamentos||[]),p]};
    if(situacao(out).saldo<=0.004)out.estado="liquidado";
    await store.put("mc_emprestimos",out);mailRecibo(out.id,p.id,true)};
}
function abrirMulta(id){
  const e=emprestimo(id),s=situacao(e),base=s.primeiraAtraso?s.linhas.find(l=>l.n===s.primeiraAtraso.n).falta:pagaMes(e);
  abrir(hdr("Adicionar multa",esc(e.mutuario?.nome)+" · "+esc(e.numero))+`<div class="body"><div class="fgrid">
    <label class="f">Valor (MT)<input id="mValor" type="number" min="0" step="0.01" value="${esc(r2(base*(Number(S.mcfg.multa)||0)/100))}"></label>
    <label class="f">Data<input id="mData" type="date" value="${hoje()}"></label>
    <label class="f full">Motivo<input id="mMot" value="${esc(s.primeiraAtraso?`Atraso do pagamento do mês ${s.primeiraAtraso.n} (venceu ${fmtD(s.primeiraAtraso.venc)})`:"Multa")}"></label></div>
    <p class="note">Valor sugerido: ${pct(S.mcfg.multa)} do pagamento em atraso. A multa soma-se ao saldo.</p></div>
    <footer><button type="button" class="btn" data-act="fechar">Cancelar</button><button type="submit" class="btn pri">Adicionar multa</button></footer>`);
  $("#dform").onsubmit=async ev=>{ev.preventDefault();const v=r2($("#mValor").value);if(!(v>0))return;
    await store.put("mc_emprestimos",{...e,multas:[...(e.multas||[]),{id:novoId("x"),data:$("#mData").value||hoje(),valor:v,motivo:$("#mMot").value.trim()||"Multa"}]});abrirEmp(id);toast("Multa adicionada")};
}

${s.saldo<=0.004?"O seu empréstimo está totalmente liquidado. Obrigado pela pontualidade.":`Saldo em dívida: ${mt(s.saldo)}${s.proxima?`\nPróximo pagamento: ${mt(s.proxima.falta)} a ${fmtD(s.proxima.venc)}`:""}`}

async function pdfPlano(e){

  const nomeSt={paga:"Paga",parcial:"Parcial",atraso:"Em atraso",pendente:"Por pagar"};
  y=pdfTabela(pdf,y,cols,s.linhas.map(l=>[String(l.n),fmtD(l.venc),mt(l.capital??l.valor),mt(l.juros??0),mt(l.valor),nomeSt[l.st]]),0);
  y+=RH;if(y>240){pdf.addPage();y=20}
  pdfSecao(pdf,"CONDIÇÕES",y);

  y+=3*RH;if(y>255){pdf.addPage();y=30}
  pdf.setDrawColor(...INK);pdf.setLineWidth(0.3);pdf.line(X.B,y,X.D,y);pdf.line(X.F,y,X.END,y);
  pdf.setFont("helvetica","bold");pdf.setFontSize(8.5);pdf.text("O credor",X.B,y+4);pdf.text("O cliente",X.F,y+4);
  pdf.setFont("helvetica","normal");pdf.setFontSize(8);pdf.text(c.signatario||c.nome,X.B,y+8);pdf.text(m.nome||"",X.F,y+8);pdf.text((c.cidade||"Maputo")+", "+fmtD(e.inicio),X.B,y+12);
  pdfRodape(pdf,c.rodape);
  return pdfOut(pdf,e.numero+"-plano.pdf");
}
