/* ================= site próprio: Supabase (base de dados + logins por e-mail) ================= */
let sb=null;
const SUPA=()=>window.HS_SUPA;
/* Same calls as the claude.ai database, backed by the "registos" table with live updates. */
function criarSupaDB(cliente){
  const cache={},ouv=new Set();let pend=false,canal=null;
  const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
  const avisar=()=>{if(pend)return;pend=true;setTimeout(()=>{pend=false;ouv.forEach(f=>{try{f()}catch(e){console.error(e)}})},0)};
  const snapDoc=(c,id)=>{const v=cache[c]?.[id];return{id,exists:!!v,data:()=>v?clone(v):undefined}};
  const snapCol=c=>{const o=cache[c]||{};return{docs:Object.keys(o).map(id=>({id,exists:true,data:()=>clone(o[id])}))}};
  const falhou=(e,acao)=>{console.error(e);const m=String(e?.message||"");toast(/JWT|token|session/i.test(m)?"A sessão expirou. Entre de novo.":"Não foi possível "+acao+". Verifique a Internet e tente de novo.")};
  const ref=(c,id)=>({id,
    get:async()=>snapDoc(c,id),
    set:async v=>{(cache[c]=cache[c]||{})[id]=clone(v);avisar();const{error}=await cliente.from("registos").upsert({col:c,id,data:v});if(error){falhou(error,"guardar");throw error}},
    delete:async()=>{if(cache[c])delete cache[c][id];avisar();const{error}=await cliente.from("registos").delete().eq("col",c).eq("id",id);if(error){falhou(error,"eliminar");throw error}},
    onSnapshot:cb=>{const f=()=>cb(snapDoc(c,id));ouv.add(f);setTimeout(f,0);return()=>ouv.delete(f)}});
  return{supa:true,
    async carregar(){for(const k in cache)delete cache[k];let de=0;const passo=1000;
      for(;;){const{data,error}=await cliente.from("registos").select("col,id,data").order("col").order("id").range(de,de+passo-1);if(error)throw error;
        data.forEach(r=>{(cache[r.col]=cache[r.col]||{})[r.id]=r.data});if(data.length<passo)break;de+=passo}
      if(canal)cliente.removeChannel(canal);
      canal=cliente.channel("registos-live").on("postgres_changes",{event:"*",schema:"public",table:"registos"},p=>{
        if(p.eventType==="DELETE"){const o=p.old||{};if(cache[o.col])delete cache[o.col][o.id]}else{const n=p.new;(cache[n.col]=cache[n.col]||{})[n.id]=n.data}avisar()}).subscribe();
      avisar()},
    parar(){if(canal){cliente.removeChannel(canal);canal=null}for(const k in cache)delete cache[k]},
    doc:p=>{const[c,id]=p.split("/");return ref(c,id)},
    collection:c=>({doc:id=>ref(c,id),onSnapshot:cb=>{const f=()=>cb(snapCol(c));ouv.add(f);setTimeout(f,0);return()=>ouv.delete(f)}})};
}
/* calls the user-management function; sends the session token when there is one */
async function fnUtilizadores(corpo){
  const s=(await sb.auth.getSession()).data.session;
  const h={"Content-Type":"application/json",apikey:SUPA().key};if(s)h.Authorization="Bearer "+s.access_token;
  let r;try{r=await fetch(SUPA().url+"/functions/v1/utilizadores",{method:"POST",headers:h,body:JSON.stringify(corpo)})}catch(e){throw new Error("Sem ligação ao servidor. Verifique a Internet.")}
  let j={};try{j=await r.json()}catch(_){}
  if(!r.ok)throw new Error(j.erro||"O servidor respondeu com erro ("+r.status+").");return j;
}
/* password-recovery link from the e-mail lands back here with type=recovery in the address */
const urlRecuperacao=()=>location.origin+location.pathname;
let emRecuperacao=/type=recovery/.test(location.hash);
const erroLink=(()=>{const m=/error_description=([^&]+)/.exec(location.hash);return m?decodeURIComponent(m[1].replace(/\+/g," ")):""})();
function limparEndereco(){try{history.replaceState(null,"",location.pathname+location.search)}catch(_){}}
async function supaGate(){
  telaAuth("A verificar acesso…","");
  if(erroLink){limparEndereco();emRecuperacao=false;return telaLoginEmail("O link de recuperação expirou ou já foi usado. Peça um novo em “Esqueci a senha”.")}
  if(emRecuperacao){sb.auth.onAuthStateChange((ev,s)=>{if(s&&emRecuperacao){emRecuperacao=false;telaNovaSenha(s.user.email)}});
    const{data}=await sb.auth.getSession();if(data.session){emRecuperacao=false;return telaNovaSenha(data.session.user.email)}
    setTimeout(()=>{if(emRecuperacao){emRecuperacao=false;limparEndereco();telaLoginEmail("Não foi possível validar o link. Peça um novo em “Esqueci a senha”.")}},6000);return}
  try{const{data}=await sb.auth.getSession();
    if(data.session)return supaEntrar(data.session.user.email);
    const e=await fnUtilizadores({acao:"estado"});
    if(!e.temAdmin)return telaPrimeiroAdmin();
    telaLoginEmail();
  }catch(err){console.error(err);telaAuth("Sem ligação","Não foi possível contactar o servidor. Verifique a Internet e recarregue a página.",`<button class="btn pri" onclick="location.reload()">Tentar de novo</button>`)}
}
function telaLoginEmail(aviso){
  telaAuth("Entrar",aviso||"Entre com o seu e-mail e senha.",`<form id="lForm" novalidate>
    <label class="f">E-mail<input id="lU" type="email" autocomplete="username" autocapitalize="none" inputmode="email"></label>
    <label class="f">Senha<span class="withbtn"><input id="lP" type="password" autocomplete="current-password"><button type="button" class="btn sm" id="lVer">Mostrar</button></span></label>
    <p class="err" id="lErr" hidden></p><button class="btn pri" type="submit" id="lBtn">Entrar</button>
    <button type="button" class="btn" id="lEsq">Esqueci a senha</button></form>`);
  $("#lEsq").onclick=()=>telaRecuperar($("#lU").value.trim());
  $("#lVer").onclick=()=>{const p=$("#lP"),v=p.type==="password";p.type=v?"text":"password";$("#lVer").textContent=v?"Ocultar":"Mostrar"};
  $("#lForm").onsubmit=async e=>{e.preventDefault();const er=$("#lErr"),bt=$("#lBtn");er.hidden=true;
    const email=$("#lU").value.trim().toLowerCase(),senha=$("#lP").value;
    if(!emailOk(email)||!senha){er.textContent="Indique o e-mail e a senha.";er.hidden=false;return}
    bt.disabled=true;bt.textContent="A entrar…";
    const{data,error}=await sb.auth.signInWithPassword({email,password:senha});
    bt.disabled=false;bt.textContent="Entrar";
    if(error){er.textContent=/invalid|credentials/i.test(error.message)?"E-mail ou senha incorretos.":/network|fetch/i.test(error.message)?"Sem ligação ao servidor. Verifique a Internet.":"Não foi possível entrar: "+error.message;er.hidden=false;$("#lP").value="";return}
    supaEntrar(data.user.email)};
}
function telaRecuperar(email){
  telaAuth("Recuperar senha","Escreva o e-mail da sua conta. Enviamos um link para definir uma senha nova.",`<form id="rForm" novalidate>
    <label class="f">E-mail<input id="rE" type="email" autocomplete="username" autocapitalize="none" inputmode="email" value="${esc(email||"")}"></label>
    <p class="err" id="rErr" hidden></p><p class="note" id="rOk" hidden style="color:var(--ok);margin:0"></p>
    <button class="btn pri" type="submit" id="rBtn">Enviar link</button><button type="button" class="btn" id="rVolta">Voltar ao login</button></form>`);
  $("#rVolta").onclick=()=>telaLoginEmail();
  $("#rForm").onsubmit=async e=>{e.preventDefault();const er=$("#rErr"),ok=$("#rOk"),bt=$("#rBtn"),em=$("#rE").value.trim().toLowerCase();er.hidden=ok.hidden=true;
    if(!emailOk(em)){er.textContent="Indique um e-mail válido.";er.hidden=false;return}
    bt.disabled=true;bt.textContent="A enviar…";
    const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:urlRecuperacao()});
    bt.disabled=false;bt.textContent="Enviar de novo";
    if(error&&/rate|limit|seconds/i.test(error.message)){er.textContent="Foram pedidos demasiados e-mails. Espere alguns minutos e tente de novo.";er.hidden=false;return}
    if(error&&/network|fetch/i.test(error.message)){er.textContent="Sem ligação ao servidor. Verifique a Internet.";er.hidden=false;return}
    ok.textContent="Se "+em+" tiver conta, vai receber um e-mail com o link nos próximos minutos. Veja também a pasta de spam. O link abre esta página para definir a senha nova.";ok.hidden=false};
}
function telaNovaSenha(email){
  telaAuth("Definir senha nova","Conta: "+esc(email||""),`<form id="nForm" novalidate>
    <label class="f">Senha nova<input id="nP" type="password" autocomplete="new-password"></label>
    <label class="f">Repetir senha nova<input id="nP2" type="password" autocomplete="new-password"></label>
    <p class="err" id="nErr" hidden></p><button class="btn pri" type="submit" id="nBtn">Guardar e entrar</button></form>`);
  $("#nForm").onsubmit=async e=>{e.preventDefault();const er=$("#nErr"),bt=$("#nBtn");const v=validarSenha($("#nP").value,$("#nP2").value);if(v){er.textContent=v;er.hidden=false;return}
    bt.disabled=true;bt.textContent="A guardar…";const{error}=await sb.auth.updateUser({password:$("#nP").value});
    if(error){bt.disabled=false;bt.textContent="Guardar e entrar";er.textContent="Não foi possível guardar: "+error.message;er.hidden=false;return}
    limparEndereco();toast("Senha alterada");supaEntrar(email)};

async function supaEntrar(email){
  telaAuth("A carregar os seus dados…","");
  try{const{data:m,error}=await sb.from("membros").select("email,nome,papel").eq("email",email.toLowerCase()).maybeSingle();if(error)throw error;
    if(!m){await sb.auth.signOut();return telaLoginEmail("A conta "+email+" não tem acesso a este sistema. Peça ao administrador para a adicionar.")}
    admin={usuario:m.email,nome:m.nome,papel:m.papel,supa:true};
    await db.carregar();entrar();
  }catch(err){console.error(err);telaAuth("Erro ao carregar","Não foi possível carregar os dados. Verifique a Internet e tente de novo.",`<button class="btn pri" onclick="location.reload()">Tentar de novo</button>`)}
}

let admin=null,unsubs=[],idleT=null,idleArmado=false;
const SESS="iptv_sessao",TENT="iptv_tentativas",ITER=210000,INATIVO=30*60e3,DURACAO=8*3600e3;
function store_(area,k,v){try{const st=window[area];if(v===undefined)return JSON.parse(st.getItem(k)||"null");if(v===null)st.removeItem(k);else st.setItem(k,JSON.stringify(v))}catch(e){return null}}
const toB64=u=>{let b="";u.forEach(x=>b+=String.fromCharCode(x));return btoa(b)};
const fromB64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function derivar(pass,salt,iter){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:fromB64(salt),iterations:iter},k,256);return toB64(new Uint8Array(bits))}
async function novoHash(pass){const s=new Uint8Array(16);crypto.getRandomValues(s);const salt=toB64(s);return{salt,iteracoes:ITER,hash:await derivar(pass,salt,ITER)}}
function iguais(a,b){a=String(a);b=String(b);let r=a.length^b.length;for(let i=0;i<Math.max(a.length,b.length);i++)r|=(a.charCodeAt(i)||0)^(b.charCodeAt(i)||0);return r===0}
async function confere(u,pass){if(!admin)return false;const h=await derivar(pass,admin.salt,admin.iteracoes||ITER);const okU=iguais(String(u).trim().toLowerCase(),admin.usuario),okH=iguais(h,admin.hash);return okU&&okH}
function validarSenha(a,b){if(a.length<8)return"A senha precisa de pelo menos 8 caracteres.";if(!/[A-Za-z]/.test(a)||!/\d/.test(a))return"Use letras e números na senha.";if(a!==b)return"As senhas não coincidem.";return""}
async function gravarAdmin(a){await db.doc("seguranca/admin").set(a);admin=a}
function guardarSessao(){if(admin?.supa)return;store_("sessionStorage",SESS,{u:admin.usuario,exp:Date.now()+DURACAO,k:admin.hash.slice(-16)})}
function sessaoValida(){const se=store_("sessionStorage",SESS);return!!(admin&&se&&se.exp>Date.now()&&se.k===admin.hash.slice(-16)&&!admin.trocarSenha)}

function subscrever(){
  const err=e=>{console.error(e);if(e&&e.code==="revoked")toast("O acesso aos dados foi retirado nesta vista.")};
  const fixCfg=(base,d)=>{const c={...base,...d};if(base.planos&&(!Array.isArray(c.planos)||!c.planos.length))c.planos=PLANOS_PADRAO;return c};
  let pend=7;const pronto=()=>{if(--pend<=0){S.ready=true}refresh()};
  const once=f=>{let first=true;return s=>{f(s);if(first){first=false;pronto()}else refresh()}};
  unsubs.push(db.doc("config/negocio").onSnapshot(s=>{S.cfg=fixCfg(CFG_IPTV,s.exists?s.data():{});refresh()},err));
  unsubs.push(db.doc("config/servicos").onSnapshot(s=>{S.vcfg={...CFG_SERV,...(s.exists?s.data():{})};refresh()},err));
  unsubs.push(db.collection("sv_servicos").onSnapshot(once(s=>{S.servicos=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
  unsubs.push(db.collection("sv_clientes").onSnapshot(once(s=>{S.vclientes=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
  unsubs.push(db.collection("sv_documentos").onSnapshot(once(s=>{S.vdocs=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
  unsubs.push(db.doc("config/sms").onSnapshot(s=>{S.scfg={...CFG_SMS,...(s.exists?s.data():{})};refresh()},err));
  unsubs.push(db.doc("config/microcredito").onSnapshot(s=>{S.mcfg=fixCfg(CFG_MICRO,s.exists?s.data():{});refresh()},err));
  unsubs.push(db.collection("clientes").onSnapshot(once(s=>{S.clientes=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
  unsubs.push(db.collection("documentos").onSnapshot(once(s=>{S.docs=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
  unsubs.push(db.collection("mc_mutuarios").onSnapshot(once(s=>{S.mutuarios=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
  unsubs.push(db.collection("mc_emprestimos").onSnapshot(once(s=>{S.emprestimos=s.docs.map(d=>({...d.data(),id:d.id}))}),err));
}

    case"sv-novo-cliente":abrirVCliente();break;
    case"sv-editar-cliente":abrirVCliente(id);break;
    case"sv-cotar-cliente":abrirCotacao(null,id);break;
    case"sv-apagar-servico":if(confirmar(b,"Confirmar eliminação")){await store.del("sv_servicos",id);fechar();toast("Serviço eliminado")}break;
    case"sv-apagar-cliente":if(S.vdocs.some(d=>d.clienteId===id)){toast("Este cliente tem cotações registadas e não pode ser eliminado.");break}if(confirmar(b,"Confirmar eliminação")){await store.del("sv_clientes",id);fechar();toast("Cliente eliminado")}break;
    case"sv-csv-docs":csvDocs();break;
    case"sv-csv-serv":csvServ();break;
    case"sv-backup":backupJSON();break;
    case"sim-menos":simMeses((Number($("#sMeses").value)||2)-1);break;
    case"sim-mais":simMeses((Number($("#sMeses").value)||0)+1);break;
    case"sim-add":simAdd();break;
    case"sim-dividir":simDividir();break;
    case"sim-criar":simCriar();break;
    case"mc-csv":await csvMes();break;
    case"emprestar-cliente":abrirNovoEmp("c:"+id);break;
    case"novo-mut":abrirMutuario();break;
    case"editar-mut":abrirMutuario(id);break;
    case"apagar-mut":if(S.emprestimos.some(x=>x.mutuarioId===id)){toast("Este mutuário tem empréstimos registados e não pode ser eliminado.");break}if(confirmar(b,"Confirmar eliminação")){await store.del("mc_mutuarios",id);fechar();toast("Mutuário eliminado")}break;
    case"ver-emp":abrirEmp(id);break;
    case"pagar":abrirPagamento(id);break;
    case"multa":abrirMulta(id);break;
    case"lembrete":abrirLembrete(id);break;
    case"mc-rm-multa":if(confirmar(b,"Confirmar")){const x=emprestimo(id);await store.put("mc_emprestimos",{...x,multas:x.multas.filter(m=>m.id!==b.dataset.mid)});abrirEmp(id)}break;
    case"mc-recibo-pdf":{const x=emprestimo(id),p=x.pagamentos.find(q=>q.id===b.dataset.pid);b.disabled=true;await guardarPDF(()=>pdfReciboMC(x,p));b.disabled=false;break}
    case"mc-recibo-mail":mailRecibo(id,b.dataset.pid,false);break;
    case"mc-plano-pdf":b.disabled=true;await guardarPDF(()=>pdfPlano(emprestimo(id)));b.disabled=false;break;
    case"anular-emp":if(confirmar(b,"Confirmar anulação")){await store.put("mc_emprestimos",{...emprestimo(id),estado:"anulado"});abrirEmp(id);toast("Empréstimo anulado")}break;
    case"apagar-emp":if(confirmar(b,"Confirmar eliminação")){await store.del("mc_emprestimos",id);fechar();toast("Empréstimo eliminado")}break;
  }
});
