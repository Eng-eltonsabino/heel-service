/* Layout: Apple-style, with motion (staggered entrances, animated illustrations, count-up figures) — — black global nav, frosted sub-nav with section links and a blue pill CTA, hairline cards on parchment, full-bleed alternating tiles on the launcher */

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#7D93FF; --accent-ink:#0D1120; --accent-soft:#1F2952;
  --brand-navy:#0A0F1C; --brand-red:#D2433A;
  --ok:#4CC48A; --ok-soft:#14322A; --warn:#F2AA4C; --warn-soft:#3A2B14; --bad:#FF7B70; --bad-soft:#3D1D1D;
  --c-cap:#6E93FF; --c-jur:#F2AA4C; --c-rec:#4CC48A; --c-bruto:#5D6987;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1120; --surface:#151B2D; --sunk:#1B2236; --ink:#E5E9F3; --muted:#97A0B6; --line:#27304A;
  --accent:#7D93FF; --accent-ink:#0D1120; --accent-soft:#1F2952;
  --brand-navy:#0A0F1C; --brand-red:#D2433A;
  --ok:#4CC48A; --ok-soft:#14322A; --warn:#F2AA4C; --warn-soft:#3A2B14; --bad:#FF7B70; --bad-soft:#3D1D1D;

#mLine,.donut svg{display:block;width:100%;height:auto}
.donut{position:relative;max-width:230px;margin:6px auto 0}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .mid small{color:var(--muted);font-size:12px}.donut .mid b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.cb{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.cb .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb .tr{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden;display:flex}
.cb .tr div{height:100%}
.cb .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ins{display:grid;gap:8px;padding:12px 16px 16px}
.ins div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--sunk);border-radius:8px;font-size:13px}
.ins span{color:var(--muted)}.ins b{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{background:var(--sunk);border-top:1px solid var(--line)}
td input{min-width:0}
.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (max-width:760px){.overview{grid-template-columns:repeat(2,minmax(0,1fr))}}
.overview div{background:var(--surface);padding:14px 16px;display:grid;gap:2px;min-width:0}
.overview em{font-style:normal;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.overview b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overview small{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.kpi,.biz{transition:border-color .15s, filter .15s}}

/* ===== responsive: phones and tablets ===== */
main{grid-template-columns:minmax(0,1fr)}
main>*{min-width:0}
.dlg{grid-template-columns:minmax(0,1fr)}
.dlg>.body{grid-template-columns:minmax(0,1fr)}
.dlg>.body>*,fieldset>*{min-width:0}
.btn .lbl{display:inline}
@media (max-width:900px){
  .who-hdr{display:none}
}
@media (max-width:640px){
  .bar{flex-wrap:nowrap;gap:10px;padding-block:10px}
  .brand{gap:10px}
  .brand small{display:none}
  #hdrActs{gap:6px!important;flex-wrap:nowrap;flex:none}
  #hdrActs .btn{padding:7px 10px}
  #hdrActs .btn .lbl{display:none}
  nav.tabs{margin-inline:-16px;padding-inline:12px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 22px),transparent)}
  nav.tabs button{padding:10px 11px;font-size:13.5px}
  main{padding-block:16px 48px;gap:16px}
  h1{font-size:25px}
  .panel>header{padding:14px}
  .toolbar{padding:12px 14px}
  .row.spread>.row{width:100%}
  .kpis{gap:10px}
  .kpi{padding:12px 14px}
  .kpi b{font-size:28px}.kpi b.money,.kpi b[class~=money]{font-size:20px}
  /* tables become cards */
  #view .tbl-wrap{overflow:visible}
  #view .tbl-wrap table{min-width:0}
  #view .tbl-wrap thead{display:none}
  #view .tbl-wrap tbody tr,#view .tbl-wrap tfoot tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px;padding:14px;border-bottom:1px solid var(--line)}
  #view .tbl-wrap tbody tr:last-child{border-bottom:0}
  #view .tbl-wrap td{display:block;padding:0;border:0;text-align:left;white-space:normal;max-width:none!important;min-width:0}
  #view .tbl-wrap td.num{text-align:left}
  #view .tbl-wrap td[data-label]::before{content:attr(data-label);display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:2px}
  #view .tbl-wrap td[data-label=""]::before{display:none}
  #view .tbl-wrap td:first-child,#view .tbl-wrap td:last-child,#view .tbl-wrap td[colspan]{grid-column:1/-1}
  #view .tbl-wrap td:first-child::before{display:none}
  #view .tbl-wrap td:first-child b{font-size:15px}
  #view .tbl-wrap td .acts{justify-content:flex-start}
  #view .tbl-wrap td input{width:100%}
  #view .tbl-wrap tfoot tr{background:var(--sunk)}
  #view .tbl-wrap tfoot td:empty{display:none}
  tbody tr:hover td{background:none}
  /* dialogs become full-screen sheets */
  dialog,dialog.wide{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;margin:0;border-radius:0}
  .dlg{max-height:100dvh;height:100dvh}
  .dlg>header{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;border-radius:0}
  .dlg>header::before{border-radius:0}
  .dlg>.body{padding:14px 16px}
  .dlg>footer{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .dlg>footer .btn{flex:1 1 auto}
  .dlg>footer .btn.pri{flex-basis:100%;order:9;padding:11px}
  .dlg>footer [style*="margin-right:auto"]{margin-right:0!important}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qsum{grid-template-columns:minmax(0,1fr)}
  .cot{padding:10px}.cot .band{height:56px}.cot .band img{height:40px}
  .auth{padding-block:12px;min-height:0}
  .auth-card,.auth-side{padding:22px 18px}
  input,select,textarea{font-size:16px}
}
@media (max-width:640px){.summary b{white-space:normal;overflow-wrap:anywhere;font-size:15px}}
@media (max-width:440px){.brand>div{display:none}.brand .logo{height:32px}}
@media (max-width:380px){
  .brand>div{display:block}
  .kpis{grid-template-columns:minmax(0,1fr)}
}

/* ===== Apple-style layer: one blue accent, system type, hairline cards, black global nav + frosted sub-nav, full-bleed tiles ===== */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --sunk:#f5f5f7; --pearl:#fafafc; --ink:#1d1d1f; --muted:#6e6e73; --line:#e0e0e0;
  --accent:#0066cc; --accent-focus:#0071e3; --accent-ink:#ffffff; --accent-soft:#e8f1fb; --on-dark:#2997ff;
  --tile-dark:#272729; --tile-dark-2:#2a2a2c; --tile-dark-3:#252527; --gnav:#000000; --subnav:rgba(245,245,247,.8);
  --ok:#1d7a3e; --ok-soft:#e5f4ea; --warn:#b25000; --warn-soft:#fdf0e1; --bad:#d70015; --bad-soft:#fde8ea;
  --f-display:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1d1d1f; --sunk:#2a2a2c; --pearl:#161617; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
  --accent:#2997ff; --accent-focus:#2997ff; --accent-ink:#ffffff; --accent-soft:#0b2a4a; --subnav:rgba(22,22,23,.8);
  --tile-dark:#1d1d1f; --tile-dark-2:#1d1d1f; --tile-dark-3:#1d1d1f;
  --ok:#30d158; --ok-soft:#0f2e19; --warn:#ff9f0a; --warn-soft:#33240a; --bad:#ff453a; --bad-soft:#3a1414; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1d1d1f; --sunk:#2a2a2c; --pearl:#161617; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
  --accent:#2997ff; --accent-focus:#2997ff; --accent-ink:#ffffff; --accent-soft:#0b2a4a; --subnav:rgba(22,22,23,.8);
  --tile-dark:#1d1d1f; --tile-dark-2:#1d1d1f; --tile-dark-3:#1d1d1f;
  --ok:#30d158; --ok-soft:#0f2e19; --warn:#ff9f0a; --warn-soft:#33240a; --bad:#ff453a; --bad-soft:#3a1414; color-scheme:dark;
}
html,body{background:var(--bg)}
body{font-family:var(--f-body);font-size:17px;line-height:1.47;letter-spacing:-.374px;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{background:var(--gnav)}
:focus-visible{outline:2px solid var(--accent-focus);outline-offset:2px}

/* global nav: pure black, 44px */
header.top{position:relative;top:auto;background:var(--gnav);border:0;box-shadow:none;color:#f5f5f7}
header.top .bar{height:44px;padding-block:0;flex-wrap:nowrap;gap:12px}
.brand{gap:14px;min-width:0}
.brand .logo{height:24px;width:auto;flex:none;filter:none}
.live{font-family:var(--f-body);font-size:12px;letter-spacing:-.12px;color:#a1a1a6;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live i{width:6px;height:6px;background:#30d158;box-shadow:none;flex:none}
.who-hdr{font-family:var(--f-body);font-size:12px;letter-spacing:-.12px;color:#a1a1a6}
#hdrActs{gap:4px!important;flex:none}
.btn.gl{border:0;background:none;color:#e8e8ed;font-size:12px;letter-spacing:-.12px;padding:6px 10px;border-radius:999px}
.btn.gl:hover{color:#fff;background:rgba(255,255,255,.08)}

/* sub-nav: frosted parchment, 52px, sticky */
.subnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--subnav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.sbar{min-height:52px;display:flex;align-items:center;gap:8px 20px}
#bizName{font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:.231px;line-height:1.19;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:none;max-width:40%}
nav.tabs{flex:1;justify-content:flex-end;gap:2px;margin:0;align-self:stretch;align-items:center;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:400 12px/1 var(--f-body);letter-spacing:-.12px;color:var(--ink);opacity:.8;padding:8px 9px;border:0;border-radius:999px;text-shadow:none}
nav.tabs button:hover{opacity:1;color:var(--accent)}
nav.tabs button[aria-current="page"]{opacity:1;color:var(--ink);font-weight:600;background:color-mix(in srgb,var(--ink) 7%,transparent);border:0}
#hdrNovo{flex:none;font-size:12px;padding:6px 14px;letter-spacing:-.12px}
body.locked .subnav,body.locked #hdrActs{display:none}
body.launch nav.tabs{display:flex;visibility:hidden}

/* type */
h1,h2,h3{font-family:var(--f-display);font-stretch:normal;font-style:normal;text-transform:none;letter-spacing:-.28px}
h1{font-size:40px;font-weight:600;line-height:1.1}
h2{font-size:21px;font-weight:600;letter-spacing:.231px;line-height:1.19}
h3{font-size:17px;font-weight:600}
.sub{color:var(--muted);font-size:17px}
legend{font-family:var(--f-display);font-stretch:normal;font-weight:600;font-size:17px}

/* buttons: blue pill, ghost pill, press = scale(.95) */
.btn{border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:400 14px/1.29 var(--f-body);letter-spacing:-.224px;padding:8px 18px;box-shadow:none;transition:transform .12s,background-color .15s,color .15s}
.btn:hover{background:color-mix(in srgb,var(--accent) 8%,transparent);border-color:var(--accent);filter:none;transform:none}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:400;padding:11px 22px;box-shadow:none}
.btn.pri:hover{background:var(--accent-focus);border-color:var(--accent-focus);filter:none;transform:none}
.btn.pri:active{transform:scale(.95)}
.btn.sm{padding:5px 12px;font-size:12px;letter-spacing:-.12px;border-radius:999px}
.btn.pri.sm{padding:5px 14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 8%,transparent)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface);border-radius:8px}
.btn:disabled{opacity:.4}
.auth-card .btn.pri,.dlg>footer .btn.pri{padding:11px 22px;font-size:17px;letter-spacing:-.374px}
header.top .btn.pri{box-shadow:none}

/* surfaces: white, 18px radius, hairline, no shadow */
main{padding-block:40px 80px;gap:28px}
.panel,.kpi,.overview{border-radius:var(--r);border:1px solid var(--line);box-shadow:none;background:var(--surface)}
.panel{overflow:hidden}
.panel>header{padding:18px 22px;border-bottom:1px solid var(--line);background:none}
.panel>header h2{font-size:21px}
.kpi{padding:20px 22px;gap:4px;transition:transform .12s}
button.kpi:hover{border-color:var(--line);transform:none;background:var(--pearl)}
button.kpi:active{transform:scale(.97)}
.kpi span,.summary em,.overview em,.biz .stats em{font-size:12px;font-weight:400;text-transform:none;letter-spacing:-.12px;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-stretch:normal;font-weight:600;font-size:34px;letter-spacing:-.374px;line-height:1.12}
.kpi b.money{font-size:26px}
.kpi em{font-size:12px;letter-spacing:-.12px}
.item{padding:14px 22px}
.item .who b{font-weight:600}
.empty{padding:36px 22px;font-size:14px}
.toolbar{padding:14px 22px;gap:12px}
.summary{border-radius:12px;gap:1px}
.summary b{font-weight:600;letter-spacing:-.224px}
.overview b{font-family:var(--f-display);font-stretch:normal;font-weight:600;letter-spacing:-.28px}

/* tables */
table{font-size:14px;letter-spacing:-.224px}
th{background:none;font-size:12px;font-weight:600;text-transform:none;letter-spacing:-.12px;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px}
tbody tr:hover td{background:var(--pearl)}
tfoot td{background:var(--pearl)}
.pill{font-size:12px;font-weight:600;letter-spacing:-.12px;padding:3px 10px}
.tag,.mono{font-family:var(--f-mono);letter-spacing:0}

/* inputs: 44px, 12px radius; search is a pill */
input,select,textarea{border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;background:var(--surface);font-size:17px;letter-spacing:-.374px}
textarea{font-family:var(--f-body);font-size:15px;letter-spacing:-.224px;min-height:0}
input[type=checkbox],input[type=radio]{min-height:0;accent-color:var(--accent)}
input[type=color]{padding:4px;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-focus) 22%,transparent)}
input.search,.search input,input[type=search]{border-radius:999px;height:44px;padding-inline:18px;background:var(--surface)}
.chip{border-radius:999px;border-color:var(--line);font:400 12px var(--f-body);letter-spacing:-.12px;padding:6px 13px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
label.f{font-size:12px;font-weight:600;letter-spacing:-.12px;color:var(--muted);gap:6px}
label.f.check{font-size:14px;font-weight:400}
fieldset{border-radius:var(--r);padding:16px 18px;gap:14px}
.note{font-size:12px;letter-spacing:-.12px}
.calc,.readout,.ins div{border-radius:12px;background:var(--sunk)}
.hint{border-radius:12px}

/* dialogs: hairline sheet, no gradients */
dialog{border-radius:var(--r);border:1px solid var(--line);box-shadow:none}
dialog::backdrop{background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dlg>header{background:none;padding:20px 24px 16px}
.dlg>header::before{display:none}
.dlg>header h2{font-size:24px;letter-spacing:-.28px}
.dlg>.body{padding:20px 24px}
.dlg>footer{padding:14px 24px;background:var(--pearl)}
.toast{border-radius:999px;box-shadow:none;background:#1d1d1f;color:#f5f5f7;font-size:14px;letter-spacing:-.224px;padding:12px 20px}
.banner{border-radius:12px;font-size:14px}
.stamp-prev img{border-radius:12px}

/* ---- launcher: hero, businesses side by side, monthly summary ---- */
body.launch main{padding-top:0;gap:0;padding-bottom:0}
body.launch main>.banner{margin-top:20px;margin-bottom:4px}
.hero{margin-inline:calc(50% - 50vw);border-radius:0;box-shadow:none;background:var(--surface);color:var(--ink);padding:64px max(16px,calc(50vw - 540px)) 52px;text-align:center;overflow:visible;display:block;border-bottom:1px solid var(--line)}
.hero::before,.hero::after{display:none}
.hero .top{display:grid;justify-items:center}
.hero .eyebrow{margin:0 0 10px;font-size:14px;letter-spacing:-.224px;color:var(--muted)}
.hero h1{color:var(--ink);font-size:56px;line-height:1.07;letter-spacing:-.28px}
.hero .sub{color:var(--muted);font-size:21px;letter-spacing:.231px;line-height:1.38;margin-top:10px}
.bizsec{padding-block:40px 28px}
.biz-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:0}
.biz{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;min-width:0;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:34px 26px 28px;min-height:470px;position:relative;overflow:hidden;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .25s,background-color .25s}
.biz:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.biz:active{transform:translateY(-2px) scale(.985)}
.biz:focus-visible{outline:2px solid var(--accent-focus);outline-offset:3px}
.biz-iptv{background:var(--tile-dark);color:#f5f5f7;border-color:var(--tile-dark)}
.biz-iptv:hover{border-color:#2997ff}
.biz .ill{display:grid;place-items:center;width:100%;height:170px;border-radius:14px;background:var(--pearl);overflow:hidden}
.biz-iptv .ill{background:#1d1d1f}
.ill-svg{width:210px;height:158px;overflow:visible;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.biz:hover .ill-svg{transform:scale(1.07)}
.ill-svg *{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.bt{display:grid;gap:6px}
.bt b{font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1.1;letter-spacing:-.28px}
.bt .tl{font-size:17px;color:var(--muted);letter-spacing:-.374px}
.biz-iptv .bt .tl,.biz-iptv .feat{color:#a1a1a6}
.feat{display:grid;gap:8px;font-size:14px;letter-spacing:-.224px;color:var(--muted)}
.feat{justify-items:start}
.feat span{display:flex;align-items:center;justify-content:flex-start;gap:8px;text-align:left}
.feat span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.biz-iptv .feat span::before{background:#2997ff}
.biz .go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--accent);color:#fff;padding:11px 24px;font-size:17px;letter-spacing:-.374px;transition:background-color .2s,transform .2s,gap .25s}
.biz-iptv .go{background:#0071e3}
.biz .go::after{content:"›";font-size:21px;line-height:.8;transition:transform .25s}
.biz:hover .go{background:var(--accent-focus);gap:10px}
.biz:hover .go::after{transform:translateX(3px)}
/* illustration: services */
.i-paper{fill:var(--surface)!important;stroke:var(--ink);opacity:.9}
.i-clip{fill:var(--ink)!important;stroke:var(--ink)}
.i-line{stroke:var(--muted);opacity:.55}
.i-check{stroke:var(--accent);stroke-width:5!important;stroke-dasharray:40;stroke-dashoffset:40;animation:drawCheck 3.6s ease-in-out infinite}
.i-stamp{transform-box:fill-box;transform-origin:center;animation:stamp 3.6s cubic-bezier(.3,1.4,.5,1) infinite}
.i-stamp *{stroke:var(--accent)}
.i-stamp circle:first-child{fill:color-mix(in srgb,var(--accent) 10%,transparent)!important}
@keyframes drawCheck{0%,15%{stroke-dashoffset:40}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:40}}
@keyframes stamp{0%,40%{opacity:0;transform:scale(1.6) rotate(-25deg)}52%{opacity:1;transform:scale(.92) rotate(-12deg)}58%,88%{opacity:1;transform:scale(1) rotate(-12deg)}100%{opacity:0;transform:scale(1) rotate(-12deg)}}
/* illustration: IPTV */
.i-tv{stroke:#f5f5f7}
.i-screen{fill:rgba(41,151,255,.16)!important;stroke:none}
.i-play{fill:#2997ff!important;stroke:#2997ff;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
.i-stand{stroke:#a1a1a6}
.i-dot{fill:#2997ff!important;stroke:none}
.i-waves path{stroke:#2997ff;animation:wave 2.4s ease-in-out infinite}
.i-waves .w2{animation-delay:.25s}.i-waves .w3{animation-delay:.5s}
@keyframes wave{0%,100%{opacity:.15}40%{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
/* illustration: microcredit */
.i-coins *{stroke:var(--accent)}
.i-coins ellipse{fill:var(--surface)!important}
.i-coins g{animation:coin 3s cubic-bezier(.3,1.3,.5,1) infinite}
.i-coins .c2{animation-delay:.18s}.i-coins .c3{animation-delay:.36s}
@keyframes coin{0%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}50%{transform:translateY(0)}}
.i-bars rect{fill:color-mix(in srgb,var(--accent) 22%,transparent)!important;stroke:none;transform-box:fill-box;transform-origin:bottom;animation:grow 3s ease-in-out infinite}
.i-bars .b2{animation-delay:.15s}.i-bars .b3{animation-delay:.3s;fill:var(--accent)!important}
@keyframes grow{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.i-arrow{stroke:var(--accent);stroke-dasharray:110;stroke-dashoffset:110;animation:drawArrow 3s ease-in-out infinite}
@keyframes drawArrow{0%{stroke-dashoffset:110}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-110}}
/* monthly summary */
.ovsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;margin-bottom:56px;display:grid;gap:22px}
.ov-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px 20px;flex-wrap:wrap}
.ov-head h2{font-size:28px;letter-spacing:-.28px}
.ov-head .sub{font-size:14px;letter-spacing:-.224px;margin-top:4px}
.mes-pick{display:flex;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:4px}
.mes-pick select{border:0;background:var(--surface);border-radius:999px;min-height:36px;padding:6px 14px;font-size:14px;letter-spacing:-.224px;width:auto;min-width:170px;cursor:pointer}
.mp-b{border:0;background:none;width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;color:var(--accent);cursor:pointer;transition:background-color .2s,transform .15s}
.mp-b:hover:not(:disabled){background:var(--surface)}
.mp-b:active:not(:disabled){transform:scale(.9)}
.mp-b:disabled{color:var(--muted);opacity:.4;cursor:default}
.ov-grid{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:12px}
.ovc{background:var(--pearl);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:6px;align-content:start;min-width:0;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.ovc:hover{transform:translateY(-3px)}
.ovc em{font-style:normal;font-size:12px;letter-spacing:-.12px;color:var(--muted)}
.ovc em::first-letter{text-transform:uppercase}
.ovc b{font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:-.28px;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ovc small{display:grid;gap:1px;font-size:12px;letter-spacing:-.12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.ovc small strong{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.224px;font-variant-numeric:tabular-nums}
.ovc.main{background:var(--accent);border-color:var(--accent);color:#fff}
.ovc.main em,.ovc.main small{color:rgba(255,255,255,.78);border-color:rgba(255,255,255,.25)}
.ovc.main small strong{color:#fff}
.ovc.main b{font-size:32px}
.ov-bars{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:150px;padding-top:6px}
.ovb{all:unset;cursor:pointer;flex:1;min-width:0;max-width:72px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:6px;text-align:center}
.ovb i{display:block;height:var(--h);border-radius:8px 8px 4px 4px;background:color-mix(in srgb,var(--accent) 18%,transparent);transform-origin:bottom;transition:background-color .25s,transform .25s}
.ovb:hover i{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.ovb.on i{background:var(--accent)}
.ovb span{font-size:11px;letter-spacing:-.08px;color:var(--muted);text-transform:capitalize;white-space:nowrap;overflow:hidden}
.ovb.on span{color:var(--ink);font-weight:600}
.ovb:focus-visible i{outline:2px solid var(--accent-focus);outline-offset:2px}
.ov-now{display:flex;flex-wrap:wrap;gap:8px}
.ov-now span{background:var(--sunk);border-radius:999px;padding:7px 14px;font-size:12px;letter-spacing:-.12px;color:var(--muted)}
.ov-now b{color:var(--ink);font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.ov-now .bad b{color:var(--bad)}
@media (max-width:1068px){
  .biz-grid{gap:14px}.biz{padding:28px 18px 24px;min-height:440px}.bt b{font-size:28px}.ill-svg{width:180px;height:136px}
  .ov-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:833px){
  .biz-grid{grid-template-columns:minmax(0,1fr)}
  .biz{min-height:0;display:grid;grid-template-columns:150px minmax(0,1fr);grid-template-areas:"ill bt" "ill feat" "ill go";text-align:left;align-items:center;gap:8px 20px;padding:20px}
  .biz .ill{grid-area:ill;height:100%;min-height:150px}
  .ill-svg{width:140px;height:106px}
  .bt{grid-area:bt}.feat{grid-area:feat;justify-items:start}.feat span{justify-content:flex-start}
  .biz .go{grid-area:go;justify-self:start;margin-top:6px;padding:8px 18px;font-size:14px}
}
@media (max-width:734px){.hero{padding-block:48px 40px}.hero h1{font-size:40px;line-height:1.1}.hero .sub{font-size:19px}}
@media (max-width:560px){
  .biz{grid-template-columns:minmax(0,1fr);grid-template-areas:"ill" "bt" "feat" "go";text-align:center;padding:22px 18px}
  .biz .ill{min-height:140px}
  .biz .go{justify-self:center}
  .ovsec{padding:20px 16px}
  .ov-grid{grid-template-columns:minmax(0,1fr)}
  .mes-pick{width:100%}.mes-pick select{flex:1;min-width:0}
  .ov-bars{height:120px;gap:4px}.ovb span{font-size:10px}
}
@media (max-width:480px){.hero h1{font-size:34px}}
.foot{background:var(--sunk);color:var(--muted);font-size:12px;letter-spacing:-.12px;border-top:1px solid var(--line)}
.foot .wrap{padding-block:18px 22px;display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
body.launch .foot{border-top:0}

/* ---- login: dark tile + white form card ---- */
.auth{min-height:calc(100vh - 160px);padding-block:48px}
.auth{place-items:stretch}
.auth-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);overflow:hidden;width:100%;margin:auto;border-radius:var(--r);box-shadow:none;border:1px solid var(--line);background:var(--surface);max-width:980px}
.auth-side{position:relative;display:grid;align-content:space-between;gap:28px;min-height:420px;overflow:hidden;background:var(--tile-dark)!important;background-image:none!important;color:#f5f5f7;padding:48px 44px}
.auth-side::after{display:none}
.auth-side img{width:min(220px,80%);filter:none}
.auth-side p{color:#a1a1a6;font-size:21px;letter-spacing:.231px;line-height:1.38;max-width:26ch}
.auth-side .chip{background:none;border-color:rgba(255,255,255,.24);color:#f5f5f7}
.auth-card{padding:48px 44px;gap:20px;width:100%;border:0;border-radius:0;box-shadow:none;align-content:center}
@media (max-width:760px){.auth-wrap{grid-template-columns:minmax(0,1fr)}.auth-side{min-height:0}.auth-side img{width:180px}}
.auth-card h1{font-size:40px}
.auth-card .lock{font-size:12px;font-weight:400;letter-spacing:-.12px;text-transform:none;color:var(--muted)}
.auth-card .err{font-size:14px}

/* breakpoints 1068 / 833 / 734 / 640 / 480 */
@media (max-width:833px){
  .sbar{flex-wrap:wrap;padding-block:8px 0;gap:4px 12px}
  #bizName{flex:1;max-width:none}
  nav.tabs{order:3;flex:1 0 100%;justify-content:flex-start;margin-inline:-8px;padding-bottom:6px}
  body.launch nav.tabs{display:none}
  body.launch .sbar{padding-block:0}
  .auth-side,.auth-card{padding:32px 28px}
}
@media (max-width:734px){
  h1{font-size:32px}
}
@media (max-width:640px){
  header.top .bar{height:44px}
  .live{display:none}
  #hdrActs .btn.gl{padding:6px 8px}
  main{padding-block:24px 56px}
  body.launch main{padding-block:0}
  .panel>header,.toolbar{padding:14px 16px}
  .item{padding:12px 16px}
  .kpi{padding:14px 16px}
  .kpi b{font-size:28px}
  #view .tbl-wrap tbody tr,#view .tbl-wrap tfoot tr{padding:14px 16px}
  #view .tbl-wrap td[data-label]::before{text-transform:none;font-size:12px;letter-spacing:-.12px;font-weight:400}
  dialog,dialog.wide{border:0;border-radius:0}
  .dlg>header{padding:calc(16px + env(safe-area-inset-top,0px)) 16px 12px}
  .dlg>.body{padding:16px}
  .dlg>footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .auth{padding-block:16px}
  .auth-side{padding:28px 22px}
  .auth-side p{font-size:17px;letter-spacing:-.374px}
  .auth-card{padding:28px 22px}
  .auth-card h1{font-size:32px}
}
@media (max-width:480px){
  #bizName{font-size:19px}
}
/* ===== motion: entrances, transitions and feedback ===== */
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blurIn{from{opacity:0;filter:blur(14px);transform:scale(.97)}to{opacity:1;filter:none;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dlgIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,24px) scale(.95)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(48,209,88,.6)}70%{box-shadow:0 0 0 7px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}
@keyframes navIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
:root{--ease:cubic-bezier(.2,.8,.2,1)}
#view.enter>*{animation:up .65s var(--ease) both}
#view.enter>*:nth-child(2){animation-delay:.07s}#view.enter>*:nth-child(3){animation-delay:.14s}#view.enter>*:nth-child(4){animation-delay:.21s}
#view.enter>*:nth-child(5){animation-delay:.28s}#view.enter>*:nth-child(6){animation-delay:.35s}#view.enter>*:nth-child(n+7){animation-delay:.4s}
#view.enter .hero h1{animation:blurIn .9s var(--ease) .05s both}
#view.enter .hero .eyebrow,#view.enter .hero .sub{animation:up .7s var(--ease) .2s both}
#view.enter .biz-grid>*,#view.enter .kpis>*,#view.enter .ov-grid>*,#view.enter .overview>*{animation:up .6s var(--ease) both}
#view.enter .biz-grid>*:nth-child(1),#view.enter .kpis>*:nth-child(1),#view.enter .ov-grid>*:nth-child(1){animation-delay:.12s}
#view.enter .biz-grid>*:nth-child(2),#view.enter .kpis>*:nth-child(2),#view.enter .ov-grid>*:nth-child(2){animation-delay:.2s}
#view.enter .biz-grid>*:nth-child(3),#view.enter .kpis>*:nth-child(3),#view.enter .ov-grid>*:nth-child(3){animation-delay:.28s}
#view.enter .kpis>*:nth-child(4),#view.enter .ov-grid>*:nth-child(4){animation-delay:.36s}
#view.enter .kpis>*:nth-child(5){animation-delay:.44s}
#view.enter tbody tr,#view.enter .list>.item{animation:rowIn .45s var(--ease) both}
#view.enter tbody tr:nth-child(2),#view.enter .list>.item:nth-child(2){animation-delay:.04s}
#view.enter tbody tr:nth-child(3),#view.enter .list>.item:nth-child(3){animation-delay:.08s}
#view.enter tbody tr:nth-child(4),#view.enter .list>.item:nth-child(4){animation-delay:.12s}
#view.enter tbody tr:nth-child(5),#view.enter .list>.item:nth-child(5){animation-delay:.16s}
#view.enter tbody tr:nth-child(6),#view.enter .list>.item:nth-child(6){animation-delay:.2s}
#view.enter tbody tr:nth-child(n+7),#view.enter .list>.item:nth-child(n+7){animation-delay:.24s}
.ovb i{animation:barUp .7s var(--ease) both;animation-delay:var(--d,0ms)}
#view.enter .auth-side img{animation:blurIn .9s var(--ease) .1s both}
#view.enter .auth-card>*{animation:up .6s var(--ease) both}
#view.enter .auth-card>*:nth-child(2){animation-delay:.08s}#view.enter .auth-card>*:nth-child(3){animation-delay:.16s}
dialog[open]{animation:dlgIn .38s var(--ease)}
dialog[open]::backdrop{animation:fadeIn .3s ease}
dialog.opening .dlg>.body>*{animation:up .45s var(--ease) both}
dialog.opening .dlg>.body>*:nth-child(2){animation-delay:.04s}dialog.opening .dlg>.body>*:nth-child(3){animation-delay:.08s}dialog.opening .dlg>.body>*:nth-child(n+4){animation-delay:.12s}
.toast:not([hidden]){animation:toastIn .45s var(--ease)}
.live i{animation:livePulse 2s ease-out infinite}
nav.tabs button{transition:background-color .25s var(--ease),color .2s,opacity .2s,transform .15s}
nav.tabs button:active{transform:scale(.94)}
nav.tabs button{animation:navIn .4s var(--ease) both}
nav.tabs button:nth-child(2){animation-delay:.03s}nav.tabs button:nth-child(3){animation-delay:.06s}nav.tabs button:nth-child(4){animation-delay:.09s}nav.tabs button:nth-child(5){animation-delay:.12s}nav.tabs button:nth-child(n+6){animation-delay:.15s}
#bizName{transition:opacity .3s}
.panel,.kpi{transition:transform .35s var(--ease),border-color .25s,background-color .25s}
button.kpi:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.panel:hover{border-color:color-mix(in srgb,var(--ink) 18%,var(--line))}
tbody tr td,.item{transition:background-color .2s}
.item:hover{background:var(--pearl)}
.chip{transition:background-color .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.94)}
input,select,textarea{transition:border-color .2s,box-shadow .25s}
.pill{transition:transform .2s}
tr:hover .pill{transform:scale(1.04)}
.btn .lbl,.btn svg{transition:transform .2s}
.btn:hover svg{transform:translateX(1px)}
@media (max-width:640px){dialog[open]{animation:sheetIn .42s var(--ease)}}
/* ===== theme switch, notifications popup, extra effects ===== */
.hdr-r{display:flex;align-items:center;gap:2px;flex:none;flex-wrap:nowrap}
.btn.gl.ico-b{position:relative;width:34px;height:34px;padding:0;justify-content:center}
#btnTema svg{position:absolute;transition:transform .5s var(--ease),opacity .3s}
#btnTema .moon{opacity:0;transform:rotate(-90deg) scale(.4)}
#btnTema[data-t="dark"] .sun{opacity:0;transform:rotate(90deg) scale(.4)}
#btnTema[data-t="dark"] .moon{opacity:1;transform:none}
#btnTema.spin{animation:temaSpin .6s var(--ease)}
@keyframes temaSpin{0%{transform:scale(1)}40%{transform:scale(.8) rotate(-20deg)}100%{transform:scale(1)}}
.nf-badge{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:#ff3b30;color:#fff;font:600 10.5px/17px var(--f-body);letter-spacing:0;text-align:center;box-shadow:0 0 0 2px var(--gnav);animation:badgePop .5s var(--ease)}
@keyframes badgePop{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#btnNotif.ring svg{animation:ring 1s ease-in-out;transform-origin:50% 8%}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}
html.tema-anim *,html.tema-anim *::before,html.tema-anim *::after{transition:background-color .6s var(--ease),color .6s var(--ease),border-color .6s var(--ease),fill .6s,stroke .6s!important}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}

/* popup */
.notif{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));right:max(16px,calc(50vw - 574px));z-index:40;width:min(420px,calc(100vw - 32px));pointer-events:none}
.notif.in,.notif.out{pointer-events:auto}
.nf-card{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.06);overflow:hidden;transform-origin:calc(100% - 60px) 0;max-height:calc(100dvh - 80px);display:grid;grid-template-rows:auto minmax(0,1fr)}
.notif.in .nf-card{animation:nfIn .55s cubic-bezier(.18,1.25,.4,1) both}
.notif.out .nf-card{animation:nfOut .28s ease-in both}
@keyframes nfIn{from{opacity:0;transform:translateY(-14px) scale(.9);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes nfOut{to{opacity:0;transform:translateY(-10px) scale(.95)}}
.nf-hd{display:flex;align-items:center;gap:12px;padding:16px 16px 12px 18px;border-bottom:1px solid var(--line)}
.nf-hd>div{flex:1;min-width:0;display:grid}
.nf-hd b{font-size:19px;font-weight:600;letter-spacing:-.2px}
.nf-hd small{font-size:12px;color:var(--muted);letter-spacing:-.12px}
.nf-bell{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);flex:none}
.notif.in .nf-bell svg{animation:ring 1.1s ease-in-out .35s;transform-origin:50% 8%}
.nf-body{overflow:auto;padding:12px 12px 14px;display:grid;gap:10px;overscroll-behavior:contain}
.nf-sum{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.nf-sum span{font-size:12px;letter-spacing:-.12px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.nf-sum b{font-weight:600}
.nf-sum .s3{background:var(--bad-soft);color:var(--bad)}.nf-sum .s2{background:var(--warn-soft);color:var(--warn)}.nf-sum .s1{background:var(--accent-soft);color:var(--accent)}
.nf-list{display:grid;gap:6px}
.nf-it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .25s var(--ease),border-color .2s}
.nf-it::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nf-it.nv3::before{background:var(--bad)}.nf-it.nv2::before{background:var(--warn)}
.nf-it:hover{transform:translateX(3px);border-color:color-mix(in srgb,var(--ink) 18%,var(--line))}
.notif.in .nf-it{animation:nfItem .5s var(--ease) both;animation-delay:calc(.18s + var(--i,0) * 55ms)}
@keyframes nfItem{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.nf-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.nf-it.nv3 .nf-ic{background:var(--bad-soft);color:var(--bad)}.nf-it.nv2 .nf-ic{background:var(--warn-soft);color:var(--warn)}
.nf-it.nv3 .nf-ic{animation:nfPulse 2.2s ease-in-out infinite}
@keyframes nfPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 35%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 0%,transparent)}}
.nf-tx{display:grid;min-width:0}
.nf-tx b{font-size:14px;font-weight:600;letter-spacing:-.224px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nf-tx small{font-size:13px;color:var(--muted);letter-spacing:-.12px;line-height:1.3}
.nf-tx em{font-style:normal;font-size:11px;color:var(--muted);opacity:.8;margin-top:2px}
.nf-ok{display:grid;justify-items:center;text-align:center;gap:6px;padding:18px 12px 12px}
.nf-ok b{font-size:17px;font-weight:600}
.nf-ok small{font-size:13px;color:var(--muted);max-width:30ch}
.nf-ring{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:150;stroke-dashoffset:150;animation:drawRing .7s var(--ease) .2s forwards}
.nf-tick{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:drawTick .45s var(--ease) .75s forwards}
@keyframes drawRing{to{stroke-dashoffset:0}}@keyframes drawTick{to{stroke-dashoffset:0}}
@media (max-width:640px){
  .notif{top:auto;bottom:0;right:0;left:0;width:100%}
  .nf-card{border-radius:22px 22px 0 0;max-height:78dvh;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -12px 40px rgba(0,0,0,.25)}
  .notif.in .nf-card{animation:nfSheet .5s cubic-bezier(.2,1.1,.3,1) both}
  .notif.out .nf-card{animation:nfSheetOut .28s ease-in both}
  .nf-hd::before{content:"";position:absolute;left:50%;top:7px;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--line)}
  .nf-hd{position:relative;padding-top:20px}

};

/* ================= modo local (ficheiro descarregado) ================= */
/* Same calls as the online database, kept in this browser's storage. */
function criarLocalDB(){
  const KEY="heel_service_dados_v1";let mem=null;
  try{mem=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){mem=null}
  if(!mem||typeof mem!=="object"||!mem.cols)mem={cols:{}};
  const ouv=new Set();let pend=false;
  const gravar=()=>{try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){toast("O navegador não conseguiu guardar os dados. Faça uma cópia de segurança.")}};
  const avisar=()=>{if(pend)return;pend=true;setTimeout(()=>{pend=false;ouv.forEach(f=>{try{f()}catch(e){console.error(e)}})},0)};
  const clone=v=>JSON.parse(JSON.stringify(v));
  const snapDoc=(c,id)=>{const v=mem.cols[c]?.[id];return{id,exists:!!v,data:()=>v?clone(v):undefined}};
  const snapCol=c=>{const o=mem.cols[c]||{};return{docs:Object.keys(o).map(id=>({id,exists:true,data:()=>clone(o[id])}))}};
  const ref=(c,id)=>({id,
    get:async()=>snapDoc(c,id),
    set:async v=>{(mem.cols[c]=mem.cols[c]||{})[id]=clone(v);gravar();avisar()},
    delete:async()=>{if(mem.cols[c])delete mem.cols[c][id];gravar();avisar()},
    onSnapshot:cb=>{const f=()=>cb(snapDoc(c,id));ouv.add(f);setTimeout(f,0);return()=>ouv.delete(f)}});
  return{local:true,
    doc:p=>{const[c,id]=p.split("/");return ref(c,id)},
    collection:c=>({doc:id=>ref(c,id),onSnapshot:cb=>{const f=()=>cb(snapCol(c));ouv.add(f);setTimeout(f,0);return()=>ouv.delete(f)}})};
}
/* outside claude.ai a normal browser download works */
const dlLocal={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:/\.json$/.test(filename)?"application/json":/\.csv$/.test(filename)?"text/csv":"application/octet-stream"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return{status:"saved"}}};

/* ================= dialog ================= */

/* ================= images / stamp ================= */
const imgCache={};
function loadImg(src){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src})}
async function imgData(src){if(imgCache[src])return imgCache[src];const im=await loadImg(src);const cv=document.createElement("canvas");cv.width=im.naturalWidth;cv.height=im.naturalHeight;cv.getContext("2d").drawImage(im,0,0);return imgCache[src]=cv.toDataURL("image/png")}
async function carimboCanvas(cfg,numero,data){
  const Z=600,cv=document.createElement("canvas");cv.width=cv.height=Z;const x=cv.getContext("2d");
  x.translate(Z/2,Z/2);x.rotate(-0.16);
  if(cfg.carimboImg){try{const img=await loadImg(cfg.carimboImg);const r=Math.min(540/img.width,540/img.height);x.drawImage(img,-img.width*r/2,-img.height*r/2,img.width*r,img.height*r);return cv}catch(e){}}
  const col="#2D3A9A";x.strokeStyle=col;x.fillStyle=col;
  const ring=(r,w)=>{x.lineWidth=w;x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.stroke()};
  ring(278,12);ring(250,4);ring(150,4);
  const arcText=(txt,r,size,bottom)=>{x.font=`700 ${size}px Archivo, Arial, sans-serif`;x.textAlign="center";x.textBaseline="middle";
    const chars=[...txt],ws=chars.map(ch=>x.measureText(ch).width+size*0.12),total=ws.reduce((a,b)=>a+b,0)/r;
    let a=bottom?total/2:-total/2;
    chars.forEach((ch,i)=>{const w=ws[i]/r;x.save();if(bottom){x.rotate(a-w/2);x.fillText(ch,0,r)}else{x.rotate(a+w/2);x.fillText(ch,0,-r)}x.restore();a+=bottom?-w:w})};
  const nome=(cfg.nome||"").toUpperCase();
  arcText(nome,200,nome.length>18?32:40,false);
  arcText((cfg.nuit?"NUIT "+cfg.nuit:(cfg.morada||"MOÇAMBIQUE")).toUpperCase().slice(0,30),205,28,true);
  x.font="700 30px Archivo, Arial, sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("★",-200,0);x.fillText("★",200,0);

  for(let i=0;i<2600;i++){x.globalAlpha=Math.random()*.7;const s=Math.random()*3.2;x.fillRect(Math.random()*Z,Math.random()*Z,s,s)}
  x.globalAlpha=1;x.globalCompositeOperation="source-over";
  return cv;
}

function novoPDF(){if(!window.jspdf){toast("O gerador de PDF não carregou. Recarregue a página.");return null}return new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true})}

function pdfEmitente(pdf,cfg,y,pares){
  const L=[[cfg.nome,true],["Endereço: "+(cfg.morada||"—")],["Tel.: "+(cfg.telefone||"—")],["Email: "+(cfg.email||"—")],["NUIT: "+(cfg.nuit||"—")]];

/* cols: [{t,x,w,al}] — navy header and bordered rows, continues on a new page when needed; returns y after table */
function pdfTabela(pdf,y,cols,rows,minRows){
  const hh=RH*1.45,n=Math.max(minRows||0,rows.length),x0=cols[0].x,x1=cols[cols.length-1].x+cols[cols.length-1].w;
  const cab=yy=>{pdf.setFillColor(...NAVY);pdf.rect(x0,yy,x1-x0,hh,"F");pdf.setFont("helvetica","bold");pdf.setFontSize(8.2);pdf.setTextColor(255,255,255);
    cols.forEach(c=>pdf.text(c.t,c.x+c.w/2,yy+hh/2+1.2,{align:"center"}));pdf.setFont("helvetica","normal");pdf.setFontSize(8.5);pdf.setTextColor(...INK);return yy+hh};
  const grade=(ya,yb)=>{pdf.setDrawColor(...LINE);pdf.setLineWidth(0.2);[...cols.map(c=>c.x),x1].forEach(xx=>pdf.line(xx,ya,xx,yb))};
  let segTop=y,ry=cab(y);
  for(let i=0;i<n;i++){
    if(ry+RH>282){grade(segTop,ry);pdf.addPage();segTop=20;ry=cab(20)}
    const r=rows[i];
    /* wrapped columns (long service names) make the row taller, up to 3 lines */
    const cel=r?cols.map((c,j)=>{const v=r[j];if(v===""||v==null)return[];return c.wrap?pdf.splitTextToSize(String(v),c.w-3).slice(0,3):[fit(pdf,v,c.w-3)]}):[];
    const nl=Math.max(1,...cel.map(x=>x.length)),rh=nl>1?RH+(nl-1)*3.5:RH;
    if(ry+rh>282){grade(segTop,ry);pdf.addPage();segTop=20;ry=cab(20)}
    cel.forEach((ls,j)=>{const c=cols[j],al=c.al||"left",tx=al==="center"?c.x+c.w/2:al==="right"?c.x+c.w-1.5:c.x+1.5;
      if(c.shrink&&r[j]){const full=String(r[j]),fs=Math.max(6,Math.min(8.5,8.5*(c.w-2)/pdf.getTextWidth(full)));pdf.setFontSize(fs);pdf.text(full,tx,ry+3.3,{align:al});pdf.setFontSize(8.5);return}
      ls.forEach((t,k)=>pdf.text(t,tx,ry+3.3+k*3.5,{align:al}))});
    pdf.setDrawColor(...LINE);pdf.setLineWidth(0.2);pdf.line(x0,ry+rh,x1,ry+rh);ry+=rh}
  grade(segTop,ry);return ry;
}
function pdfTotais(pdf,y,linhas,grand){

  pdf.setTextColor(...INK);return gy+RH;

async function pdfRecibo(cfg,r){

const AVISOS=(()=>{
  const AUTO_PADRAO={ativo:true,recibos:true,email:true,sms:true,whatsapp:true,waLang:"pt_PT",waTplIptv:"heel_aviso_iptv",waTplLembrete:"heel_lembrete_pagamento",waTplAtraso:"heel_pagamento_atraso",waTplRecibo:"heel_recibo",iptv:true,iptvAntes:"7,3,1",iptvNoDia:true,iptvDepois:"1,3",mc:true,mcAntes:"3,1",mcNoDia:true,mcAtraso:"1,7,15"};
  const r2=v=>Math.round((Number(v)||0)*100)/100;
  const mt=v=>{const n=r2(v),[i,d]=Math.abs(n).toFixed(2).split(".");return(n<0?"-":"")+i.replace(/\B(?=(\d{3})+(?!\d))/g," ")+","+d+" MT"};
  const fmtD=s=>{if(!s)return"—";const[y,m,d]=String(s).slice(0,10).split("-");return d+"/"+m+"/"+y};
  const diasEntre=(de,ate)=>{const a=Date.UTC(...de.split("-").map((x,i)=>i===1?x-1:+x)),b=Date.UTC(...ate.split("-").map((x,i)=>i===1?x-1:+x));return Math.round((b-a)/864e5)};
  const limpo=t=>String(t).replace(/[—–]/g,"-").replace(/[·•]/g,"-").replace(/º/g,"o").replace(/ª/g,"a").replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'").replace(/…/g,"...").normalize("NFD").replace(/[̀-ͯ]/g,"");
  const waNum=t=>{let d=String(t||"").replace(/\D/g,"");if(d.length===9&&/^8/.test(d))d="258"+d;return d};
  const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||"").trim());
  const semPh=v=>/^\s*\(preencher/i.test(String(v||""))?"":String(v||"");
  const lista=s=>String(s||"").split(/[,;\s]+/).map(Number).filter(n=>Number.isFinite(n)&&n>0);
  function smsEndereco(tel,sc){const d=waNum(tel);if(!d||!sc||!/\{numero\}/.test(sc.modelo||"")||!/@/.test(sc.modelo||""))return"";const n=sc.formato==="+258"?"+"+d:sc.formato==="local"?d.replace(/^258/,""):d;return sc.modelo.replace("{numero}",n)}
  const assinatura=c=>`\n\nCumprimentos,\n${c.signatario?c.signatario+"\n":""}${c.nome||"Heel Service"}${c.telefone?"\nTel./WhatsApp: "+c.telefone:""}${c.email?"\n"+c.email:""}`;
  /* the most recent threshold already reached: marcos sorted from earliest (most days before) to latest (most days after) */
  function marcoAtual(n,antes,noDia,depois){
    const ms=[...antes.map(x=>x),...(noDia?[0]:[]),...depois.map(x=>-x)].sort((a,b)=>b-a);
    if(!ms.length)return null;const cand=ms.filter(m=>m>=n);if(!cand.length)return null;
    const m=Math.min(...cand);const ultimo=ms[ms.length-1];if(n<ultimo-7)return null;return m;
  }
  function situacaoEmp(e,hoje){
    const pago=(e.pagamentos||[]).reduce((a,p)=>a+(Number(p.valor)||0),0),multas=(e.multas||[]).reduce((a,m)=>a+(Number(m.valor)||0),0);
    let cum=0,atraso=0,primeira=null,proxima=null;
    (e.prestacoes||[]).forEach((p,i)=>{const ini=cum;cum=r2(cum+p.valor);const pg=Math.max(0,Math.min(p.valor,pago-ini)),falta=r2(p.valor-pg);
      if(falta>0.004){if(p.venc<hoje){atraso=r2(atraso+falta);if(!primeira)primeira={...p,n:i+1}}else if(!proxima)proxima={...p,n:i+1,falta}}});
    return{saldo:Math.max(0,r2((Number(e.total)||0)+multas-pago)),atraso,primeira,proxima};
  }
  /* d: {hoje, auto, iptvCfg, mcfg, sms, clientes, emprestimos, enviados:Set} → [{id,tipo,ref,nome,email:{para,assunto,texto}|null,sms:{numero,para,texto}|null,marco}] */
  function planear(d){
    const A={...AUTO_PADRAO,...(d.auto||{})},out=[];if(!A.ativo)return out;
    const smsOn=A.sms&&d.sms&&d.sms.ativo;
    const waOn=A.whatsapp&&d.wa;
    const add=(o,email,smsTxt,tel,wa)=>{if(d.enviados&&d.enviados.has(o.id))return;
      const em=A.email&&emailOk(email)?{para:String(email).trim(),assunto:o.assunto,texto:o.texto}:null;
      const end=smsOn?smsEndereco(tel,d.sms):"";const sm=end?{numero:"+"+waNum(tel),para:end,texto:limpo(smsTxt)}:null;
      const w=waOn&&wa&&waNum(tel).length>=11?{numero:waNum(tel),texto:wa.texto,modelo:wa.modelo,params:wa.params.map(x=>String(x??"").replace(/\s+/g," ").trim()||"—")}:null;
      if(!em&&!sm&&!w)return;out.push({id:o.id,tipo:o.tipo,ref:o.ref,nome:o.nome,marco:o.marco,email:em,sms:sm,wa:w})};
    if(A.iptv){const c=d.iptvCfg||{},pag=semPh(c.pagamento),N=c.nome||"Heel Service";
      (d.clientes||[]).forEach(cl=>{if(!cl.expira)return;const n=diasEntre(d.hoje,cl.expira),m=marcoAtual(n,lista(A.iptvAntes),A.iptvNoDia,lista(A.iptvDepois));if(m===null)return;
        const p=(c.planos||[]).find(x=>x.id===cl.planoId),nome=String(cl.nome||"").split(" ")[0];
        const quando=n<0?`expirou no dia ${fmtD(cl.expira)}`:n===0?"expira hoje":`expira dentro de ${n} dia${n>1?"s":""}, no dia ${fmtD(cl.expira)}`;
        add({id:`iptv_${cl.id}_${cl.expira}_${m}`,tipo:"iptv",ref:cl.id,nome:cl.nome,marco:m,
          assunto:n<0?"A sua subscrição IPTV expirou — renove já":n===0?"A sua subscrição IPTV expira hoje":"A sua subscrição IPTV está a terminar",
          texto:`Olá ${nome},\n\nInformamos que a sua subscrição IPTV (${p?.nome||"—"}) ${quando}.\n\nPara continuar a ver sem interrupções, renove${p?" com o pagamento de "+mt(p.preco):""}${pag?" para:\n"+pag:"."}\n\nDepois de pagar, responda a esta mensagem com o comprovativo e enviamos o recibo e a confirmação da renovação.${assinatura(c)}`},
          cl.email,`${N}: Ola ${nome}, a sua subscricao IPTV ${n<0?"expirou a "+fmtD(cl.expira):n===0?"expira hoje":"expira a "+fmtD(cl.expira)}.${p?" Renove com "+mt(p.preco):" Renove"}${pag?" via "+pag:""} e envie o comprovativo.`,cl.telefone,
          {modelo:"iptv",texto:`Olá ${nome}, a sua subscrição IPTV${p?" ("+p.nome+")":""} ${n<0?"expirou a "+fmtD(cl.expira):n===0?"expira hoje":"expira a "+fmtD(cl.expira)}. Para continuar a ver, renove${p?" com "+mt(p.preco):""}${pag?" via "+pag:""} e envie-nos o comprovativo. Obrigado! — ${N}`,
           params:[nome,n<0?"expirou a "+fmtD(cl.expira):n===0?"expira hoje":"expira a "+fmtD(cl.expira),p?mt(p.preco):"o valor do seu plano",pag||"os meios habituais"]})})}
    if(A.mc){const c=d.mcfg||{},pag=semPh(c.pagamento),N=c.nome||"Heel Service";
      (d.emprestimos||[]).forEach(e=>{if(e.estado==="anulado")return;const s=situacaoEmp(e,d.hoje);if(s.saldo<=0.004)return;const mu=e.mutuario||{},nome=String(mu.nome||"").split(" ")[0];
        if(s.primeira){const n=diasEntre(d.hoje,s.primeira.venc),m=marcoAtual(n,[],false,lista(A.mcAtraso));if(m===null)return;const da=-n;
          add({id:`mc_${e.id}_${s.primeira.venc}_${m}`,tipo:"mc",ref:e.id,nome:mu.nome,marco:m,assunto:`Pagamento em atraso — empréstimo ${e.numero}`,
            texto:`Olá ${nome},\n\nO seu empréstimo ${e.numero} tem ${mt(s.atraso)} em atraso desde ${fmtD(s.primeira.venc)} (${da} dia${da===1?"":"s"}).\n\nPedimos que regularize o pagamento o mais breve possível${pag?" para:\n"+pag:""}.\n\nSaldo total em dívida: ${mt(s.saldo)}.\nDepois de pagar, envie-nos o comprovativo para emitirmos o recibo.${assinatura(c)}`},
            mu.email,`${N}: Ola ${nome}, o emprestimo ${e.numero} tem ${mt(s.atraso)} em atraso desde ${fmtD(s.primeira.venc)}.${pag?" Regularize via "+pag+".":" Regularize o pagamento."} Saldo: ${mt(s.saldo)}.`,mu.telefone,
            {modelo:"atraso",texto:`Olá ${nome}, o empréstimo ${e.numero} tem ${mt(s.atraso)} em atraso desde ${fmtD(s.primeira.venc)}. Saldo em dívida: ${mt(s.saldo)}.${pag?" Regularize via "+pag+"":" Regularize o pagamento"} e envie-nos o comprovativo. — ${N}`,
             params:[nome,e.numero,mt(s.atraso),fmtD(s.primeira.venc),mt(s.saldo),pag||"os meios habituais"]});return}
        if(s.proxima){const n=diasEntre(d.hoje,s.proxima.venc),m=marcoAtual(n,lista(A.mcAntes),A.mcNoDia,[]);if(m===null)return;
          add({id:`mc_${e.id}_${s.proxima.venc}_${m}`,tipo:"mc",ref:e.id,nome:mu.nome,marco:m,assunto:n===0?`Hoje: pagamento do empréstimo ${e.numero}`:`Lembrete: pagamento a ${fmtD(s.proxima.venc)}`,
            texto:`Olá ${nome},\n\nLembramos que o pagamento n.º ${s.proxima.n} de ${(e.prestacoes||[]).length} do seu empréstimo ${e.numero}, no valor de ${mt(s.proxima.falta)}, vence ${n===0?"hoje":"a "+fmtD(s.proxima.venc)}.${pag?"\n\nPagamento para:\n"+pag:""}\n\nDepois de pagar, envie-nos o comprovativo para emitirmos o recibo.${assinatura(c)}`},
            mu.email,`${N}: Ola ${nome}, o pagamento de ${mt(s.proxima.falta)} do emprestimo ${e.numero} vence ${n===0?"hoje":"a "+fmtD(s.proxima.venc)}.${pag?" Pague via "+pag+".":""}`,mu.telefone,
            {modelo:"lembrete",texto:`Olá ${nome}, lembramos que o pagamento de ${mt(s.proxima.falta)} do empréstimo ${e.numero} vence ${n===0?"hoje":"a "+fmtD(s.proxima.venc)}. ${pag?"Pague via "+pag:"Pague"} e envie-nos o comprovativo. Obrigado! — ${N}`,
             params:[nome,mt(s.proxima.falta),e.numero,n===0?"hoje":"a "+fmtD(s.proxima.venc),pag||"os meios habituais"]})}})}
    return out;
  }
  return{AUTO_PADRAO,planear,diasEntre,smsEndereco,limpo,marcoAtual,waNum};
})();

const plano=id=>S.cfg.planos.find(p=>p.id===id);

function estado(c){
  if(!c.expira)return{k:"sem",t:"Sem validade",n:9999};
  const n=dias(c.expira);
  if(n<0)return{k:"bad",t:"Expirou há "+(-n)+" d",n};
  if(n===0)return{k:"warn",t:"Expira hoje",n};
  if(n<=Number(S.cfg.aviso||7))return{k:"warn",t:"Faltam "+n+" d",n};
  return{k:"ok",t:"Ativo · "+n+" d",n};
}

}

function estadoDoc(d){

const itemCot=i=>({qtd:Number(i.qtd)||0,preco:Number(i.preco)||0,desc:Number(i.dpct)||0});

async function pdfCotacao(d,cfg){
  const pdf=novoPDF();if(!pdf)return null;await precarregar();const c=cfg||K().cfg(),t=totaisCot(d);
  let y=await pdfTopo(pdf,"COTAÇÃO DE SERVIÇOS");
  try{const h=125,w=h*888/698;pdf.addImage(imgData_sync[ASSET.marca],"PNG",(X.B+X.END)/2-w/2,y+9*RH+6,w,h)}catch(e){}
  pdfEmitente(pdf,c,y+RH,[["Nº da cotação:",d.numero],["Data:",fmtD(d.data)],["Validade (dias):",String(d.validadeDias??15)],["Válida até:",fmtD(d.validade)]]);
  y=y+7*RH;pdfSecao(pdf,"CLIENTE",y);y+=RH;
  y=pdfCampos(pdf,y,[["Nome:",d.cliente?.nome],["Contacto:",[d.cliente?.telefone,d.cliente?.email].filter(Boolean).join("  ·  ")],["Morada / NUIT:",d.cliente?.morada||""]],X.D);
  y+=RH;
  const cols=[{t:"#",x:X.B,w:X.C-X.B,al:"center"},{t:"Serviço / Descrição",x:X.C,w:X.D-X.C,wrap:true},{t:"Qtd",x:X.D,w:X.E-X.D,al:"center"},{t:"Unidade",x:X.E,w:X.F-X.E,al:"center",shrink:true},{t:"Preço unit. (MT)",x:X.F,w:X.G-X.F,al:"right"},{t:"Desc. %",x:X.G,w:X.H-X.G,al:"center"},{t:"Total (MT)",x:X.H,w:X.END-X.H,al:"right"}];
  const rows=(d.itens||[]).map((it,i)=>{const k=itemCot(it);return[String(i+1),it.desc,String(k.qtd),it.un||"un",mt(k.preco),pct(k.desc),mt(linhaTot(k))]});
  const n=Math.max(15,rows.length);
  for(let i=rows.length;i<n;i++)rows.push([String(i+1),"","","","","",mt(0)]);
  y=pdfTabela(pdf,y,cols,rows,15);
  y=pdfTotais(pdf,y+RH,[["Subtotal",mt(t.sub)],["Desconto global (%)",pct(d.descGlobal)],["Desconto global (MT)",mt(t.dgMT)],["Base tributável",mt(t.base)],["IVA (%)",pct(d.iva)],["IVA (MT)",mt(t.ivaMT)]],["TOTAL A PAGAR",mt(t.total)]);
  y+=RH;
  if(y+15*RH>287){pdf.addPage();y=20}
  pdfSecao(pdf,"CONDIÇÕES / NOTAS",y);
  y=pdfLinhasTexto(pdf,y+RH,[d.condPagamento?"Pagamento: "+d.condPagamento:"",d.condBanco?"Dados bancários / M-Pesa / e-Mola: "+d.condBanco:"",d.condPrazo?"Prazo de execução: "+d.condPrazo:"",d.estado==="anulado"?"COTAÇÃO ANULADA":""]);
  pdfAssinatura(pdf,y+4*RH,c,d.data,{imagem:true});
  return pdfOut(pdf,d.numero+".pdf");
}

/* ================= MICROCRÉDITO (modelo Heel Services) ================= */
/* Juro simples mensal: pagamento mensal = valor ÷ meses + valor × taxa */
const mutuario=id=>S.mutuarios.find(m=>m.id===id);
const emprestimo=id=>S.emprestimos.find(e=>e.id===id);
const mesesDe=e=>Number(e.meses||e.n)||1;
const jurosMes=e=>e.jurosMes!=null?Number(e.jurosMes):r2(e.valor*(Number(e.taxa)||0)/100);
const pagaMes=e=>e.pagaMes!=null?Number(e.pagaMes):r2(e.valor/mesesDe(e)+jurosMes(e));
const MES_ABR=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const mesTxt=k=>{const[y,m]=k.split("-");return MES_ABR[+m-1]+" "+y};
const mesCurto=k=>{const[y,m]=k.split("-");return MES_ABR[+m-1]+(m==="01"?" "+y.slice(2):"")};
function simular(valor,taxa,meses,primeira){
  valor=r2(valor);const m=Math.max(1,Math.min(60,Math.floor(Number(meses)||1)));
  const jm=r2(valor*(Number(taxa)||0)/100),cap=Math.floor(valor/m*100)/100;
  const prestacoes=[];let acc=0;
  for(let i=0;i<m;i++){const c=i===m-1?r2(valor-acc):cap;acc=r2(acc+c);prestacoes.push({n:i+1,venc:addMeses(primeira,i),capital:c,juros:jm,valor:r2(c+jm)})}
  const juros=r2(jm*m);return{meses:m,jurosMes:jm,pagaMes:r2(valor/m+jm),juros,total:r2(valor+juros),prestacao:r2(cap+jm),prestacoes};
}
/* payments cover installments in order; fines add to the balance */
function situacao(e){
  const pago=soma(e.pagamentos,p=>p.valor),multas=soma(e.multas,m=>m.valor),saldo=r2(e.total+multas-pago),t=hoje();
  let cum=0,atrasoValor=0,primeiraAtraso=null,proxima=null,capitalPago=0;
  const linhas=(e.prestacoes||[]).map(p=>{const ini=cum;cum=r2(cum+p.valor);const pg=r2(Math.max(0,Math.min(p.valor,pago-ini))),falta=r2(p.valor-pg);
    const capP=p.capital!=null?p.capital:r2(p.valor*e.valor/e.total);capitalPago=r2(capitalPago+(p.valor?pg*capP/p.valor:0));
    const st=falta<=0.004?"paga":p.venc<t?"atraso":pg>0?"parcial":"pendente";
    if(st==="atraso"){atrasoValor=r2(atrasoValor+falta);if(!primeiraAtraso)primeiraAtraso=p}
    if(falta>0.004&&!proxima)proxima={...p,falta};return{...p,pago:pg,falta,st}});
  const k=e.estado==="anulado"?"anulado":saldo<=0.004?"liquidado":atrasoValor>0?"atraso":"ativo";
  const jurosRecebidos=r2(Math.min(pago,e.total)-capitalPago);
  return{pago,multas,saldo:Math.max(0,saldo),linhas,atrasoValor,diasAtraso:primeiraAtraso?-dias(primeiraAtraso.venc):0,primeiraAtraso,proxima,k,capitalPago,capitalDivida:r2(e.valor-capitalPago),jurosRecebidos};
}
function pillEmp(s){
  if(s.k==="anulado")return'<span class="pill sem">Anulado</span>';
  if(s.k==="liquidado")return'<span class="pill doc">Liquidado</span>';
  if(s.k==="atraso")return`<span class="pill bad">${s.diasAtraso} d em atraso</span>`;
  const n=s.proxima?dias(s.proxima.venc):null;
  if(n!==null&&n<=3)return`<span class="pill warn">${n===0?"Vence hoje":"Vence em "+n+" d"}</span>`;
  return'<span class="pill ok">Em dia</span>';
}
const ativo=e=>{const k=situacao(e).k;return k==="ativo"||k==="atraso"};
const carteira=()=>S.emprestimos.filter(ativo);
function proxNumMicro(tipo){
  const y=new Date().getFullYear();let max=0;
  if(tipo==="emp"){const re=new RegExp("^EMP-"+y+"-(\\d+)$");S.emprestimos.forEach(e=>{const m=re.exec(e.numero||"");if(m)max=Math.max(max,+m[1])});return"EMP-"+y+"-"+String(max+1).padStart(4,"0")}
  const re=new RegExp("^MC-"+y+"-(\\d+)$");S.emprestimos.forEach(e=>(e.pagamentos||[]).forEach(p=>{const m=re.exec(p.recibo||"");if(m)max=Math.max(max,+m[1])}));return"MC-"+y+"-"+String(max+1).padStart(4,"0");
}

/* ---------- números da carteira ---------- */
function resumo(){
  const l=carteira();let sA=0,sI=0,sP=0,gross=0,prof=0,saldo=0,atraso=0,nAtraso=0,capDiv=0,jurosRec=0;
  l.forEach(e=>{const s=situacao(e);sA=r2(sA+e.valor);sI=r2(sI+jurosMes(e));sP=r2(sP+pagaMes(e));gross=r2(gross+e.total);prof=r2(prof+e.juros);saldo=r2(saldo+s.saldo);capDiv=r2(capDiv+s.capitalDivida);jurosRec=r2(jurosRec+s.jurosRecebidos);if(s.k==="atraso"){nAtraso++;atraso=r2(atraso+s.atrasoValor)}});
  const mes=hoje().slice(0,7);let recebidoMes=0;S.emprestimos.forEach(e=>(e.pagamentos||[]).forEach(p=>{if((p.data||"").startsWith(mes))recebidoMes=r2(recebidoMes+p.valor)}));
  const capital=Number(S.mcfg.capital)||0;
  return{n:l.length,sA,sI,sP,gross,prof,roi:sA>0?prof/sA*100:0,saldo,atraso,nAtraso,recebidoMes,capDiv,jurosRec,capital,disponivel:r2(capital-capDiv),lista:l};
}
/* calendar months for the active portfolio */
function cronograma(){
  const l=carteira();if(!l.length)return[];
  const b={};const add=(k,f,v)=>{(b[k]=b[k]||{k,prev:0,cap:0,jur:0,rec:0})[f]=r2(b[k][f]+v)};
  let ini=null,fim=null;
  l.forEach(e=>{const s0=(e.inicio||hoje()).slice(0,7);if(!ini||s0<ini)ini=s0;
    (e.prestacoes||[]).forEach(p=>{const k=p.venc.slice(0,7);if(!fim||k>fim)fim=k;add(k,"prev",p.valor);const c=p.capital!=null?p.capital:r2(p.valor*e.valor/e.total);add(k,"cap",c);add(k,"jur",r2(p.valor-c))});
    (e.pagamentos||[]).forEach(p=>{const k=(p.data||hoje()).slice(0,7);if(!fim||k>fim)fim=k;add(k,"rec",p.valor)})});
  const out=[];let[y,m]=ini.split("-").map(Number);
  for(let i=0;i<120;i++){const k=y+"-"+pad(m);out.push(b[k]||{k,prev:0,cap:0,jur:0,rec:0});if(k>=fim)break;m++;if(m>12){m=1;y++}}
  const gross=soma(l,e=>e.total);let ap=0,aj=0,ar=0,ac=0;
  return out.map(r=>{ap=r2(ap+r.prev);aj=r2(aj+r.jur);ar=r2(ar+r.rec);ac=r2(ac+r.cap);return{...r,accPrev:ap,accJur:aj,accRec:ar,accCap:ac,falta:r2(gross-ap),gross}});
}

/* ---------- painel ---------- */
function alocTxt(){const r=resumo(),a=$("#mAlloc");if(!a)return;
  if(!r.capital){a.className="hint";a.textContent="Indique a quantia investida para ver quanto ainda tem para emprestar.";return}
  if(r.disponivel<-0.005){a.className="hint bad";a.textContent="Atenção: o capital em dívida passa a quantia investida em "+mt(-r.disponivel)+".";return}
  a.className="hint";a.textContent=r.disponivel>0.005?"Ainda por emprestar: "+mt(r.disponivel)+" · capital em dívida: "+mt(r.capDiv)+".":"Toda a quantia investida está emprestada."}
function kpis5(t,sub1){return`
    <div class="kpi"><span>Total emprestado</span><b class="money" style="color:var(--c-cap)">${mt(t.sA)}</b><em>${sub1}</em></div>
    <div class="kpi"><span>Receber por mês</span><b class="money">${mt(t.sP)}</b><em>soma de todos os clientes</em></div>
    <div class="kpi"><span>Seu lucro do mês</span><b class="money" style="color:var(--c-jur)">${mt(t.sI)}</b><em>juros mensais</em></div>
    <div class="kpi"><span>Total bruto a receber</span><b class="money" style="color:var(--c-rec)">${mt(t.gross)}</b><em>valor emprestado + juros</em></div>
    <div class="kpi"><span>Lucro total</span><b class="money" style="color:var(--c-rec)">${mt(t.prof)}</b><em>retorno de ${t.roi.toFixed(1).replace(".",",")}% sobre o emprestado</em></div>`}
function refMPainel(){
  const r=resumo();alocTxt();
  $("#mKpis").innerHTML=kpis5(r,r.n+" "+(r.n===1?"cliente":"clientes")+" ativos");
  desenharLinha();desenharDonut(r);desenharBarras(r);
  const crono=cronograma();let rec="";for(const c of crono){if(c.accPrev>=r.sA-0.005){rec=c.k;break}}
  const top=r.lista.reduce((a,e)=>!a||pagaMes(e)>pagaMes(a)?e:a,null);
  $("#mIns").innerHTML=[
    ["Recupera o valor emprestado em",rec?mesTxt(rec):"—"],
    ["Lucro médio por cliente",mt(r.n?r.prof/r.n:0)],
    ["Maior pagamento mensal",top?esc(top.mutuario?.nome)+"<br>"+mt(pagaMes(top)):"—"],
    ["Retorno sobre o emprestado",r.roi.toFixed(1).replace(".",",")+"%"],
    ["Taxa média ponderada",(r.sA>0?r.sI/r.sA*100:0).toFixed(1).replace(".",",")+"% ao mês"],
    ["Recebido este mês",mt(r.recebidoMes)],
    ["Juros já recebidos",mt(r.jurosRec)],
    ["Saldo por receber",mt(r.saldo)+(r.atraso?`<br><span style="color:var(--bad)">${mt(r.atraso)} em atraso</span>`:"")]
  ].map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join("");
  const lst=S.emprestimos.map(e=>({e,s:situacao(e)}));
  const at=lst.filter(x=>x.s.k==="atraso").sort((a,b)=>b.s.diasAtraso-a.s.diasAtraso);
  $("#mAtraso").innerHTML=!S.ready?'<div class="empty">A carregar…</div>':at.length?at.map(({e,s})=>`<div class="item"><div class="who"><b>${esc(e.mutuario?.nome)}</b><small><span class="pill bad">${s.diasAtraso} d</span> · ${mt(s.atrasoValor)} em atraso · <span class="mono">${esc(e.numero)}</span></small></div><div class="row" style="gap:6px"><button class="btn sm" data-act="lembrete" data-id="${e.id}">Cobrar</button><button class="btn sm pri" data-act="pagar" data-id="${e.id}">Pagamento</button></div></div>`).join(""):`<div class="empty">${S.emprestimos.length?"Nenhum empréstimo em atraso.":"Ainda não há empréstimos. Use “+ Novo empréstimo” ou o Simulador."}</div>`;
  const prox=[];lst.filter(x=>x.s.k==="ativo").forEach(({e,s})=>{s.linhas.filter(l=>l.falta>0.004&&l.st!=="atraso"&&dias(l.venc)<=7).forEach(l=>prox.push({e,l}))});
  prox.sort((a,b)=>a.l.venc.localeCompare(b.l.venc));
  $("#mVencer").innerHTML=prox.length?prox.map(({e,l})=>{const n=dias(l.venc);return`<div class="item"><div class="who"><b>${esc(e.mutuario?.nome)}</b><small>Mês ${l.n}/${mesesDe(e)} · ${mt(l.falta)} · ${n===0?"vence hoje":"vence "+fmtD(l.venc)}</small></div><div class="row" style="gap:6px"><button class="btn sm" data-act="lembrete" data-id="${e.id}">Lembrar</button><button class="btn sm" data-act="ver-emp" data-id="${e.id}">Abrir</button></div></div>`}).join(""):'<div class="empty">Nada a vencer nos próximos 7 dias.</div>';
}
const cmp=v=>v>=1e6?(v/1e6).toFixed(1).replace(".",",")+" M":v>=1e3?Math.round(v/1e3)+" mil":Math.round(v)+"";
/* line chart: k=0 is the start (nothing received), k=i is the end of month i */
function desenharLinha(){
  const svg=$("#mLine"),read=$("#mRead");if(!svg)return;
  const c=cronograma();
  if(!c.length){svg.innerHTML=`<text x="320" y="135" text-anchor="middle" style="fill:var(--muted);font-size:14px">Sem empréstimos ativos. O gráfico aparece quando registar o primeiro.</text>`;read.textContent="";return}
  const W=640,H=270,L=58,R=14,T=14,B=34,pw=W-L-R,ph=H-T-B,n=c.length,gross=c[0].gross,ymax=Math.max(gross,c[n-1].accRec)*1.08||1;
  const X=k=>L+k/n*pw,Y=v=>T+(1-v/ymax)*ph,curK=c.findIndex(r=>r.k===hoje().slice(0,7));
  let g="";
  for(let i=0;i<=4;i++){const v=ymax*i/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end" style="fill:var(--muted);font-size:11px">${cmp(v)}</text>`}
  const step=Math.ceil(n/8);for(let k=1;k<=n;k+=step)g+=`<text x="${X(k)}" y="${H-12}" text-anchor="middle" style="fill:var(--muted);font-size:11px">${mesCurto(c[k-1].k)}</text>`;
  const pts=(f,lim)=>[`${X(0)},${Y(0)}`,...c.slice(0,lim??n).map((r,i)=>X(i+1)+","+Y(f(r)))].join(" ");
  const recLim=curK>=0?curK+1:(c[n-1].k<hoje().slice(0,7)?n:0);
  g+=`<defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c-cap);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--c-cap);stop-opacity:0"/></linearGradient></defs>
    <line x1="${L}" x2="${W-R}" y1="${Y(gross)}" y2="${Y(gross)}" style="stroke:var(--c-bruto)" stroke-dasharray="5 4"/>
    <polygon points="${pts(r=>r.accPrev)} ${X(n)},${Y(0)}" fill="url(#gA)"/>
    <polyline points="${pts(r=>r.accPrev)}" fill="none" style="stroke:var(--c-cap)" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="${pts(r=>r.accJur)}" fill="none" style="stroke:var(--c-jur)" stroke-width="3" stroke-linejoin="round"/>
    ${recLim?`<polyline points="${pts(r=>r.accRec,recLim)}" fill="none" style="stroke:var(--c-rec)" stroke-width="3" stroke-linejoin="round"/>`:""}
    ${curK>=0?`<line x1="${X(curK+1)}" x2="${X(curK+1)}" y1="${T}" y2="${T+ph}" style="stroke:var(--c-rec);stroke-opacity:.6" stroke-dasharray="2 3"/><text x="${X(curK+1)}" y="${T+10}" text-anchor="middle" style="fill:var(--c-rec);font-size:10px;font-weight:600">hoje</text>`:""}
    <line id="xh" y1="${T}" y2="${T+ph}" style="stroke:var(--ink);stroke-opacity:.35;display:none"/>
    <circle id="c1" r="5" stroke-width="2" style="fill:var(--c-cap);stroke:var(--surface);display:none"/><circle id="c2" r="5" stroke-width="2" style="fill:var(--c-jur);stroke:var(--surface);display:none"/>
    <rect id="hit" x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent"/>`;
  svg.innerHTML=g;
  const xh=svg.querySelector("#xh"),c1=svg.querySelector("#c1"),c2=svg.querySelector("#c2");
  const show=k=>{k=Math.max(0,Math.min(n,k));const r=k?c[k-1]:{accPrev:0,accJur:0,accRec:0,falta:gross};
    xh.setAttribute("x1",X(k));xh.setAttribute("x2",X(k));xh.style.display="";
    c1.setAttribute("cx",X(k));c1.setAttribute("cy",Y(r.accPrev));c2.setAttribute("cx",X(k));c2.setAttribute("cy",Y(r.accJur));c1.style.display=c2.style.display="";
    read.innerHTML=k===0?"Início: ainda não recebeu nada.":`<b>${mesTxt(r.k)}:</b> previsto até aqui <b>${mt(r.accPrev)}</b> · recebido <b style="color:var(--c-rec)">${mt(r.accRec)}</b> · juros <b style="color:var(--c-jur)">${mt(r.accJur)}</b> · falta receber <b>${mt(r.falta)}</b>`};
  const move=e=>{const b=svg.getBoundingClientRect();if(!b.width)return;const x=(e.clientX-b.left)/b.width*W;show(Math.round((x-L)/pw*n))};
  const hit=svg.querySelector("#hit");hit.addEventListener("pointermove",move);hit.addEventListener("pointerdown",move);
  show(curK>=0?curK+1:n);
}
function desenharDonut(r){
  const el=$("#mDonut");if(!el)return;const C=2*Math.PI*70,p=r.gross>0?r.sA/r.gross:0;
  el.innerHTML=`<div class="donut"><svg viewBox="0 0 200 200" role="img" aria-label="Emprestado ${mt(r.sA)}, juros ${mt(r.prof)}"><g transform="rotate(-90 100 100)"><circle cx="100" cy="100" r="70" fill="none" style="stroke:var(--sunk)" stroke-width="26"/>
    ${r.gross>0?`<circle cx="100" cy="100" r="70" fill="none" style="stroke:var(--c-cap)" stroke-width="26" stroke-dasharray="${p*C} ${C}"/><circle cx="100" cy="100" r="70" fill="none" style="stroke:var(--c-jur)" stroke-width="26" stroke-dasharray="${(1-p)*C} ${C}" stroke-dashoffset="${-p*C}"/>`:""}</g></svg>
    <div class="mid"><small>Total bruto</small><b>${mt(r.gross)}</b></div></div>
    <div class="legend" style="justify-content:center"><span><i style="background:var(--c-cap)"></i>Emprestado <b>${mt(r.sA)}</b></span><span><i style="background:var(--c-jur)"></i>Juros <b>${mt(r.prof)}</b></span></div>`;
}
function desenharBarras(r){
  const el=$("#mBars");if(!el)return;
  if(!r.lista.length){el.innerHTML='<p class="note">Sem empréstimos ativos.</p>';return}
  const max=Math.max(...r.lista.map(pagaMes),1);
  el.innerHTML=[...r.lista].sort((a,b)=>pagaMes(b)-pagaMes(a)).map(e=>{const pr=r2(e.valor/mesesDe(e)),it=jurosMes(e);return`<div class="cb" title="${esc(e.mutuario?.nome)}: ${mt(pagaMes(e))}"><div class="nm">${esc(e.mutuario?.nome)}</div><div class="tr"><div style="width:${pr/max*100}%;background:var(--c-cap)"></div><div style="width:${it/max*100}%;background:var(--c-jur)"></div></div><div class="v">${mt(pagaMes(e))}</div></div>`}).join("")+
  `<div class="legend"><span><i style="background:var(--c-cap)"></i>Parcela do valor</span><span><i style="background:var(--c-jur)"></i>Juros</span></div>`;
}

/* ---------- clientes (empréstimos) ---------- */
function refEmp(){
  const q=S.mq.trim().toLowerCase();
  const l=S.emprestimos.map(e=>({e,s:situacao(e)})).filter(({e,s})=>{
    if(S.mfiltro==="ativos"&&!(s.k==="ativo"||s.k==="atraso"))return false;
    if(S.mfiltro==="atraso"&&s.k!=="atraso")return false;
    if(S.mfiltro==="liquidados"&&s.k!=="liquidado")return false;
    return!q||[e.numero,e.mutuario?.nome,e.mutuario?.telefone].some(v=>String(v||"").toLowerCase().includes(q))})
    .sort((a,b)=>(b.s.k==="atraso")-(a.s.k==="atraso")||String(a.s.proxima?.venc||"9").localeCompare(String(b.s.proxima?.venc||"9")));
  $("#mCount").textContent=S.emprestimos.length+" empréstimos registados · a mostrar "+l.length;
  document.querySelectorAll("#mChips .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mfiltro===S.mfiltro));
  $("#tbEmp").innerHTML=!S.ready?'<tr><td colspan="9" class="empty">A carregar…</td></tr>':l.length?l.map(({e,s})=>`<tr>
    <td class="cname"><b>${esc(e.mutuario?.nome)}</b><small><span class="mono">${esc(e.numero)}</span> · ${mesesDe(e)} ${mesesDe(e)===1?"mês":"meses"} desde ${fmtD(e.inicio)}</small></td>
    <td class="num">${mt(e.valor)}</td><td class="num">${pct(e.taxa)}</td><td class="num">${mt(jurosMes(e))}</td><td class="num">${mt(pagaMes(e))}</td><td class="num">${mt(e.total)}</td><td class="num"><b>${mt(s.saldo)}</b></td>
    <td>${pillEmp(s)}${s.proxima&&s.k!=="liquidado"?`<br><span class="tag">próx. ${fmtD(s.proxima.venc)}</span>`:""}</td>
    <td><div class="acts">${s.k==="ativo"||s.k==="atraso"?`<button class="btn sm pri" data-act="pagar" data-id="${e.id}">Pagamento</button><button class="btn sm" data-act="lembrete" data-id="${e.id}">Lembrete</button>`:""}<button class="btn sm" data-act="ver-emp" data-id="${e.id}">Abrir</button></div></td></tr>`).join("")
    :`<tr><td colspan="9" class="empty">${S.emprestimos.length?"Nenhum empréstimo neste filtro.":"Sem empréstimos. Clique em “+ Novo empréstimo” ou use o Simulador."}</td></tr>`;
  const vis=l.map(x=>x.e);
  $("#tfEmp").innerHTML=vis.length>1?`<tr><td><b>Total</b></td><td class="num"><b>${mt(soma(vis,e=>e.valor))}</b></td><td></td><td class="num"><b>${mt(soma(vis,jurosMes))}</b></td><td class="num"><b>${mt(soma(vis,pagaMes))}</b></td><td class="num"><b>${mt(soma(vis,e=>e.total))}</b></td><td class="num"><b>${mt(soma(l,x=>x.s.saldo))}</b></td><td></td><td></td></tr>`:"";
}
function refMes(){
  const c=cronograma(),cur=hoje().slice(0,7);
  $("#tbMes").innerHTML=c.length?c.map(r=>`<tr${r.k===cur?' style="background:var(--accent-soft)"':""}><td><b>${mesTxt(r.k)}</b>${r.k===cur?' <span class="pill doc">atual</span>':""}</td><td class="num">${mt(r.prev)}</td><td class="num">${mt(r.cap)}</td><td class="num">${mt(r.jur)}</td><td class="num" style="color:var(--c-rec)">${r.rec?mt(r.rec):"—"}</td><td class="num">${mt(r.accPrev)}</td><td class="num">${mt(r.falta)}</td></tr>`).join(""):'<tr><td colspan="7" class="empty">Sem empréstimos ativos.</td></tr>';
  $("#tfMes").innerHTML=c.length?`<tr><td><b>Total</b></td><td class="num"><b>${mt(soma(c,r=>r.prev))}</b></td><td class="num"><b>${mt(soma(c,r=>r.cap))}</b></td><td class="num"><b>${mt(soma(c,r=>r.jur))}</b></td><td class="num"><b>${mt(soma(c,r=>r.rec))}</b></td><td></td><td></td></tr>`:"";
}
async function csvMes(){
  const c=cronograma();if(!c.length){toast("Sem dados para exportar");return}
  const f=v=>(Number(v)||0).toFixed(2).replace(".",",");
  const rows=[["Mes","Pagamento previsto","Valor recuperado","Juros","Recebido de facto","Total previsto (acum.)","Falta receber"],...c.map(r=>[mesTxt(r.k),f(r.prev),f(r.cap),f(r.jur),f(r.rec),f(r.accPrev),f(r.falta)])];
  const data="﻿"+rows.map(x=>x.join(";")).join("\n");
  if(!dl){toast("A descarga de ficheiros não está disponível nesta vista.");return}
  try{await dl.save({filename:"cronograma-heel-services.csv",data});toast("CSV guardado")}catch(e){if(e&&e.code!=="declined")toast("Não foi possível guardar o CSV.")}
}

function simHTML(){

  const s=S.sim;return`

    </div>

    <p class="hint" id="sAlloc"></p>
  </section>
  <section class="kpis five" id="sKpis"></section>
  <section class="panel"><header><div><h2>Clientes da simulação</h2><p class="sub">Edite o nome, o valor e a taxa de cada cliente. Pode escrever o nome de um mutuário já registado.</p></div><div class="row" style="gap:6px"><button class="btn sm" data-act="sim-add">+ Adicionar cliente</button><button class="btn sm" data-act="sim-dividir">Dividir igualmente</button></div></header>
    <div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Valor (MT)</th><th>Taxa (%/mês)</th><th class="num">Juros/mês</th><th class="num">Paga por mês</th><th class="num">Total a receber</th><th></th></tr></thead><tbody id="sRows"></tbody><tfoot id="sFoot"></tfoot></table></div>

  </section>
