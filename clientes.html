<script>(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoje=()=>iso(new Date());
const parse=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const dias=s=>Math.round((parse(s)-parse(hoje()))/864e5);
function addMeses(s,n){const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+Number(n));const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)}
function addDias(s,n){const d=parse(s);d.setDate(d.getDate()+Number(n));return iso(d)}
const fmtD=s=>{if(!s)return"—";const[y,m,d]=String(s).split("-");return d+"/"+m+"/"+y};
const r2=v=>Math.round((Number(v)||0)*100)/100;
function mt(v){v=Number(v)||0;const neg=v<-0.004;v=Math.abs(v);const[i,dec]=v.toFixed(2).split(".");return(neg?"-":"")+i.replace(/\B(?=(\d{3})+(?!\d))/g," ")+","+dec+" MT"}
const pct=v=>(Number(v)||0).toLocaleString("pt-PT",{maximumFractionDigits:2})+"%";
const soma=(a,f)=>r2((a||[]).reduce((s,x)=>s+(Number(f(x))||0),0));
const novoId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function gerar(n,set){const a=new Uint32Array(n);crypto.getRandomValues(a);return Array.from(a,x=>set[x%set.length]).join("")}
const genUser=nome=>(String(nome||"cliente").normalize("NFD").replace(/[^a-zA-Z]/g,"").toLowerCase().slice(0,8)||"cliente")+gerar(4,"0123456789");
const genPass=()=>gerar(10,"abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789");
function waNum(t){let d=String(t||"").replace(/\D/g,"");if(d.length===9&&/^8/.test(d))d="258"+d;return d}
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||"").trim());
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
async function copiar(txt){try{await navigator.clipboard.writeText(txt);toast("Copiado")}catch(e){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copiado")}catch(_){toast("Selecione o texto e copie manualmente")}ta.remove()}}

/* outside claude.ai a normal browser download works */

  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return{status:"saved"}}};

/* ================= images / stamp ================= */
const imgCache={};
function loadImg(src){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src})}
async function imgData(src){if(imgCache[src])return imgCache[src];const im=await loadImg(src);const cv=document.createElement("canvas");cv.width=im.naturalWidth;cv.height=im.naturalHeight;cv.getContext("2d").drawImage(im,0,0);return imgCache[src]=cv.toDataURL("image/png")}
async function carimboCanvas(cfg,numero,data){
  const Z=600,cv=document.createElement("canvas");cv.width=cv.height=Z;const x=cv.getContext("2d");
  x.translate(Z/2,Z/2);x.rotate(-0.16);
  if(cfg.carimboImg){try{const img=await loadImg(cfg.carimboImg);const r=Math.min(540/img.width,540/img.height);x.drawImage(img,-img.width*r/2,-img.height*r/2,img.width*r,img.height*r);return cv}catch(e){}}
  const col="#2D3A9A";x.strokeStyle=col;x.fillStyle=col;
  const ring=(r,w)=>{x.lineWidth=w;x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.stroke()};
  ring(278,12);ring(250,4);ring(150,4);
  const arcText=(txt,r,size,bottom)=>{x.font=`700 ${size}px Archivo, Arial, sans-serif`;x.textAlign="center";x.textBaseline="middle";
    const chars=[...txt],ws=chars.map(ch=>x.measureText(ch).width+size*0.12),total=ws.reduce((a,b)=>a+b,0)/r;
    let a=bottom?total/2:-total/2;
    chars.forEach((ch,i)=>{const w=ws[i]/r;x.save();if(bottom){x.rotate(a-w/2);x.fillText(ch,0,r)}else{x.rotate(a+w/2);x.fillText(ch,0,-r)}x.restore();a+=bottom?-w:w})};
  const nome=(cfg.nome||"").toUpperCase();
  arcText(nome,200,nome.length>18?32:40,false);
  arcText((cfg.nuit?"NUIT "+cfg.nuit:(cfg.morada||"MOÇAMBIQUE")).toUpperCase().slice(0,30),205,28,true);
  x.font="700 30px Archivo, Arial, sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("★",-200,0);x.fillText("★",200,0);
  x.font="800 92px Archivo, Arial, sans-serif";x.fillText("PAGO",0,-14);
  x.font="600 34px 'IBM Plex Mono', monospace";x.fillText(fmtD(data||hoje()),0,58);
  x.font="500 22px 'IBM Plex Mono', monospace";x.fillText(numero||"",0,98);
  x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation="destination-out";
  for(let i=0;i<2600;i++){x.globalAlpha=Math.random()*.7;const s=Math.random()*3.2;x.fillRect(Math.random()*Z,Math.random()*Z,s,s)}
  x.globalAlpha=1;x.globalCompositeOperation="source-over";
  return cv;
}

/* ================= PDF: Heel Service layout ================= */
/* columns follow the template's A..H widths scaled to a 180 mm print width */
const X={A:15,B:18.3,C:26.6,D:92.7,E:105.9,F:124.1,G:152.2,H:167.1,END:195};
const RH=4.55;
const NAVY=[31,41,55],RED=[185,28,28],INK=[17,24,39],GREY=[107,114,128],LINE=[209,213,219];
function novoPDF(){if(!window.jspdf){toast("O gerador de PDF não carregou. Recarregue a página.");return null}return new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true})}
const fit=(pdf,t,w)=>pdf.splitTextToSize(String(t??""),Math.max(2,w))[0]||"";
async function pdfTopo(pdf,titulo){
  pdf.setFillColor(...NAVY);pdf.rect(X.A,10,X.END-X.A,21.8,"F");
  try{pdf.addImage(await imgData(ASSET.logoBranco),"PNG",X.END-5-42,12.9,42,16)}catch(e){}
  pdf.setFillColor(...RED);pdf.rect(X.A,31.8,X.END-X.A,6.6,"F");
  pdf.setFont("helvetica","bold");pdf.setFontSize(10);pdf.setTextColor(255,255,255);pdf.text(titulo,X.B,36.3);
  return 38.4;
}
function pdfEmitente(pdf,cfg,y,pares){
  const L=[[cfg.nome,true],["Endereço: "+(cfg.morada||"—")],["Tel.: "+(cfg.telefone||"—")],["Email: "+(cfg.email||"—")],["NUIT: "+(cfg.nuit||"—")]];
  pdf.setFontSize(8.5);pdf.setTextColor(...INK);
  L.forEach(([t,b],i)=>{pdf.setFont("helvetica",b?"bold":"normal");pdf.text(fit(pdf,t,X.E-X.B-3),X.B,y+i*RH+3.3)});
  pares.forEach(([l,v],i)=>{pdf.setFont("helvetica","bold");pdf.text(l,X.G-1.5,y+i*RH+3.3,{align:"right"});pdf.setFont("helvetica","normal");pdf.text(String(v),X.END-1.5,y+i*RH+3.3,{align:"right"})});
}
function pdfSecao(pdf,t,y){pdf.setFont("helvetica","bold");pdf.setFontSize(8.5);pdf.setTextColor(...RED);pdf.text(t,X.B,y+3.3);pdf.setTextColor(...INK)}
function pdfCampos(pdf,y,pares,xv){pdf.setFontSize(8.5);pdf.setTextColor(...INK);pares.forEach(([l,v],i)=>{pdf.setFont("helvetica","bold");pdf.text(l,X.B,y+i*RH+3.3);pdf.setFont("helvetica","normal");pdf.text(fit(pdf,v||"",X.END-xv-2),xv,y+i*RH+3.3)});return y+pares.length*RH}
/* cols: [{t,x,w,al}] — navy header and bordered rows, continues on a new page when needed; returns y after table */
function pdfTabela(pdf,y,cols,rows,minRows){
  const hh=RH*1.45,n=Math.max(minRows||0,rows.length),x0=cols[0].x,x1=cols[cols.length-1].x+cols[cols.length-1].w;
  const cab=yy=>{pdf.setFillColor(...NAVY);pdf.rect(x0,yy,x1-x0,hh,"F");pdf.setFont("helvetica","bold");pdf.setFontSize(8.2);pdf.setTextColor(255,255,255);
    cols.forEach(c=>pdf.text(c.t,c.x+c.w/2,yy+hh/2+1.2,{align:"center"}));pdf.setFont("helvetica","normal");pdf.setFontSize(8.5);pdf.setTextColor(...INK);return yy+hh};
  const grade=(ya,yb)=>{pdf.setDrawColor(...LINE);pdf.setLineWidth(0.2);[...cols.map(c=>c.x),x1].forEach(xx=>pdf.line(xx,ya,xx,yb))};
  let segTop=y,ry=cab(y);
  for(let i=0;i<n;i++){
    if(ry+RH>282){grade(segTop,ry);pdf.addPage();segTop=20;ry=cab(20)}
    const r=rows[i];
    /* wrapped columns (long service names) make the row taller, up to 3 lines */
    const cel=r?cols.map((c,j)=>{const v=r[j];if(v===""||v==null)return[];return c.wrap?pdf.splitTextToSize(String(v),c.w-3).slice(0,3):[fit(pdf,v,c.w-3)]}):[];
    const nl=Math.max(1,...cel.map(x=>x.length)),rh=nl>1?RH+(nl-1)*3.5:RH;
    if(ry+rh>282){grade(segTop,ry);pdf.addPage();segTop=20;ry=cab(20)}
    cel.forEach((ls,j)=>{const c=cols[j],al=c.al||"left",tx=al==="center"?c.x+c.w/2:al==="right"?c.x+c.w-1.5:c.x+1.5;
      if(c.shrink&&r[j]){const full=String(r[j]),fs=Math.max(6,Math.min(8.5,8.5*(c.w-2)/pdf.getTextWidth(full)));pdf.setFontSize(fs);pdf.text(full,tx,ry+3.3,{align:al});pdf.setFontSize(8.5);return}
      ls.forEach((t,k)=>pdf.text(t,tx,ry+3.3+k*3.5,{align:al}))});
    pdf.setDrawColor(...LINE);pdf.setLineWidth(0.2);pdf.line(x0,ry+rh,x1,ry+rh);ry+=rh}
  grade(segTop,ry);return ry;
}
function pdfTotais(pdf,y,linhas,grand){
  pdf.setDrawColor(...LINE);pdf.setLineWidth(0.2);pdf.setFontSize(8.5);
  linhas.forEach(([l,v],i)=>{const ry=y+i*RH;pdf.setTextColor(...INK);pdf.setFont("helvetica","bold");pdf.text(l,X.H-1.5,ry+3.3,{align:"right"});pdf.setFont("helvetica","normal");pdf.rect(X.H,ry,X.END-X.H,RH);pdf.text(v,X.END-1.5,ry+3.3,{align:"right"})});
  const gy=y+linhas.length*RH;pdf.setFillColor(...RED);pdf.rect(X.F,gy,X.END-X.F,RH,"F");
  pdf.setFont("helvetica","bold");pdf.setTextColor(255,255,255);pdf.text(grand[0],X.H-1.5,gy+3.3,{align:"right"});pdf.text(grand[1],X.END-1.5,gy+3.3,{align:"right"});
  pdf.setTextColor(...INK);return gy+RH;
}
function pdfLinhasTexto(pdf,y,linhas){pdf.setFont("helvetica","normal");pdf.setFontSize(8.5);pdf.setTextColor(...INK);let yy=y;linhas.filter(Boolean).forEach(l=>{pdf.splitTextToSize(String(l),X.END-X.B-2).forEach(t=>{pdf.text(t,X.B,yy+3.3);yy+=RH})});return yy}
function pdfAssinatura(pdf,y,cfg,data,{imagem=false,carimbo=null}={}){
  if(imagem){try{pdf.addImage(imgData_sync[ASSET.logoCinza],"PNG",X.B+2,y-1,30,11.4)}catch(e){}try{pdf.addImage(imgData_sync[ASSET.assinatura],"PNG",X.B+6,y+3.2,36,6.7)}catch(e){}}
  const ly=y+3*RH;pdf.setDrawColor(...INK);pdf.setLineWidth(0.3);pdf.line(X.B,ly,X.D,ly);
  pdf.setFont("helvetica","bold");pdf.setFontSize(8.5);pdf.setTextColor(...INK);pdf.text(cfg.signatario||cfg.nome||"",X.B,ly+RH+3.3-1.5);
  pdf.setFont("helvetica","normal");pdf.setFontSize(8);pdf.text(cfg.nome||"",X.B,ly+2*RH+3.3-1.5);pdf.text((cfg.cidade||"Maputo")+", "+fmtD(data),X.B,ly+3*RH+3.3-1.5);
  if(carimbo)pdf.addImage(carimbo,"PNG",X.F+6,y-8,40,40);
  return ly+4*RH;
}
const imgData_sync={};
async function precarregar(){for(const k of[ASSET.logoCinza,ASSET.assinatura,ASSET.marca,ASSET.logoBranco]){try{imgData_sync[k]=await imgData(k)}catch(e){}}}
function pdfRodape(pdf,t){if(!t)return;pdf.setFont("helvetica","normal");pdf.setFontSize(7.5);pdf.setTextColor(...GREY);pdf.text(t,105,289,{align:"center"})}
const pdfOut=(pdf,nome)=>({blob:pdf.output("blob"),nome});

/* generic receipt in the Heel layout */
async function pdfRecibo(cfg,r){
  const pdf=novoPDF();if(!pdf)return null;await precarregar();
  let y=await pdfTopo(pdf,"RECIBO");
  pdfEmitente(pdf,cfg,y+RH,[["Nº do recibo:",r.numero],["Data:",fmtD(r.data)],r.ref?["Referência:",r.ref]:["",""],r.metodo?["Método:",r.metodo]:["",""]]);
  y=y+7*RH;pdfSecao(pdf,"RECEBEMOS DE",y);y+=RH;
  y=pdfCampos(pdf,y,[["Nome:",r.cliente.nome],["Contacto:",[r.cliente.telefone,r.cliente.email].filter(Boolean).join("  ·  ")],["Morada / NUIT:",r.cliente.morada||""]],X.D);
  y+=RH;
  const cols=[{t:"#",x:X.B,w:X.C-X.B,al:"center"},{t:"Descrição",x:X.C,w:X.E-X.C,wrap:true},{t:"Qtd",x:X.E,w:X.F-X.E,al:"center"},{t:"Preço unit. (MT)",x:X.F,w:X.H-X.F,al:"right"},{t:"Total (MT)",x:X.H,w:X.END-X.H,al:"right"}];
  y=pdfTabela(pdf,y,cols,r.itens.map((it,i)=>[String(i+1),it.desc,String(it.qtd),mt(it.preco),mt(it.qtd*it.preco)]),4);
  y=pdfTotais(pdf,y+RH,[],[r.anulado?"ANULADO":"TOTAL PAGO",mt(r.total)]);
  y+=RH;if(r.info&&r.info.length){pdfSecao(pdf,"NOTAS",y);y=pdfLinhasTexto(pdf,y+RH,r.info)}
  const stamp=r.carimbo&&!r.anulado?(await carimboCanvas(cfg,r.numero,r.data)).toDataURL("image/png"):null;
  pdfAssinatura(pdf,Math.max(y+4*RH,200),cfg,r.data,{carimbo:stamp});
  pdfRodape(pdf,cfg.rodape);
  return pdfOut(pdf,r.numero+(stamp?"-carimbado":"")+".pdf");
}
async function guardarPDF(gerarFn){
  const r=await gerarFn();if(!r)return;
  if(!dl){toast("A descarga de ficheiros não está disponível nesta vista.");return}
  try{await dl.save({filename:r.nome,data:r.blob});toast("PDF guardado")}catch(e){if(e&&e.code!=="declined")toast("Não foi possível guardar o PDF.")}
}

/* ================= cotação de um pedido online (igual no portal do cliente e no sistema) ================= */
/* p: a row of the "pedidos" table; emp: the company identity (nome, morada, telefone, email, nuit, cidade, signatario) */
const PED_TIPO={serv:"Serviços",iptv:"IPTV",micro:"Microcrédito"};
const PED_ESTADO={pendente:"Pendente de confirmação",aceite:"Aceite",recusado:"Não aceite",cancelado:"Cancelado pelo cliente"};
async function pdfPedido(p,emp){
  const pdf=novoPDF();if(!pdf)return null;await precarregar();
  const e={nome:"Heel Service",...(emp||{})},data=String(p.criado_em||hoje()).slice(0,10),micro=p.tipo==="micro";
  let y=await pdfTopo(pdf,micro?"PEDIDO DE EMPRÉSTIMO · SIMULAÇÃO":"COTAÇÃO "+(p.tipo==="iptv"?"IPTV":"DE SERVIÇOS"));
  try{const h=125,w=h*888/698;pdf.addImage(imgData_sync[ASSET.marca],"PNG",(X.B+X.END)/2-w/2,y+9*RH+6,w,h)}catch(_){}
  pdfEmitente(pdf,e,y+RH,[["Nº do pedido:",p.numero||"—"],["Data:",fmtD(data)],["Válido até:",fmtD(p.validade)],["Estado:",PED_ESTADO[p.estado]||p.estado]]);
  y=y+7*RH;pdfSecao(pdf,micro?"REQUERENTE":"CLIENTE",y);y+=RH;
  const c=p.cliente||{};
  const campos=[["Nome:",c.nome],["Contacto:",[c.telefone,c.email].filter(Boolean).join("  ·  ")],["Morada:",c.morada||""]];
  if(c.bi||c.nuit)campos.push(["BI / NUIT:",[c.bi,c.nuit].filter(Boolean).join("  ·  ")]);
  if(micro){if(c.ocupacao)campos.push(["Ocupação:",c.ocupacao]);if(c.fiadorNome)campos.push(["Fiador:",[c.fiadorNome,c.fiadorTel].filter(Boolean).join("  ·  ")])}
  y=pdfCampos(pdf,y,campos,X.D);y+=RH;
  if(micro){
    const d=p.detalhes||{},prim=addMeses(data,1);
    y=pdfCampos(pdf,y,[["Valor pedido:",mt(d.valor)],["Prazo:",d.meses+(d.meses===1?" mês":" meses")],["Juros:",pct(d.taxa)+" ao mês ("+mt(d.jurosMes)+" por mês)"],["Pagamento mensal:",mt(d.pagaMes)],["Finalidade:",d.finalidade||"—"]],X.D);
    y+=RH;
    const cols=[{t:"Prestação",x:X.B,w:X.D-X.B,al:"center"},{t:"Vencimento (previsto)",x:X.D,w:X.F-X.D,al:"center"},{t:"Capital (MT)",x:X.F,w:X.G-X.F,al:"right"},{t:"Juros (MT)",x:X.G,w:X.H-X.G,al:"right"},{t:"Valor (MT)",x:X.H,w:X.END-X.H,al:"right"}];
    const cap=Math.floor(d.valor/d.meses*100)/100;let acc=0;const rows=[];
    for(let i=0;i<d.meses;i++){const ci=i===d.meses-1?r2(d.valor-acc):cap;acc=r2(acc+ci);rows.push([String(i+1),fmtD(addMeses(prim,i)),mt(ci),mt(d.jurosMes),mt(ci+d.jurosMes)])}
    y=pdfTabela(pdf,y,cols,rows);
    y=pdfTotais(pdf,y+RH,[["Valor emprestado",mt(d.valor)],["Juros totais",mt(d.juros)]],["TOTAL A PAGAR",mt(p.total)]);y+=RH;
    if(y+12*RH>287){pdf.addPage();y=20}
    pdfSecao(pdf,"CONDIÇÕES",y);
    y=pdfLinhasTexto(pdf,y+RH,["Juros simples: pagamento mensal = valor ÷ meses + valor × taxa.","As datas são previstas e contam a partir da assinatura do contrato.",`O atraso num pagamento pode dar lugar a uma multa de ${pct(d.multa)} do valor em atraso.`,"Este documento é uma simulação. O empréstimo só existe depois de aprovado e assinado o contrato."]);
  }else{
    const cols=[{t:"#",x:X.B,w:X.C-X.B,al:"center"},{t:"Descrição",x:X.C,w:X.D-X.C,wrap:true},{t:"Qtd",x:X.D,w:X.E-X.D,al:"center"},{t:"Unidade",x:X.E,w:X.F-X.E,al:"center",shrink:true},{t:"Preço unit. (MT)",x:X.F,w:X.H-X.F,al:"right"},{t:"Total (MT)",x:X.H,w:X.END-X.H,al:"right"}];
    const rows=(p.itens||[]).map((it,i)=>[String(i+1),it.desc,String(it.qtd),it.un||"un",mt(it.preco),mt(r2(it.qtd*it.preco))]);
    y=pdfTabela(pdf,y,cols,rows,8);
    y=pdfTotais(pdf,y+RH,[["Subtotal",mt(p.subtotal)],["IVA ("+pct(p.iva)+")",mt(p.iva_mt)]],["TOTAL",mt(p.total)]);y+=RH;
    if(p.tipo==="iptv"&&p.detalhes){y=pdfCampos(pdf,y,[["Plano:",(p.detalhes.planoNome||"")+" · "+p.detalhes.meses+(p.detalhes.meses===1?" mês":" meses")],["Ecrãs:",String(p.detalhes.ecras||1)],["Aparelho:",p.detalhes.aparelho||"—"]],X.D);y+=RH}
    if(y+12*RH>287){pdf.addPage();y=20}
    pdfSecao(pdf,"CONDIÇÕES / NOTAS",y);
    const cd=p.condicoes||{};
    y=pdfLinhasTexto(pdf,y+RH,[cd.pagamento?"Pagamento: "+cd.pagamento:"",cd.prazo?(p.tipo==="iptv"?"Ativação: ":"Prazo de execução: ")+cd.prazo:"","Cotação pedida online. Os valores ficam confirmados quando a Heel Service aceitar o pedido."]);
  }
  if(p.estado==="aceite"&&p.resposta){y+=RH;if(y+8*RH>287){pdf.addPage();y=20}pdfSecao(pdf,"RESPOSTA DA HEEL SERVICE",y);y=pdfLinhasTexto(pdf,y+RH,[p.resposta])}
  if(p.estado==="recusado"){y+=RH;pdfSecao(pdf,"PEDIDO NÃO ACEITE",y);y=pdfLinhasTexto(pdf,y+RH,["Motivo: "+(p.motivo||"—")])}
  pdfAssinatura(pdf,Math.min(Math.max(y+4*RH,200),255),e,data,{imagem:p.estado==="aceite"});
  pdfRodape(pdf,"Heel Service · "+(e.telefone||"+258 86 925 2812")+(e.email?" · "+e.email:""));
  return pdfOut(pdf,(p.numero||"pedido")+".pdf");
}

    b.disabled=false;b.textContent="Criar conta"}}

/* step 2: customer data and consent */
function resumoPedido(){if(P.tipo==="serv"){const L=P.cat.serv.servicos;const it=Object.entries(P.serv).map(([id,q])=>({x:L.find(y=>y.id===id),q})).filter(o=>o.x);const t=servTot();
    return`<div class="resumo">${it.map(o=>`<div class="l"><span>${o.q} × ${esc(o.x.nome)}</span><b>${mt(o.x.preco*o.q)}</b></div>`).join("")}<div class="l t"><span>Total sem IVA</span><b>${mt(t.s)}</b></div></div>`}
  if(P.tipo==="iptv"){const t=iptvTot();return t.p?`<div class="resumo"><div class="l"><span>IPTV ${esc(cap(t.p.nome))} · ${P.iptv.ecras} ${P.iptv.ecras===1?"ecrã":"ecrãs"}</span><b>${mt(t.s)}</b></div><div class="l"><span>Aparelho</span><b>${esc(P.iptv.aparelho)}</b></div></div>`:""}
  const s=microSim();return`<div class="resumo"><div class="l"><span>Empréstimo</span><b>${mt(P.micro.valor)}</b></div><div class="l"><span>Prazo</span><b>${P.micro.meses} ${P.micro.meses===1?"mês":"meses"}</b></div><div class="l t"><span>Paga por mês</span><b>${mt(s.paga)}</b></div></div>`}
function vDados(){if(!P.tipo)return vInicio();const k=P.tipo,nome={serv:"Serviços",iptv:"IPTV",micro:"Microcrédito"}[k];
  if(!P.user)return`<div class="wrap">${phHTML(k,nome,"Entre para enviar o pedido","Com uma conta guarda os seus dados e acompanha a resposta aos seus pedidos.")}<div class="layout"><div>${authHTML()}</div><aside class="side card panel"><h3>O seu pedido</h3>${resumoPedido()}</aside></div></div>`;
  const p=P.perfil||{},mc=k==="micro";
  return`<div class="wrap">${phHTML(k,nome,"Os seus dados","Usamos estes dados para preparar a cotação, registar o seu pedido e contactá-lo. Ficam guardados para os próximos pedidos.")}
  <div class="layout"><form class="card panel" id="fDados"><div class="grid2">
    <label class="f full">Nome completo<input name="nome" required maxlength="80" value="${esc(p.nome||"")}" autocomplete="name"></label>
    <label class="f">Telefone / WhatsApp<input name="telefone" type="tel" required maxlength="30" value="${esc(p.telefone||"")}" autocomplete="tel"></label>
    <label class="f">E-mail<input name="email" type="email" maxlength="120" value="${esc(p.email||P.user.email||"")}" readonly></label>
    <label class="f full">Morada<input name="morada" maxlength="160" value="${esc(p.morada||"")}" placeholder="Bairro, rua, número, cidade" autocomplete="street-address"${mc?" required":""}></label>
    <label class="f">N.º do BI${mc?"":" <small>(opcional)</small>"}<input name="bi" maxlength="30" value="${esc(p.bi||"")}"${mc?" required":""}></label>
    <label class="f">NUIT <small>(opcional)</small><input name="nuit" maxlength="20" inputmode="numeric" value="${esc(p.nuit||"")}"></label>
    ${mc?`<label class="f full">Ocupação / local de trabalho<input name="ocupacao" maxlength="80" required value="${esc(p.ocupacao||"")}"></label>
    <label class="f">Fiador (nome) <small>(se tiver)</small><input name="fiador_nome" maxlength="80" value="${esc(p.fiador_nome||"")}"></label>
    <label class="f">Fiador (telefone)<input name="fiador_tel" type="tel" maxlength="30" value="${esc(p.fiador_tel||"")}"></label>`:""}
  </div>
  <label class="check"><input type="checkbox" id="dCons" required> Autorizo a Heel Service a guardar estes dados e a usá-los para tratar este pedido e me contactar.</label>
  <p class="err" id="dErr" hidden></p>
  <button class="btn pri lg block" id="dOk">Enviar pedido e gerar cotação</button></form>
  <aside class="side card panel"><h3>O seu pedido</h3>${resumoPedido()}<p class="note">Depois de enviar, descarregue a cotação em PDF. O pedido fica pendente até a Heel Service responder.</p></aside></div></div>`}
LIGA.dados=()=>{if(!P.user){ligarAuth(()=>render());return}
  $("#fDados").onsubmit=async e=>{e.preventDefault();const er=$("#dErr");er.hidden=true;const fd=Object.fromEntries(new FormData(e.target));Object.keys(fd).forEach(k=>fd[k]=String(fd[k]).trim());
    if(!$("#dCons").checked){er.textContent="Precisa de autorizar o uso dos dados para enviar o pedido.";er.hidden=false;return}
    if(String(fd.telefone).replace(/\D/g,"").length<9){er.textContent="Indique um telefone válido.";er.hidden=false;return}
    const b=$("#dOk");b.disabled=true;b.textContent="A enviar…";
    try{const perfil={user_id:P.user.id,email:P.user.email,nome:fd.nome,telefone:fd.telefone,morada:fd.morada||"",bi:fd.bi||"",nuit:fd.nuit||"",atualizado_em:new Date().toISOString(),...(P.tipo==="micro"?{ocupacao:fd.ocupacao||"",fiador_nome:fd.fiador_nome||"",fiador_tel:fd.fiador_tel||""}:{})};
      const{error:e1}=await sb.from("portal_clientes").upsert(perfil);if(e1)throw e1;P.perfil={...P.perfil,...perfil};
      const cli={nome:fd.nome,telefone:fd.telefone,email:P.user.email,morada:fd.morada||"",bi:fd.bi||"",nuit:fd.nuit||"",ocupacao:fd.ocupacao||P.perfil.ocupacao||"",fiadorNome:fd.fiador_nome||"",fiadorTel:fd.fiador_tel||""};
      const row={tipo:P.tipo,cliente:cli};
      if(P.tipo==="serv")row.itens=Object.entries(P.serv).map(([sid,qtd])=>({sid,qtd}));
      if(P.tipo==="iptv")row.detalhes={plano:P.iptv.plano,ecras:P.iptv.ecras,aparelho:P.iptv.aparelho};
      if(P.tipo==="micro")row.detalhes={valor:P.micro.valor,meses:P.micro.meses,finalidade:P.micro.finalidade};
      const{data,error}=await sb.from("pedidos").insert(row).select().single();if(error)throw error;
      if(!P.pedidos.some(x=>x.id===data.id))P.pedidos.unshift(data);P.ultimo=data;if(P.tipo==="serv")P.serv={};ir("feito")}
    catch(err){er.textContent=erroTxt(err);er.hidden=false;b.disabled=false;b.textContent="Enviar pedido e gerar cotação"}}};

/* step 3: the quote must be downloaded */
function vFeito(){const p=P.ultimo;if(!p)return vPedidos();
  return`<div class="wrap"><div class="card done" style="margin-top:28px"><div class="ok">${IC.ok}</div><h2>Pedido enviado</h2><p class="num">Número do pedido <b>${esc(p.numero)}</b> · ${PED_TIPO[p.tipo]}</p>
    <p class="note" style="max-width:46ch">Descarregue a cotação para ver os valores e as condições. O seu pedido fica <b>pendente</b> até a Heel Service responder; a resposta aparece em “Os meus pedidos”.</p>
    <button class="btn pri lg" data-pdf="${p.id}">${IC.pdf} Descarregar cotação (PDF)</button>
    <a class="btn" href="#pedidos">Ver os meus pedidos</a></div></div>`}
async function descarregar(id,b){const p=P.pedidos.find(x=>x.id===+id)||P.ultimo;if(!p)return;if(b){b.disabled=true}
  try{const r=await pdfPedido(p,P.cat.empresa);if(r){await dl.save({filename:r.nome,data:r.blob});toast("Cotação descarregada")}
    if(!p.descarregado_em){await sb.rpc("pedido_cliente",{pid:p.id,acao:"descarregado"});p.descarregado_em=new Date().toISOString()}
    if(rota()==="pedidos")render()}catch(e){console.error(e);toast("Não foi possível criar o PDF.")}if(b)b.disabled=false}
document.addEventListener("click",e=>{const b=e.target.closest("[data-pdf]");if(b){descarregar(b.dataset.pdf,b);return}
  const c=e.target.closest("[data-cancel]");if(c){if(!c.dataset.ok){c.dataset.ok=1;c.textContent="Confirmar cancelamento";return}
    sb.rpc("pedido_cliente",{pid:+c.dataset.cancel,acao:"cancelar"}).then(({error})=>{if(error)return toast(erroTxt(error));const p=P.pedidos.find(x=>x.id===+c.dataset.cancel);if(p)p.estado="cancelado";toast("Pedido cancelado");render()})}});

/* my requests */
function vPedidos(){if(!P.user)return`<div class="wrap">${phHTML("serv","Os meus pedidos","Entre na sua conta","Veja o estado dos seus pedidos e descarregue as cotações.")}${authHTML()}</div>`;
  const L=P.pedidos;
  return`<div class="wrap"><div class="ph"><h1>Os meus pedidos</h1><p>${L.length?L.length+(L.length===1?" pedido":" pedidos")+". Descarregue a cotação para ver os valores de cada um.":"Ainda não fez nenhum pedido."}</p></div>
  ${L.length?L.map(p=>{const novo=!p.visto_cliente,baixou=!!p.descarregado_em,c=p.cliente||{};return`<article class="card ped${novo?" novo":""}" style="--k:${KOR[p.tipo]}">
    <div class="h"><div><b>${esc(p.numero)} · ${PED_TIPO[p.tipo]}</b><br><small>${fmtD(String(p.criado_em).slice(0,10))}${baixou?" · "+mt(p.total):""}</small></div><span class="pill ${p.estado}">${PED_ESTADO[p.estado]}</span></div>
    ${baixou?"":`<div class="lock">${IC.lock} Descarregue a cotação para ver os valores e as condições deste pedido.</div>`}
    ${p.estado==="aceite"?`<div class="msg aceite"><b>Pedido aceite${p.respondido_em?" a "+fmtD(String(p.respondido_em).slice(0,10)):""}</b>${esc(p.resposta||"Entraremos em contacto para o pagamento.")}</div>`:""}
    ${p.estado==="recusado"?`<div class="msg recusado"><b>Pedido não aceite</b>Motivo: ${esc(p.motivo||"—")}</div>`:""}
    <div class="acts"><button class="btn${baixou?"":" pri"} sm" data-pdf="${p.id}">${IC.pdf} ${baixou?"Descarregar outra vez":"Descarregar cotação"}</button>
      ${p.estado==="aceite"?`<a class="btn wa sm" target="_blank" rel="noopener" href="${waLink("Olá Heel Service, segue o comprovativo de pagamento do pedido "+p.numero+" ("+(c.nome||"")+").")}">Enviar comprovativo</a>`:""}
      ${p.estado==="pendente"?`<button class="btn sm" data-cancel="${p.id}">Cancelar pedido</button>`:""}
      <a class="btn sm" target="_blank" rel="noopener" href="${waLink("Olá Heel Service, tenho uma questão sobre o pedido "+p.numero+".")}">Falar sobre este pedido</a></div></article>`}).join(""):`<div class="card vazio"><p>Quando fizer um pedido, aparece aqui com a resposta da Heel Service.</p><a class="btn pri" href="#servicos">Fazer um pedido</a></div>`}</div>`}
LIGA.pedidos=()=>{if(!P.user){ligarAuth(()=>render());return}
  const nv=P.pedidos.filter(p=>!p.visto_cliente);if(nv.length)setTimeout(()=>{nv.forEach(p=>{p.visto_cliente=true;sb.rpc("pedido_cliente",{pid:p.id,acao:"visto"})});badges()},2500)};

/* account */
function vConta(){if(!P.user)return`<div class="wrap"><div class="ph"><h1>Entrar</h1><p>Use a sua conta de cliente para pedir e acompanhar as respostas.</p></div>${authHTML()}</div>`;
  const p=P.perfil||{};
  return`<div class="wrap"><div class="ph"><h1>A minha conta</h1><p>${esc(P.user.email)}</p></div>
  <div class="layout"><form class="card panel" id="fConta"><h3>Os meus dados</h3><div class="grid2">
    <label class="f full">Nome completo<input name="nome" required maxlength="80" value="${esc(p.nome||"")}"></label>
    <label class="f">Telefone / WhatsApp<input name="telefone" type="tel" required maxlength="30" value="${esc(p.telefone||"")}"></label>
    <label class="f">N.º do BI<input name="bi" maxlength="30" value="${esc(p.bi||"")}"></label>
    <label class="f full">Morada<input name="morada" maxlength="160" value="${esc(p.morada||"")}"></label>
    <label class="f">NUIT<input name="nuit" maxlength="20" value="${esc(p.nuit||"")}"></label>
    <label class="f">Ocupação<input name="ocupacao" maxlength="80" value="${esc(p.ocupacao||"")}"></label></div>
    <p class="err" id="cErr" hidden></p><button class="btn pri">Guardar</button></form>
  <aside class="side card panel"><h3>Senha</h3><form id="fSenha" class="panel" style="padding:0"><label class="f">Senha nova<input id="sN" type="password" autocomplete="new-password" required></label><p class="err" id="sErr" hidden></p><button class="btn">Mudar senha</button></form>
    <button class="btn block" id="sair">Sair da conta</button></aside></div></div>`}
LIGA.conta=()=>{if(!P.user){ligarAuth(()=>ir("pedidos"));return}
  $("#fConta").onsubmit=async e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));Object.keys(fd).forEach(k=>fd[k]=String(fd[k]).trim());
    const{error}=await sb.from("portal_clientes").upsert({user_id:P.user.id,email:P.user.email,...fd,atualizado_em:new Date().toISOString()});const er=$("#cErr");
    if(error){er.textContent=erroTxt(error);er.hidden=false;return}P.perfil={...P.perfil,...fd};toast("Dados guardados")};
  $("#fSenha").onsubmit=async e=>{e.preventDefault();const v=$("#sN").value,er=$("#sErr");if(v.length<8||!/\d/.test(v)||!/[A-Za-z]/.test(v)){er.textContent="Pelo menos 8 caracteres, com letras e números.";er.hidden=false;return}
    const{error}=await sb.auth.updateUser({password:v});if(error){er.textContent=erroTxt(error);er.hidden=false;return}er.hidden=true;$("#sN").value="";toast("Senha alterada")};
  $("#sair").onclick=async()=>{await sb.auth.signOut();await carregarConta();toast("Saiu da conta");ir("inicio")}};
function vNovaSenha(){return`<div class="wrap"><div class="ph"><h1>Criar senha nova</h1><p>Escolha uma senha nova para a sua conta.</p></div><form class="auth card panel" id="fNova"><label class="f">Senha nova<input id="nS" type="password" autocomplete="new-password" required><small>Pelo menos 8 caracteres, com letras e números.</small></label><p class="err" id="nErr" hidden></p><button class="btn pri lg block">Guardar senha</button></form></div>`}
LIGA["nova-senha"]=()=>{$("#fNova").onsubmit=async e=>{e.preventDefault();const v=$("#nS").value,er=$("#nErr");if(v.length<8||!/\d/.test(v)||!/[A-Za-z]/.test(v)){er.textContent="Pelo menos 8 caracteres, com letras e números.";er.hidden=false;return}
  const{error}=await sb.auth.updateUser({password:v});if(error){er.textContent=erroTxt(error);er.hidden=false;return}P.recup=false;history.replaceState(null,"",location.pathname+"#pedidos");await carregarConta();toast("Senha guardada");render()}};
const cap=s=>String(s||"").charAt(0).toUpperCase()+String(s||"").slice(1);

/* ---------- start ---------- */
(async()=>{
  try{const t=localStorage.getItem("hs_tema");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(_){}
  if(!window.supabase){app().innerHTML='<div class="loading">Não foi possível carregar. Verifique a Internet e recarregue.</div>';return}
  sb=window.supabase.createClient(window.HS_SUPA.url,window.HS_SUPA.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"hs-portal-cliente"}});
  if(/type=recovery/.test(location.hash))P.recup=true;
  sb.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY"){P.recup=true;render()}});
  try{await Promise.all([carregarCatalogo(),carregarConta()])}catch(e){console.error(e);app().innerHTML=`<div class="wrap"><div class="loading">Não foi possível carregar os serviços. Verifique a Internet e recarregue.<br><br><a class="btn wa" href="${waLink("Olá Heel Service")}">Falar pelo WhatsApp</a></div></div>`;return}
  if(P.recup&&!/^#(nova-senha)?$/.test(location.hash.split("&")[0]))history.replaceState(null,"",location.pathname+"#nova-senha");
  render();
})();

})();</script>
</body></html>
